<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root {
  --fosc: #2b2135; --fosc2: #3a2d48; --fosc3: #4a3a5c;
  --paper: #fbf6ea; --paper2: #f1e8d4; --tinta: #2b2135;
  --groc: #ffd84a; --groc2: #f2b705; --rosa: #ff3fa4; --verd: #2fa36b; --vermell: #d64545; --blau: #3b6fd8;
  --pix: "Press Start 2P", monospace; --txt: "Nunito", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1b1f27; color: var(--tinta); font-family: var(--txt); overflow: hidden; }
button { font: inherit; cursor: pointer; }
kbd { font-family: var(--mono); font-size: .85em; background: #fff; color: var(--tinta); border: 1px solid #bbb; border-bottom-width: 3px; border-radius: 5px; padding: 0 .35em; }
code { font-family: var(--mono); font-size: .92em; background: rgba(43,33,53,.08); padding: .05em .3em; border-radius: 4px; word-break: break-word; }
[hidden] { display: none !important; }

/* ---------- PORTADA ---------- */
#portada { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; overflow: auto; padding: 16px;
  background: radial-gradient(ellipse at 50% 120%, #ff3fa433, transparent 60%), linear-gradient(#1a1430, #2b2135 55%, #3a2d48); transition: opacity .5s; }
#portada.amagada { opacity: 0; pointer-events: none; }
.estrelles { position: absolute; inset: 0; pointer-events: none; background-image:
  radial-gradient(2px 2px at 20% 30%, #fff8, transparent), radial-gradient(2px 2px at 70% 20%, #fff6, transparent), radial-gradient(2px 2px at 40% 70%, #fff5, transparent),
  radial-gradient(2px 2px at 85% 60%, #fff7, transparent), radial-gradient(2px 2px at 10% 85%, #fff5, transparent), radial-gradient(2px 2px at 55% 45%, #ffd84a88, transparent); animation: parpelleig 4s infinite alternate; }
@keyframes parpelleig { to { opacity: .45; } }
.portada-cos { position: relative; text-align: center; max-width: 560px; width: 100%; }
.idiomes { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
.idiomes button { font-family: var(--pix); font-size: 10px; background: transparent; color: #c9b8e8; border: 2px solid #6a5a7a; border-radius: 6px; padding: 6px 9px; }
.idiomes button.triat { background: var(--groc); color: var(--fosc); border-color: var(--groc); }
.botons-hud .btn-idioma { font-family: var(--pix); font-size: 10px; }
.interior-registre { background: repeating-linear-gradient(0deg, #e8e1f5 0 26px, #d3c8ea 26px 28px), #e8e1f5; }
.interior-registre::before { content: ""; position: absolute; left: 10%; right: 10%; top: 30%; height: 18%; background: repeating-linear-gradient(90deg, #8a5bd6 0 60px, #6d45b0 60px 64px); border: 6px solid #46297a; }
.interior-observatori { background: radial-gradient(2px 2px at 20% 30%, #fff, transparent), radial-gradient(2px 2px at 60% 20%, #fff, transparent), radial-gradient(2px 2px at 80% 45%, #ffd84a, transparent), radial-gradient(2px 2px at 35% 55%, #fff, transparent), radial-gradient(circle at 70% 25%, #3a4d7a 0 70px, transparent 71px), linear-gradient(#0b0f1c, #1e2a4a); }
.supra { font-family: var(--pix); font-size: 10px; color: #c9b8e8; letter-spacing: 1px; margin: 0 0 14px; }
#portada h1 { font-family: var(--pix); font-size: clamp(26px, 7.5vw, 54px); margin: 0; color: var(--groc); text-shadow: 4px 4px 0 var(--rosa), 8px 8px 0 #0006; letter-spacing: 2px; }
.sub { font-family: var(--pix); font-size: clamp(10px, 2.6vw, 14px); color: #fff; margin: 16px 0 22px; }
.targeta-inici { background: var(--paper); border: 4px solid var(--fosc); box-shadow: 0 0 0 4px var(--groc), 10px 10px 0 4px #0006; border-radius: 6px; padding: 18px; text-align: left; }
.fila-inici { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
#previ-jugador { width: 96px; height: 96px; image-rendering: pixelated; background: #5fae4f; border: 3px solid var(--fosc); border-radius: 6px; flex: none; }
.camps { flex: 1; display: grid; gap: 8px; }
.camps label { display: grid; gap: 3px; font-weight: 800; font-size: 14px; }
.camps input { font: inherit; font-weight: 600; padding: 8px 10px; border: 3px solid var(--fosc); border-radius: 6px; background: #fff; }
.camps input:focus { outline: 3px solid var(--groc2); }
.etq { font-weight: 800; font-size: 14px; }
.colors { display: flex; gap: 8px; }
.mostra { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--fosc); }
.mostra.triat { outline: 3px solid var(--groc2); outline-offset: 2px; }
.boto { background: #fff; color: var(--tinta); border: 3px solid var(--fosc); border-radius: 6px; padding: 8px 14px; font-weight: 800; box-shadow: 0 3px 0 var(--fosc); transition: transform .05s; }
.boto:hover:not(:disabled) { background: #fff7d6; }
.boto:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--fosc); }
.boto:disabled { opacity: .45; cursor: not-allowed; }
.boto.primari { background: var(--groc); }
.boto.primari:hover:not(:disabled) { background: #ffe57f; }
.boto.fluix { background: transparent; box-shadow: none; border-color: #b9aec9; color: #6a5a7a; font-weight: 600; }
.boto.gran { width: 100%; padding: 12px; font-size: 16px; margin-top: 8px; font-family: var(--pix); font-size: 12px; }
.boto.petit { padding: 2px 8px; font-size: 12px; }
.enllac { background: none; border: 0; color: #6a5a7a; text-decoration: underline; margin-top: 10px; padding: 0; font-weight: 600; }
.ajuda-portada { font-size: 14px; line-height: 1.5; }
.confirma-nova { margin-top: 10px; background: #fff1f1; border: 2px dashed var(--vermell); padding: 10px; border-radius: 6px; font-size: 14px; }
.credits { color: #a898bf; font-size: 12px; margin-top: 16px; }

/* ---------- JOC ---------- */
#joc { position: fixed; inset: 0; }
#c { position: absolute; inset: 0; image-rendering: pixelated; }
#hud { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px; pointer-events: none; }
#hud > * { pointer-events: auto; }
.missio { background: var(--paper); border: 3px solid var(--fosc); border-radius: 6px; box-shadow: 4px 4px 0 #0005; padding: 8px 12px; max-width: min(460px, 52vw); font-weight: 700; font-size: 14px; line-height: 1.35; }
.etq-missio { display: block; font-family: var(--pix); font-size: 9px; color: #8a6d1a; margin-bottom: 4px; }
.dreta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.xifres { display: flex; gap: 10px; background: var(--fosc); color: #fff; border: 3px solid var(--fosc); outline: 2px solid var(--groc); border-radius: 6px; padding: 6px 10px; font-size: 14px; }
.xifres b { color: var(--groc); font-family: var(--pix); font-size: 11px; }
.botons-hud { display: flex; gap: 4px; }
.botons-hud button { width: 38px; height: 38px; font-size: 18px; background: var(--paper); border: 3px solid var(--fosc); border-radius: 6px; box-shadow: 0 3px 0 var(--fosc); padding: 0; }
.botons-hud button:hover { background: #fff7d6; }
#indicacio { position: absolute; left: 50%; bottom: 74px; transform: translate(-50%, 10px); z-index: 10; background: var(--fosc); color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 14px; opacity: 0; transition: .15s; pointer-events: none; border: 2px solid var(--groc); white-space: nowrap; }
#indicacio.visible { opacity: 1; transform: translate(-50%, 0); }
#barra-objectes { position: absolute; left: 10px; bottom: 10px; z-index: 10; display: flex; gap: 4px; }
.mini-obj { width: 34px; height: 34px; display: grid; place-items: center; font-size: 18px; background: #fffc; border: 2px solid var(--fosc); border-radius: 6px; }

/* ---------- DIÀLEG ---------- */
#dialeg { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 30; width: min(820px, calc(100% - 20px)); display: flex; gap: 14px; align-items: flex-start;
  background: var(--paper); border: 4px solid var(--fosc); box-shadow: 0 0 0 3px var(--groc), 8px 8px 0 3px #0006; border-radius: 8px; padding: 14px 16px; min-height: 120px; cursor: pointer; }
#dialeg.ocult { display: none; }
#dialeg:not(.ocult) ~ #tactil { display: none; }
#retrat { width: 72px; height: 72px; image-rendering: pixelated; background: linear-gradient(#bfe3ff, #8fc7f0); border: 3px solid var(--fosc); border-radius: 6px; flex: none; }
#dialeg.narrador { background: #f4f0ff; }
.cos-dialeg { flex: 1; min-width: 0; }
#dialeg .nom { font-family: var(--pix); font-size: 11px; color: #8a3f6a; margin-bottom: 8px; }
#dialeg .text { font-size: 17px; line-height: 1.5; font-weight: 600; min-height: 3em; }
#dialeg .text code { font-size: .85em; }
#dialeg .opcions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
#dialeg .segueix { position: absolute; right: 14px; bottom: 8px; color: var(--rosa); animation: bot .6s infinite alternate; }
@keyframes bot { to { transform: translateY(4px); } }

/* ---------- INTERIORS ---------- */
.interior { position: absolute; inset: 0; z-index: 20; opacity: 0; transition: opacity .4s; display: grid; place-items: start center; padding-top: 14vh; }
.interior.visible { opacity: 1; }
.interior-torre { background: radial-gradient(circle at 70% 30%, #ffffff55 0 60px, transparent 61px), linear-gradient(#6aa9e8, #3a6fb8 60%, #2b3f7a); }
.interior-torre::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 120px 40px at 25% 30%, #fff9, transparent), radial-gradient(ellipse 160px 50px at 60% 50%, #fff8, transparent), radial-gradient(ellipse 100px 30px at 85% 20%, #fff7, transparent); animation: nuvols 18s linear infinite alternate; }
@keyframes nuvols { to { transform: translateX(60px); } }
.interior-cinema { background: repeating-linear-gradient(90deg, #7a1028 0 30px, #5c0b1e 30px 60px); }
.interior-cinema::before { content: ""; position: absolute; left: 15%; right: 15%; top: 12%; height: 40%; background: linear-gradient(#fffbe8, #e8ddb5); box-shadow: 0 0 60px #fff8; border: 6px solid #2a1840; }
.interior-titol { position: relative; font-family: var(--pix); font-size: clamp(14px, 3vw, 24px); color: #fff; text-shadow: 3px 3px 0 var(--fosc); display: flex; gap: 14px; align-items: center; background: #2b2135cc; padding: 14px 20px; border-radius: 8px; border: 3px solid var(--groc); }
.interior-cinema .interior-titol { margin-top: 6vh; }

/* ---------- FINESTRES ---------- */
.modal-fons { position: absolute; inset: 0; z-index: 40; background: #120d1acc; display: grid; place-items: center; padding: 12px; animation: apareix .15s; }
@keyframes apareix { from { opacity: 0; } }
.finestra { background: var(--paper); border: 4px solid var(--fosc); box-shadow: 0 0 0 3px var(--groc), 10px 10px 0 3px #0007; border-radius: 8px; width: min(640px, 100%); max-height: calc(100vh - 24px); display: flex; flex-direction: column; animation: puja .2s; }
.finestra.ample { width: min(860px, 100%); }
@keyframes puja { from { transform: translateY(14px); } }
.finestra.sacseja { animation: sacseja .35s; }
@keyframes sacseja { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.finestra-cap { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--fosc); color: #fff; padding: 10px 14px; }
.finestra-cap h2 { margin: 0; font-family: var(--pix); font-size: 12px; line-height: 1.6; }
.finestra-cap h2 small { color: var(--groc); font-size: 9px; margin-left: 6px; }
.finestra-cap .tanca { background: none; border: 2px solid #fff6; color: #fff; border-radius: 6px; width: 32px; height: 32px; }
.finestra-cos { padding: 16px; overflow: auto; }
.botons { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.nota { color: #6a5a7a; font-size: 14px; margin: 6px 0 10px; }

/* ---------- REPTES ---------- */
.enunciat { font-size: 18px; font-weight: 700; line-height: 1.45; margin-bottom: 12px; }
pre.codi, .codi { font-family: var(--mono); font-size: 14px; background: #1e1a2b; color: #f1eefa; padding: 12px 14px; border-radius: 6px; overflow: auto; line-height: 1.6; margin: 0 0 12px; white-space: pre; }
.c-kw { color: #ff8fd0; } .c-str { color: #ffe08a; } .c-com { color: #8b84a6; font-style: italic; } .c-par { color: #9fe8b7; }
.opcions-quiz { display: grid; gap: 8px; }
.opcio { display: flex; gap: 10px; align-items: flex-start; text-align: left; background: #fff; border: 3px solid var(--fosc); border-radius: 6px; padding: 10px 12px; font-size: 15px; font-weight: 600; box-shadow: 0 3px 0 var(--fosc); line-height: 1.4; }
.opcio:hover:not(:disabled) { background: #fff7d6; }
.opcio .lletra { font-family: var(--pix); font-size: 10px; background: var(--fosc); color: var(--groc); border-radius: 4px; padding: 5px 6px; flex: none; margin-top: 1px; }
.opcio.bona, .peca.bona, .linia.bona { background: #d8f5e3 !important; border-color: var(--verd); }
.opcio.dolenta, .linia.dolenta { background: #ffe1e1 !important; border-color: var(--vermell); text-decoration: line-through; opacity: .8; }
.opcio:disabled { cursor: default; }
.feedback { margin-top: 12px; border-radius: 6px; font-size: 15px; line-height: 1.45; }
.feedback:empty { display: none; }
.feedback.ok { background: #e3f7ea; border: 3px solid var(--verd); padding: 10px 12px; }
.feedback.ko { background: #fff0f0; border: 3px solid var(--vermell); padding: 10px 12px; }
.feedback p { margin: 6px 0 0; }
.pista { color: #7a4a00; }
.ordenades { list-style: none; counter-reset: n; padding: 10px; margin: 0 0 10px; background: #efe6d2; border: 3px dashed #c9b88f; border-radius: 6px; min-height: 52px; display: grid; gap: 6px; }
.ordenades li { counter-increment: n; display: flex; gap: 8px; align-items: center; }
.ordenades li::before { content: counter(n); font-family: var(--pix); font-size: 10px; width: 22px; text-align: right; color: #8a6d1a; }
.ordenades li.buit { color: #8a7a5a; font-style: italic; }
.ordenades li.buit::before { content: ""; }
.pool { display: grid; gap: 6px; }
.peca { text-align: left; background: #fff; border: 3px solid var(--fosc); border-radius: 6px; padding: 8px 10px; font-weight: 600; font-size: 14px; box-shadow: 0 2px 0 var(--fosc); width: 100%; }
.peca:hover:not(:disabled) { background: #fff7d6; }
.peca.col { background: #fffdf5; }
.peca.dolenta { border-color: var(--vermell); background: #ffe9e9; }
.codi-ordre .peca, .codi-ordre + .pool .peca { font-family: var(--mono); font-size: 13px; white-space: pre; }
.aparella, .classifica { display: grid; gap: 8px; }
.fila-ap { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr; gap: 10px; align-items: center; background: #fff; border: 2px solid #d9cfb9; border-radius: 6px; padding: 8px; }
.fila-ap .esq, .fila-cl .esq { font-weight: 800; font-size: 15px; }
.aparella select, pre.omple select { font: inherit; font-size: 14px; padding: 6px; border: 3px solid var(--fosc); border-radius: 6px; background: #fff; width: 100%; }
pre.omple select { width: auto; font-family: var(--mono); font-size: 13px; padding: 1px 4px; background: #fff8d0; color: var(--tinta); border-width: 2px; vertical-align: baseline; }
select.dolenta { border-color: var(--vermell) !important; background: #ffe1e1 !important; }
.fila-cl { background: #fff; border: 2px solid #d9cfb9; border-radius: 6px; padding: 8px; display: grid; gap: 6px; }
.fila-cl.dolenta { border-color: var(--vermell); background: #fff3f3; }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cat { background: #f4efe4; border: 2px solid #b9aec9; border-radius: 6px; padding: 5px 9px; font-size: 13px; font-weight: 700; }
.cat.triat { background: var(--groc); border-color: var(--fosc); }
.xips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.xip { font-family: var(--mono); font-size: 13px; background: #fff; border: 2px solid var(--fosc); border-radius: 999px; padding: 6px 12px; box-shadow: 0 2px 0 var(--fosc); }
.xip.triat { background: var(--groc); }
.xips.petites .xip { font-size: 12px; padding: 3px 9px; }
pre.previ { white-space: pre-wrap; word-break: break-all; }
pre.omple { white-space: pre-wrap; }
.fila-input { display: flex; gap: 8px; align-items: center; }
.resposta { font: inherit; font-size: 18px; font-weight: 700; padding: 8px 12px; border: 3px solid var(--fosc); border-radius: 6px; width: 220px; }
.unitat { font-weight: 800; font-size: 18px; }
.codi.bug { padding: 6px; display: grid; }
.linia { display: flex; gap: 12px; text-align: left; font-family: var(--mono); font-size: 14px; color: #f1eefa; background: transparent; border: 2px solid transparent; border-radius: 4px; padding: 3px 8px; white-space: pre; }
.linia:hover:not(:disabled) { background: #ffffff14; border-color: #ffd84a88; }
.linia .num { color: #6f6890; width: 18px; text-align: right; flex: none; }
.linia.bona { color: var(--tinta); } .linia.dolenta { color: var(--tinta); }

/* ---------- MOTXILLA, APUNTS, MAPA ---------- */
.motxilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.obj { display: flex; gap: 10px; background: #fff; border: 3px solid var(--fosc); border-radius: 6px; padding: 10px; }
.obj p { margin: 4px 0; font-size: 13px; line-height: 1.4; }
.obj small { color: var(--verd); font-weight: 700; }
.obj.buit { opacity: .5; border-style: dashed; }
.obj.usat { background: #f6f3ec; }
.obj-icona { font-size: 30px; line-height: 1; }
.apunts { display: grid; gap: 8px; }
.apunt { background: #fff; border: 3px solid var(--fosc); border-radius: 6px; padding: 8px 12px; }
.apunt summary { font-weight: 800; cursor: pointer; }
.apunt.buit { opacity: .55; border-style: dashed; font-weight: 600; }
.apunt-text { font-size: 15px; line-height: 1.5; margin-top: 8px; }
.apunt-text pre { font-family: var(--mono); font-size: 13px; background: #1e1a2b; color: #f1eefa; padding: 8px 10px; border-radius: 6px; overflow: auto; }
.apunt-text table { border-collapse: collapse; width: 100%; font-size: 14px; }
.apunt-text td { border: 1px solid #ddd2bc; padding: 4px 6px; vertical-align: top; }
.mapa-gran { width: auto; max-width: 100%; max-height: calc(100vh - 170px); image-rendering: pixelated; border: 3px solid var(--fosc); border-radius: 6px; display: block; margin: auto; }
.llegenda { display: flex; align-items: center; gap: 6px; justify-content: center; margin-bottom: 8px; font-weight: 700; }
.punt { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid var(--fosc); }
.punt.rosa { background: var(--rosa); } .punt.groc { background: var(--groc); }
.ajuda .dues-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.ajuda h3 { font-family: var(--pix); font-size: 11px; margin: 0 0 10px; }
.ajuda td { padding: 4px 6px; font-size: 14px; } .ajuda li { margin-bottom: 6px; font-size: 14px; }

/* ---------- CONSOLA ---------- */
.modal-consola .finestra { background: #16131f; }
.modal-consola .finestra-cos { color: #e6e1f5; }
.encarrec { background: #2b2135; border: 2px dashed var(--groc); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 700; }
.encarrec code { background: #0006; color: var(--groc); }
.sortida { font-family: var(--mono); font-size: 13px; background: #0d0b13; border: 2px solid #3a2d48; border-radius: 6px; padding: 10px; height: min(46vh, 420px); overflow: auto; white-space: pre-wrap; word-break: break-word; }
.sortida > div { margin-bottom: 3px; }
.l-ordre { color: #9fd3ff; } .l-info { color: #8b84a6; } .l-ok { color: #7cfc9a; } .l-error { color: #ff7b8a; } .l-avis { color: #ffd84a; }
.l-json { color: #e6e1f5; background: #ffffff08; border-left: 3px solid #3a2d48; padding: 4px 8px; }
.j-key { color: #ff8fd0; } .j-str { color: #ffe08a; } .j-num { color: #9fe8b7; } .j-bool, .j-null { color: #8fb8ff; } .j-res { color: #8b84a6; font-style: italic; }
.foto-gos { display: block; max-width: 240px; max-height: 200px; border-radius: 6px; margin-top: 6px; border: 3px solid var(--groc); }

/* -------------------------------------------------------------------------

/* -------------------------------------------------------------------------
   APUNTS (pergamins que es recullen pel mapa i es llegeixen amb la tecla C)

const APUNTS = [
  { id: 'a1', titol: 'Què és una API', zona: 'Camí de la Cuina',
    text: `Una <b>API web</b> és una adreça (URL) d’un servidor que, en lloc de tornar una pàgina per mirar, torna <b>dades</b> perquè les faci servir un programa. Gairebé sempre en <b>JSON</b>.
<ul><li><b>Endpoint</b>: cada URL concreta de l’API.</li><li><b>Petició (request)</b>: el que enviem. Per llegir, una petició <code>GET</code>.</li><li><b>Resposta (response)</b>: un codi d’estat i un cos amb les dades.</li></ul>
El cambrer: tu (el component) no entres a la cuina (la base de dades). Fas una comanda ben feta (la URL) i el cambrer et porta el plat (el JSON).` },
  { id: 'a2', titol: 'Els codis d’estat', zona: 'La Cuina del Servidor',
    text: `<table><tr><td><b>200</b></td><td>OK: el cos porta les dades.</td></tr><tr><td><b>401</b></td><td>Unauthorized: no hi ha clau, està mal copiada o no està activada.</td></tr><tr><td><b>403</b></td><td>Forbidden: la clau és bona però el teu pla no inclou això.</td></tr><tr><td><b>404</b></td><td>Not Found: el que demanes no existeix.</td></tr><tr><td><b>429</b></td><td>Too Many Requests: massa peticions en poc temps.</td></tr><tr><td><b>500</b></td><td>Internal Server Error: ha fallat el servidor.</td></tr></table>
Consell: abans de programar contra una API, mira la resposta al navegador i a DevTools → <b>Network</b> (filtre Fetch/XHR).` },
  { id: 'a3', titol: 'fetch i els dos await', zona: 'La Gossera Dog CEO',
    text: `<pre>const resposta = await fetch(url);
const dades = await resposta.json();</pre>
<code>fetch</code> no torna les dades: torna una <b>promesa</b>. El primer <code>await</code> espera la resposta; el segon, que se’n llegeixi tot el cos. Si oblides el segon, tens <code>Promise {&lt;pending&gt;}</code> i <code>dades.message</code> val <code>undefined</code>.<br><code>await</code> només es pot fer servir dins d’una funció <code>async</code>.` },
  { id: 'a4', titol: 'Els quatre estats i try/catch/finally', zona: 'El Laboratori PokéAPI',
    text: `<pre>const [nom, setNom] = useState('pikachu');
const [pokemon, setPokemon] = useState&lt;Pokemon | null&gt;(null);
const [carregant, setCarregant] = useState(false);
const [error, setError] = useState('');</pre>
Abans de demanar: <code>setCarregant(true)</code>, s’esborren l’error i el resultat. Dins el <code>try</code>, la petició. Al <code>catch</code>, el missatge d’error. Al <code>finally</code> (s’executa sempre), <code>setCarregant(false)</code>.` },
  { id: 'a5', titol: 'Un 404 NO és un error per a fetch', zona: 'El Laboratori PokéAPI',
    text: `<table><tr><td>Sense xarxa, servidor inexistent o CORS</td><td>fetch llança error (TypeError: Failed to fetch) → el recull el <code>catch</code>.</td></tr><tr><td>El servidor respon 404, 429, 500…</td><td>fetch NO llança error: <code>resposta.ok</code> és <code>false</code> → hem de fer <code>throw</code> a mà.</td></tr><tr><td>El servidor respon 200</td><td>Llegim el JSON i el guardem a l’estat.</td></tr></table>
<pre>if (!resposta.ok) {
  throw new Error(\`Error \${resposta.status}\`);
}</pre>` },
  { id: 'a6', titol: 'SoQL i URLSearchParams', zona: 'L’Arxiu de Dades Obertes',
    text: `Les dades obertes de la Generalitat (Socrata) entenen paràmetres semblants a SQL:
<table><tr><td><code>$select</code></td><td>quins camps vull</td></tr><tr><td><code>$where</code></td><td>filtre (com el WHERE)</td></tr><tr><td><code>$order</code></td><td>ordre</td></tr><tr><td><code>$limit</code></td><td>quants registres com a màxim (si no, fins a 1.000)</td></tr><tr><td><code>$q</code></td><td>cerca de text lliure</td></tr></table>
<pre>const parametres = new URLSearchParams({
  $where: \`codi_municipi='\${codi}'\`, $limit: '10' });
const url = \`\${API}?\${parametres}\`;</pre>
<code>URLSearchParams</code> codifica els caràcters especials ($ → %24, ' → %27…).` },
  { id: 'a7', titol: 'useEffect, [url] i la neteja', zona: 'L’Arxiu de Dades Obertes',
    text: `Sense clic, la petició va dins d’un <code>useEffect</code>: es fa quan apareix el component i cada cop que canvia <code>url</code> (dependència <code>[url]</code>).
<pre>useEffect(() => {
  let ignorar = false;
  async function carregar() { … if (!ignorar) setDades(dades); }
  carregar();
  return () => { ignorar = true; };
}, [url]);</pre>
La funció de l’efecte no pot ser <code>async</code>. La neteja evita la <b>condició de carrera</b>. En desenvolupament, <code>&lt;StrictMode&gt;</code> executa l’efecte dues vegades a propòsit. <b>Mai</b> un fetch directament al cos del component: bucle infinit.` },
  { id: 'a8', titol: 'El hook propi useFetch<T>', zona: 'El Taller dels Hooks',
    text: `Quan una lògica amb hooks es repeteix, la traiem a un hook propi:
<pre>export function useFetch&lt;T&gt;(url: string) {
  const [dades, setDades] = useState&lt;T | null&gt;(null);
  const [carregant, setCarregant] = useState(true);
  const [error, setError] = useState('');
  useEffect(() => { … }, [url]);
  return { dades, carregant, error };
