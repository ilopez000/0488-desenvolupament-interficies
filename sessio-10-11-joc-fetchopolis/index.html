const IDIOMES = ['ca', 'es', 'en'];
const CLAU_IDIOMA = 'fetchopolis-0488-idioma';
const TRAD = { ca: null, es: {"CAPITOLS": [{"nom": "La Cocina del Servidor", "tema": "Qué es una API, el JSON y los códigos de estado"}, {"nom": "La Perrera Dog CEO", "tema": "fetch, async y await"}, {"nom": "El Laboratorio PokéAPI", "tema": "Estados de carga y de error, try/catch y resposta.ok"}, {"nom": "El Archivo de Datos Abiertos", "tema": "SoQL, URLSearchParams, useEffect y la limpieza"}, {"nom": "El Taller de los Hooks y el Puente CORS", "tema": "El hook useFetch, errores típicos y CORS"}, {"nom": "La Oficina de las Claves", "tema": "Claves de API, errores 401/403 y el archivo .env"}, {"nom": "La Torre del Tiempo", "tema": "OpenWeather: la clave va en la URL"}, {"nom": "El Cine TMDB", "tema": "TMDB: el token en la cabecera y dos APIs encadenadas"}, {"nom": "La Puerta del Proxy", "tema": "La clave no es secreta en el navegador: el proxy de Vite"}, {"nom": "El Mercado de los Retos", "tema": "Ampliar los ejemplos: raza de perro, Pokémon sorpresa y búsqueda con $q"}, {"nom": "El Delta del Llobregat", "tema": "iNaturalist y GBIF: arrays de resultados, campos opcionales y matchType"}, {"nom": "El Registro de las Claves", "tema": "Conseguir las claves, planes gratuitos, vite-env.d.ts y missatgeError"}, {"nom": "El Observatorio", "tema": "Unidades, geolocalización, previsión a 5 días, ficha y páginas de TMDB"}, {"nom": "La Playa del Prat", "tema": "Open-Meteo Marine y cómo abordar cualquier API nueva"}, {"nom": "El Bucle Infinito", "tema": "Combate final: todo lo que has aprendido"}], "OBJECTES": {"portatil": {"nom": "Portátil de dev", "desc": "Abre la consola con la tecla T. Desde ahí puedes hacer peticiones REALES con fetch y ver la respuesta."}, "clau_gossera": {"nom": "Llave de la Perrera", "desc": "Abre la valla de la Perrera Dog CEO, al este de la plaza."}, "segon_await": {"nom": "El segundo await", "desc": "El que espera a que se lea el cuerpo de la respuesta: await resposta.json(). Alguien de la plaza lo está buscando…"}, "passi_lab": {"nom": "Pase del Laboratorio", "desc": "Abre la valla del Laboratorio PokéAPI, al sureste."}, "escut": {"nom": "Escudo try/catch", "desc": "Si algo del try falla, el catch lo para. Y el finally siempre está ahí."}, "carnet_arxiu": {"nom": "Carné del Archivo", "desc": "Abre la valla del Archivo de Datos Abiertos, al noroeste."}, "escombra": {"nom": "Escoba de limpieza", "desc": "La función de limpieza de useEffect: ignorar = true. Barre las respuestas que ya no interesan."}, "clau_taller": {"nom": "Llave del Taller", "desc": "Abre la valla del Taller de los Hooks, al suroeste."}, "hook": {"nom": "Hook useFetch<T>", "desc": "Tres estados, un efecto, try/catch y limpieza… todo en una sola línea: const { dades, carregant, error } = useFetch<T>(url)."}, "capcalera_cors": {"nom": "Cabecera CORS", "desc": "Access-Control-Allow-Origin: *. El Guardián del puente te ha dejado pasar al Distrito de las Claves."}, "gitignore": {"nom": "Archivo .gitignore", "desc": ".env · .env.* · !.env.example. Protege los secretos: sin él, el Cofre de los Secretos no se abre."}, "clau_owm": {"nom": "Clave de OpenWeather", "desc": "VITE_OWM_KEY. 32 caracteres. Va DENTRO de la URL, en el parámetro appid. Abre la Torre del Tiempo."}, "token_tmdb": {"nom": "Token de TMDB", "desc": "VITE_TMDB_TOKEN. El largo, empieza por eyJ… Va en la cabecera Authorization: Bearer. Abre el Cine."}, "butlleti": {"nom": "Boletín del tiempo", "desc": "weather[0].main = \"Rain\". En Girona llueve. Con esto el Cine decidirá qué género de película pedir."}, "bobina": {"nom": "Bobina del Plan de tarde", "desc": "Dos APIs encadenadas: el tiempo decide el género y TMDB devuelve las películas. El Portero Proxy quiere verla."}, "capa": {"nom": "Capa del proxy", "desc": "Con ella el token viaja escondido: el navegador habla con el servidor y es el servidor quien pone la clave. También abre la reja del Sur."}, "prismatics": {"nom": "Prismáticos", "desc": "Abren la valla del Delta del Llobregat. Para mirar pájaros… y JSON."}, "formulari": {"nom": "Formulario de registro", "desc": "Rellénalo y el Registro de las Claves te abrirá la puerta."}, "clau_observatori": {"nom": "Llave del Observatorio", "desc": "Abre la cúpula del Observatorio, donde se hacen los retos de OpenWeather y TMDB."}, "coordenades": {"nom": "Coordenadas de la playa", "desc": "latitude=41.29 · longitude=2.11. Abren el paso a la Playa del Prat."}, "petxina": {"nom": "Concha del 200 OK", "desc": "Si te la acercas a la oreja, oyes el sonido de una API que responde bien. El último trozo que faltaba para detener el Bucle."}}, "APUNTS": {"a1": {"titol": "Qué es una API", "zona": "Camino de la Cocina", "text": "Una <b>API web<\/b> es una dirección (URL) de un servidor que, en lugar de devolver una página para mirar, devuelve <b>datos<\/b> para que los use un programa. Casi siempre en <b>JSON<\/b>.\n<ul><li><b>Endpoint<\/b>: cada URL concreta de la API.<\/li><li><b>Petición (request)<\/b>: lo que enviamos. Para leer, una petición <code>GET<\/code>.<\/li><li><b>Respuesta (response)<\/b>: un código de estado y un cuerpo con los datos.<\/li><\/ul>\nEl camarero: tú (el componente) no entras en la cocina (la base de datos). Haces un pedido bien hecho (la URL) y el camarero te trae el plato (el JSON)."}, "a2": {"titol": "Los códigos de estado", "zona": "La Cocina del Servidor", "text": "<table><tr><td><b>200<\/b><\/td><td>OK: el cuerpo trae los datos.<\/td><\/tr><tr><td><b>401<\/b><\/td><td>Unauthorized: no hay clave, está mal copiada o no está activada.<\/td><\/tr><tr><td><b>403<\/b><\/td><td>Forbidden: la clave es buena, pero tu plan no incluye esto.<\/td><\/tr><tr><td><b>404<\/b><\/td><td>Not Found: lo que pides no existe.<\/td><\/tr><tr><td><b>429<\/b><\/td><td>Too Many Requests: demasiadas peticiones en poco tiempo.<\/td><\/tr><tr><td><b>500<\/b><\/td><td>Internal Server Error: ha fallado el servidor.<\/td><\/tr><\/table>\nConsejo: antes de programar contra una API, mira la respuesta en el navegador y en DevTools → <b>Network<\/b> (filtro Fetch/XHR)."}, "a3": {"titol": "fetch y los dos await", "zona": "La Perrera Dog CEO", "text": "<pre>const resposta = await fetch(url);\nconst dades = await resposta.json();<\/pre>\n<code>fetch<\/code> no devuelve los datos: devuelve una <b>promesa<\/b>. El primer <code>await<\/code> espera la respuesta; el segundo, a que se lea todo el cuerpo. Si te olvidas del segundo, tienes <code>Promise {&lt;pending&gt;}<\/code> y <code>dades.message<\/code> vale <code>undefined<\/code>.<br><code>await<\/code> solo se puede usar dentro de una función <code>async<\/code>."}, "a4": {"titol": "Los cuatro estados y try/catch/finally", "zona": "El Laboratorio PokéAPI", "text": "<pre>const [nom, setNom] = useState('pikachu');\nconst [pokemon, setPokemon] = useState&lt;Pokemon | null&gt;(null);\nconst [carregant, setCarregant] = useState(false);\nconst [error, setError] = useState('');<\/pre>\nAntes de pedir: <code>setCarregant(true)<\/code>, y se borran el error y el resultado. Dentro del <code>try<\/code>, la petición. En el <code>catch<\/code>, el mensaje de error. En el <code>finally<\/code> (se ejecuta siempre), <code>setCarregant(false)<\/code>."}, "a5": {"titol": "Un 404 NO es un error para fetch", "zona": "El Laboratorio PokéAPI", "text": "<table><tr><td>Sin red, servidor inexistente o CORS<\/td><td>fetch lanza un error (TypeError: Failed to fetch) → lo recoge el <code>catch<\/code>.<\/td><\/tr><tr><td>El servidor responde 404, 429, 500…<\/td><td>fetch NO lanza error: <code>resposta.ok<\/code> es <code>false<\/code> → tenemos que hacer <code>throw<\/code> a mano.<\/td><\/tr><tr><td>El servidor responde 200<\/td><td>Leemos el JSON y lo guardamos en el estado.<\/td><\/tr><\/table>\n<pre>if (!resposta.ok) {\n  throw new Error(`Error ${resposta.status}`);\n}<\/pre>"}, "a6": {"titol": "SoQL y URLSearchParams", "zona": "El Archivo de Datos Abiertos", "text": "Los datos abiertos de la Generalitat (Socrata) entienden parámetros parecidos a SQL:\n<table><tr><td><code>$select<\/code><\/td><td>qué campos quiero<\/td><\/tr><tr><td><code>$where<\/code><\/td><td>filtro (como el WHERE)<\/td><\/tr><tr><td><code>$order<\/code><\/td><td>orden<\/td><\/tr><tr><td><code>$limit<\/code><\/td><td>cuántos registros como máximo (si no, hasta 1.000)<\/td><\/tr><tr><td><code>$q<\/code><\/td><td>búsqueda de texto libre<\/td><\/tr><\/table>\n<pre>const parametres = new URLSearchParams({\n  $where: `codi_municipi='${codi}'`, $limit: '10' });\nconst url = `${API}?${parametres}`;<\/pre>\n<code>URLSearchParams<\/code> codifica los caracteres especiales ($ → %24, ' → %27…)."}, "a7": {"titol": "useEffect, [url] y la limpieza", "zona": "El Archivo de Datos Abiertos", "text": "Sin clic, la petición va dentro de un <code>useEffect<\/code>: se hace cuando aparece el componente y cada vez que cambia <code>url<\/code> (dependencia <code>[url]<\/code>).\n<pre>useEffect(() => {\n  let ignorar = false;\n  async function carregar() { … if (!ignorar) setDades(dades); }\n  carregar();\n  return () => { ignorar = true; };\n}, [url]);<\/pre>\nLa función del efecto no puede ser <code>async<\/code>. La limpieza evita la <b>condición de carrera<\/b>. En desarrollo, <code>&lt;StrictMode&gt;<\/code> ejecuta el efecto dos veces a propósito. <b>Nunca<\/b> pongas un fetch directamente en el cuerpo del componente: bucle infinito."}, "a8": {"titol": "El hook propio useFetch<T>", "zona": "El Taller de los Hooks", "text": "Cuando una lógica con hooks se repite, la sacamos a un hook propio:\n<pre>export function useFetch&lt;T&gt;(url: string) {\n  const [dades, setDades] = useState&lt;T | null&gt;(null);\n  const [carregant, setCarregant] = useState(true);\n  const [error, setError] = useState('');\n  useEffect(() => { … }, [url]);\n  return { dades, carregant, error };\n}<\/pre>\nY en el componente: <code>const { dades, carregant, error } = useFetch&lt;Pokemon&gt;(url);<\/code><br>En proyectos grandes: TanStack Query o SWR (caché, reintentos…)."}, "a9": {"titol": "CORS y las claves en el front-end", "zona": "El Puente CORS", "text": "«… has been blocked by CORS policy»: el servidor no permite que una web de otro dominio le pida datos. Es una protección del navegador, no un error de tu código. Las APIs de clase envían <code>Access-Control-Allow-Origin: *<\/code>. Si no, hace falta un servidor intermedio propio.<br><br>Todo el código del front-end se puede leer desde el navegador (F12 → Sources): una clave privada en el código de React la puede ver cualquiera."}, "a10": {"titol": "El archivo .env", "zona": "La Oficina de las Claves", "text": "<pre># .env  (MAI a GitHub)\nVITE_OWM_KEY=3f9a1c0b…\nVITE_TMDB_TOKEN=eyJhbGciOi…<\/pre>\n<pre># .gitignore\n.env\n.env.*\n!.env.example<\/pre>\nVite solo pasa al código las variables que empiezan por <code>VITE_<\/code>: <code>import.meta.env.VITE_OWM_KEY ?? ''<\/code>. El .env solo se lee al arrancar: si lo cambias, Ctrl+C y <code>npm run dev<\/code>. En Windows, cuidado con <code>.env.txt<\/code>."}, "a11": {"titol": "Dos maneras de enviar la clave", "zona": "El Distrito de las Claves", "text": "<b>OpenWeather<\/b>: la clave es un parámetro más de la URL.\n<pre>…/data/2.5/weather?q=Barcelona&amp;appid=CLAU&amp;units=metric&amp;lang=ca<\/pre>\n<b>TMDB<\/b>: el token va en la cabecera.\n<pre>fetch(url, {\n  headers: {\n    Authorization: `Bearer ${TOKEN_TMDB}`,\n    accept: 'application/json',\n  },\n});<\/pre>\n«Bearer» + UN espacio + el token largo (eyJ…). Con la API Key corta, 401."}, "a12": {"titol": "El proxy de Vite", "zona": "La Puerta del Proxy", "text": "Todo lo que empieza por <code>VITE_<\/code> acaba dentro del JavaScript que recibe el navegador. Para esconder la clave de verdad, el navegador habla con <b>nuestro servidor<\/b> y es el servidor quien añade el token:\n<pre>proxy: { '/tmdb': {\n  target: 'https://api.themoviedb.org',\n  changeOrigin: true,\n  rewrite: (cami) => cami.replace(/^\\/tmdb/, ''),\n  headers: { Authorization: `Bearer ${env.TMDB_TOKEN}` },\n} }<\/pre>\n<code>TMDB_TOKEN<\/code> va sin <code>VITE_<\/code>. Una vez publicado, lo hace una función de servidor (Cloudflare, Netlify, Vercel o un backend propio)."}, "a13": {"titol": "Ampliar un ejemplo: solo cambia la URL", "zona": "El Mercado de los Retos", "text": "Para pedir una raza concreta, el JSON es idéntico: solo cambia la URL.\n<pre>const url = `https://dog.ceo/api/breed/${raca}/images/random`;<\/pre>\nUn Pokémon al azar entre el 1 y el 151:\n<pre>Math.floor(Math.random() * 151) + 1<\/pre>\nPara añadir un campo nuevo (como <code>abilities<\/code>), primero se añade al <b>type<\/b>. Y con <code>$q<\/code>: si el texto está vacío, no lo envíes. Si la URL está en las dependencias del efecto, no hace falta tocar nada más."}, "a14": {"titol": "iNaturalist y GBIF", "zona": "El Delta del Llobregat", "text": "<b>iNaturalist<\/b>: las observaciones están en el array <code>results<\/code>. De cada una: <code>photos[0].url<\/code>, <code>taxon.preferred_common_name<\/code> (puede no venir: campo opcional con <code>?<\/code>) y <code>taxon.name<\/code> (nombre científico).\n<pre>…/v1/observations?lat=41.30&amp;lng=2.09&amp;radius=5&amp;per_page=12&amp;photos=true<\/pre>\n<b>GBIF<\/b>: <code>…/v1/species/match?name=Phoenicopterus%20roseus<\/code> devuelve <code>scientificName<\/code>, <code>kingdom<\/code>, <code>order<\/code>, <code>family<\/code> y <code>matchType<\/code>. Si <code>matchType<\/code> vale <code>NONE<\/code>, no lo ha encontrado."}, "a15": {"titol": "Conseguir las claves", "zona": "El Registro de las Claves", "text": "<b>OpenWeather<\/b>: cuenta → My API keys (Default) → clave de 32 caracteres en <code>VITE_OWM_KEY<\/code>. Puede tardar hasta 2 h en activarse. Plan gratuito: 60 peticiones/minuto y 1.000.000/mes. No hace falta One Call 3.0.<br>\n<b>TMDB<\/b>: cuenta → settings/api → uso personal y no comercial → copia el <b>API Read Access Token<\/b> (eyJ…) en <code>VITE_TMDB_TOKEN<\/code>. Unas 40 peticiones/s. Hay que incluir la atribución.<br>\nEn el repositorio va <code>.env.example<\/code> (plantilla vacía), y <code>vite-env.d.ts<\/code> le dice a TypeScript qué variables hay."}, "a16": {"titol": "Retos de la sesión 11", "zona": "El Observatorio", "text": "<ul><li><b>Unidades<\/b>: <code>units=metric<\/code> (°C) o <code>imperial<\/code> (°F); cambia también el símbolo.<\/li>\n<li><b>¿Dónde estoy?<\/b> <code>navigator.geolocation.getCurrentPosition<\/code> → <code>lat<\/code> y <code>lon<\/code> en la URL en lugar de <code>q<\/code>.<\/li>\n<li><b>Previsión<\/b>: <code>/data/2.5/forecast<\/code> devuelve <code>list<\/code>, una previsión cada 3 horas: quédate con la de las 12:00.<\/li>\n<li><b>Ficha<\/b>: <code>/3/movie/{id}<\/code> con <code>overview<\/code>, <code>runtime<\/code> y <code>genres<\/code>; con <code>useApi<\/code>, URL a <code>null<\/code> mientras no se haya elegido ninguna.<\/li>\n<li><b>Páginas<\/b>: <code>page<\/code> y <code>total_pages<\/code>.<\/li><\/ul>"}, "a17": {"titol": "Cualquier API nueva, en cinco pasos", "zona": "La Playa del Prat", "text": "<ol><li>Prueba la URL en el navegador y mira el JSON.<\/li><li>Escribe el <b>type<\/b> solo con los campos que vas a usar.<\/li><li>Llama a <code>useFetch&lt;T&gt;(url)<\/code> (o <code>useApi<\/code> si hace falta token).<\/li><li>Pinta los tres estados: cargando, error y datos.<\/li><li>Compruébalo en DevTools → Network.<\/li><\/ol>\nEjemplo: <code>https://marine-api.open-meteo.com/v1/marine?latitude=41.29&amp;longitude=2.11&amp;current=wave_height,sea_surface_temperature<\/code> → <code>current<\/code> y <code>current_units<\/code>."}}, "REPTES": {"c1_api": {"enunciat": "Antes de servirte nada, una pregunta de la casa: ¿qué es una <b>API web<\/b>?", "pista": "Piensa en lo que devuelve: no es una página para mirar…", "explica": "Una API es una URL que devuelve datos (normalmente JSON) para un programa. fetch ya viene con el navegador: no hace falta instalar nada.", "opcions": ["Una dirección (URL) de un servidor que devuelve datos para que los use un programa, casi siempre en JSON", "Una librería de React que se instala con npm para poder hacer peticiones", "Una página web pensada para que la lea una persona", "La base de datos que hay dentro del servidor"]}, "c1_plat": {"enunciat": "En mi restaurante, tú eres el componente. Yo, el camarero. La cocina, la base de datos. Entonces… ¿qué es el <b>plato<\/b> que te traigo a la mesa?", "pista": "El pedido es la URL. Lo que vuelve de la cocina…", "explica": "Haces un pedido bien hecho (la URL) y el camarero te trae el plato (el JSON). Tú nunca entras en la cocina.", "opcions": ["La URL", "El JSON de la respuesta", "El componente de React", "El código de estado 200"]}, "c1_vocab": {"enunciat": "La chef quiere que la ayudes a etiquetar la carta. Relaciona cada palabra con lo que significa:", "pista": "Hay una definición que habla de GET y otra de códigos de estado.", "explica": "Endpoint = una URL concreta. Request = lo que enviamos (GET para leer). Response = código de estado + cuerpo. JSON = el formato de los datos.", "parelles": [["Endpoint", "Cada URL concreta de la API, como /api/breeds/image/random"], ["Petición (request)", "Lo que enviamos; para leer datos, una petición GET"], ["Respuesta (response)", "Un código de estado (200, 404…) y un cuerpo con los datos"], ["JSON", "Texto con la forma de los objetos { } y los arrays [ ] de JavaScript"]]}, "c1_camps": {"enunciat": "Has hecho el pedido a <code>https://dog.ceo/api/breeds/image/random<\/code>. ¿Qué <b>dos campos<\/b> trae el JSON del plato?", "pista": "Mira la consola: el JSON tiene dos claves.", "explica": "Dog CEO devuelve { \"message\": \"https://images.dog.ceo/…jpg\", \"status\": \"success\" }. message es la dirección de la foto.", "opcions": ["message y status", "url y ok", "image y breed", "data y error"]}, "c1_codis": {"enunciat": "En la pared de la cocina están los códigos de estado. Ponle a cada uno su significado:", "pista": "El 4xx suele ser «culpa» de la petición; el 5xx, del servidor.", "explica": "200 = todo bien · 404 = no existe · 429 = demasiadas peticiones · 500 = error del servidor.", "parelles": [["200 OK", "Todo correcto: el cuerpo trae los datos"], ["404 Not Found", "Esta URL no existe (un Pokémon que no existe)"], ["429 Too Many Requests", "Has hecho demasiadas peticiones en poco tiempo: la API te frena"], ["500 Internal Server Error", "Ha fallado el servidor; no es culpa tuya, pero tienes que gestionarlo"]]}, "c1_network": {"enunciat": "Un cliente se queja: «¡La API no funciona!». ¿Qué pestaña de DevTools (F12) te dice si la petición ha salido, qué se ha pedido y qué ha vuelto?", "pista": "Red…", "explica": "En Network (Red) cada petición es una fila: en Headers están la URL y el estado; en Preview/Response, el JSON. Es tu mejor amiga cuando una API «no funciona».", "opcions": ["Network (filtro Fetch/XHR)", "Elements", "Lighthouse", "Application"]}, "c1_tres": {"enunciat": "La idea clave de la casa: para usar una API desde React solo hace falta saber <b>tres cosas<\/b>. Márcalas:", "pista": "Son tres y todas dependen de lo que ves desde fuera de la cocina.", "explica": "Qué URL, qué forma tiene el JSON y dónde lo guardamos (useState). De la cocina no necesitas saber nada.", "peces": ["Qué URL pedir", "Qué forma tiene el JSON que devuelve", "Dónde lo guardaremos (en el estado, con useState)", "En qué lenguaje está programado el servidor", "Qué librería de npm hay que instalar para hacer peticiones", "Qué base de datos usa la cocina"]}, "c2_promesa": {"enunciat": "Bru te pregunta antes de dejarte tocar nada: ¿qué devuelve <code>fetch('https://…')<\/code> directamente?", "pista": "Por eso le ponemos await delante…", "explica": "fetch envía la petición y devuelve una Promise. await espera a que se cumpla sin bloquear la página.", "opcions": ["Una promesa (Promise): un «vale» que se cumplirá cuando llegue la respuesta", "El objeto de JavaScript con los datos ya convertidos", "Un texto con el JSON de la respuesta", "Nada: fetch guarda los datos en el estado automáticamente"]}, "c2_omple": {"enunciat": "Al código del botón «Vull un gos!» le faltan piezas. Devuélvelas a su sitio:", "pista": "Dos await: uno para fetch y otro para leer el cuerpo.", "explica": "await fetch(…) espera la respuesta; await resposta.json() la convierte en objeto; dades.message es la dirección de la foto."}, "c2_viatge": {"enunciat": "Ordena el viaje de una petición, desde que el usuario pulsa el botón hasta que ve el perro:", "pista": "Empieza por el clic y acaba con React pintando.", "explica": "Clic → petición → respuesta → .json() → set… → React vuelve a pintar. Cada set… provoca un nuevo pintado.", "peces": ["El usuario pulsa «Vull un gos!» y onClick llama a demanarGos", "fetch envía una petición GET a dog.ceo", "El primer await espera la respuesta (status 200)", "await resposta.json() convierte el cuerpo en un objeto", "setFoto(dades.message) guarda la dirección en el estado", "React vuelve a pintar el componente y se ve la imagen"]}, "c2_onclick": {"enunciat": "¿Por qué escribimos <code>onClick={demanarGos}<\/code> y no <code>onClick={demanarGos()}<\/code>?", "pista": "Con paréntesis, la función se ejecuta justo en ese momento…", "explica": "Sin paréntesis pasamos la función; React la llamará cuando haya clic.", "opcions": ["Porque pasamos la función para que React la llame al hacer clic; con paréntesis la llamaríamos al pintar el componente", "Porque las funciones async no pueden llevar paréntesis", "Da igual: las dos formas hacen lo mismo", "Porque con paréntesis TypeScript no deja compilar"]}, "c2_and": {"enunciat": "¿Qué hace esta línea del JSX?", "pista": "Un texto vacío es «falso» para JavaScript.", "explica": "Renderizado condicional: con '' no se pinta nada. Y el alt siempre: es para los lectores de pantalla.", "opcions": ["Mientras foto sea '' (falso) no pinta nada; cuando ya hay una URL, pinta la imagen", "Pinta la imagen y la variable foto a la vez", "Si foto está vacía, muestra una imagen rota", "Hace la petición a la API cuando foto cambia"]}, "c2_tipus": {"enunciat": "¿Por qué escribimos <code>type RespostaGos = { message: string; status: string }<\/code>?", "pista": "La API es un servidor de Internet: TypeScript no lo puede adivinar.", "explica": "El type copia la forma del JSON que hemos visto en el navegador. Los nombres tienen que ser los de la API (aunque estén en inglés). Así VS Code autocompleta dades.message.", "opcions": ["TypeScript no sabe qué devolverá la API; se lo explicamos copiando la forma del JSON, con los nombres exactos y solo los campos que vamos a usar", "Porque fetch no funciona si no le pasamos un type", "Porque el servidor lo lee para saber qué campos tiene que enviar", "Para traducir los nombres de los campos al catalán"]}, "c2_forats": {"enunciat": "Bru dice que el primer ejemplo «todavía tiene dos agujeros». ¿Cuáles?", "pista": "El usuario no sabe si está cargando… ¿y si falla?", "explica": "Falta el estado de carga y el tratamiento de errores. Lo arregla el ejemplo de PokéAPI (en el Laboratorio).", "opcions": ["No avisa mientras carga, y si no hay conexión el usuario no ve ningún error (solo sale en rojo en la consola)", "No usa ningún useEffect y no tiene key en la lista", "La foto no tiene alt y el botón no tiene type", "No lleva clave de API y no comprueba el CORS"]}, "c2_pending": {"enunciat": "Pendiente lleva horas esperando. En la consola le sale <code>Promise {&lt;pending&gt;}<\/code> y <code>undefined<\/code>. <b>Haz clic en la línea que falla:<\/b>", "pista": "resposta.json() también es una promesa.", "explica": "Falta el segundo await: const dades = await resposta.json();. Sin él, dades es una Promise pendiente y dades.message vale undefined."}, "c3_pes": {"enunciat": "Ya tienes la ficha de <b>pikachu<\/b> en la consola. El campo <code>weight<\/code> viene en <b>hectogramos<\/b>. ¿Cuántos <b>kilos<\/b> pesa?", "pista": "Mira el campo weight y divídelo entre 10.", "explica": "weight = 60 hectogramos → 60 / 10 = 6 kg. Por eso en el JSX escribimos {pokemon.weight / 10} kg.", "solucio": "6 kg (weight 60 / 10)"}, "c3_alcada": {"enunciat": "Y el campo <code>height<\/code> viene en <b>decímetros<\/b>. ¿Cuántos <b>metros<\/b> mide?", "pista": "height vale 4. Divide entre 10.", "explica": "height = 4 decímetros → 0,4 m.", "solucio": "0,4 m (height 4 / 10)"}, "c3_array": {"enunciat": "En el tipo <code>Pokemon<\/code> está esta línea. ¿Qué significan los <code>[]<\/code> del final?", "pista": "En el JSON, types va entre corchetes.", "explica": "Los [] significan «array de». Para pintarlo: pokemon.types.map((t) => t.type.name).join(', ') → \"electric\".", "opcions": ["«Array de»: types es un array de objetos", "Que el campo es opcional", "Que el campo es de solo lectura", "Que el valor puede ser null"]}, "c3_estats": {"enunciat": "La Dra. Sprite usa cuatro estados en el buscador. ¿Para qué sirve cada uno?", "pista": "Uno es para el input, uno para los datos, uno para esperar y uno para los problemas.", "explica": "nom (input) · pokemon (datos o null) · carregant (true/false) · error ('' si no hay).", "parelles": [["nom", "Lo que escribe el usuario en el input (input controlado)"], ["pokemon", "La respuesta de la API; null significa «todavía no hay ninguno»"], ["carregant", "true mientras la petición está fuera y todavía no ha vuelto"], ["error", "El mensaje de error; texto vacío = ningún error"]]}, "c3_cercar": {"enunciat": "La función <code>cercar<\/code> se ha desordenado en la pizarra. Vuelve a ponerla en orden:", "pista": "Primero se prepara el estado, después el try con la petición, el catch y el finally.", "explica": "Preparar estados → try (fetch, comprobar ok, json, set) → catch (mensaje) → finally (dejar de cargar)."}, "c3_404": {"enunciat": "Has pedido <b>pikatxu<\/b> y el servidor ha respondido <b>404<\/b>. ¿Ha lanzado algún error <code>fetch<\/code>?", "pista": "Mira el ok de la consola…", "explica": "fetch solo lanza error si no llega ninguna respuesta (red, CORS…). Con un 404 hace falta: if (!resposta.ok) throw new Error(…).", "opcions": ["No: para fetch, un 404 también es «haber recibido una respuesta»; resposta.ok es false y tenemos que hacer throw nosotros", "Sí: fetch siempre lanza error si el código no es 200", "Sí, y el catch lo atrapa automáticamente", "No, porque PokéAPI devuelve 200 aunque no exista"]}, "c3_llanca": {"enunciat": "Clasifica cada situación según lo que hace <code>fetch<\/code>:", "pista": "Si el servidor CONTESTA (con el código que sea), fetch no lanza nada.", "explica": "Sin respuesta (red, CORS) → TypeError: Failed to fetch. Con respuesta 4xx/5xx → ok es false. Con 200 → datos.", "categories": ["fetch lanza error → lo recoge el catch", "NO lanza: hay que mirar ok y hacer throw", "Todo bien: leer el JSON"], "items": ["No hay conexión a Internet", "El navegador lo bloquea por CORS", "El servidor responde 404", "El servidor responde 500", "El servidor responde 429", "El servidor responde 200"]}, "c3_finally": {"enunciat": "Finally, el conserje, dice que él «siempre está ahí». ¿Por qué ponemos <code>setCarregant(false)<\/code> dentro del <code>finally<\/code>?", "pista": "Ni solo si va bien ni solo si va mal…", "explica": "finally = siempre. Así «Carregant…» desaparece tanto si llegan los datos como si sale el error.", "opcions": ["Porque el finally se ejecuta siempre, tanto si ha ido bien como si no: es el sitio ideal para salir de «carregant»", "Porque el finally solo se ejecuta si ha habido un error", "Porque es obligatorio poner algo dentro", "Porque así se ejecuta antes que el try"]}, "c3_form": {"enunciat": "El ayudante del laboratorio ha montado el formulario del buscador. ¿Qué hace cada pieza?", "pista": "Una evita recargar, una limpia el texto, una bloquea el botón y la otra es para el Enter.", "explica": "preventDefault (no recargar) · trim/toLowerCase (« Pikachu » → pikachu) · disabled (no lanzar diez seguidas) · onSubmit (Enter).", "parelles": [["e.preventDefault()", "Evita que el navegador envíe el formulario a la antigua y recargue la página"], ["nom.trim().toLowerCase()", "La API solo entiende nombres en minúsculas y sin espacios"], ["disabled={carregant}", "Mientras la petición está fuera, el botón no se puede volver a pulsar"], ["<form onSubmit={…}>", "Permite buscar también pulsando Enter, no solo con el botón"]]}, "c4_params": {"enunciat": "La Sra. SoQL te enseña los parámetros de la API de Socrata. Relaciónalos:", "pista": "Son casi palabras de SQL.", "explica": "SoQL (Socrata Query Language): $select, $where, $order, $limit y $q.", "parelles": [["$select", "Qué campos quiero (menos campos, respuesta más pequeña)"], ["$where", "Filtro, como el WHERE de SQL"], ["$order", "Orden del resultado"], ["$limit", "Cuántos registros como máximo (si no, hasta 1.000)"], ["$q", "Búsqueda de texto libre en todos los campos"]]}, "c4_url": {"enunciat": "Monta la URL que pide <b>los 3 primeros equipamientos de El Prat de Llobregat<\/b> (código 81691), <b>ordenados por nombre<\/b>, con solo <b>nombre, categoría y vía<\/b>. Elige las piezas:", "pista": "Filtra por el código, no por el nombre (los datos están sucios). Y la API de datos abiertos no pide clave.", "explica": "Filtramos por codi_municipi porque el nombre sale escrito de tres maneras. Datos abiertos: sin clave, pero pidiendo solo lo necesario ($select, $limit)."}, "c4_array": {"enunciat": "Mira la respuesta del Archivo en la consola. ¿Qué es?", "pista": "Empieza por [ …", "explica": "A diferencia de Dog CEO o PokéAPI, Socrata devuelve un array de objetos. Por eso el tipo es Equipament[] y lo pintamos con .map().", "opcions": ["Un array [ … ] con 3 objetos", "Un solo objeto { … } con 3 campos", "Un texto con 3 líneas", "Un número: 3"]}, "c4_codi": {"enunciat": "¿Por qué en el ejemplo filtramos por <code>codi_municipi<\/code> y no por el nombre del municipio?", "pista": "«Prat de Llobregat, el», «El Prat de Llobregat», «Prat de Llobregat, El»…", "explica": "Con datos reales pasa siempre: el código es estable y el texto no.", "opcions": ["Porque los datos reales están sucios: El Prat sale escrito de tres maneras, y el código siempre es el mismo", "Porque Socrata no deja filtrar por texto", "Porque los códigos ocupan menos en la URL", "Porque el nombre es un campo privado"]}, "c4_usp": {"enunciat": "¿Qué nos ahorra <code>new URLSearchParams({ … })<\/code>?", "pista": "Fíjate en cómo queda la URL en la consola…", "explica": "URLSearchParams monta los pares nombre=valor con & y los codifica. Después: const url = `${API}?${parametres}`.", "opcions": ["Construye la parte de después del ? y codifica los caracteres especiales ($ → %24, ' → %27, espacios…)", "Hace la petición y lee el JSON", "Valida que la URL exista antes de pedirla", "Añade automáticamente la clave de API"]}, "c4_effect": {"enunciat": "En el ejemplo de PokéAPI la petición la lanzaba un clic. ¿Por qué aquí la ponemos dentro de un <code>useEffect<\/code>?", "pista": "Nadie pulsa ningún botón…", "explica": "useEffect sincroniza el componente con el servidor. Dependencia [url]: si cambia la URL, se vuelve a ejecutar.", "opcions": ["Porque no hay clic: queremos cargar cuando aparece el componente y cada vez que cambie el municipio (sincronizar con algo de fuera)", "Porque fetch solo funciona dentro de un useEffect", "Porque así la petición es más rápida", "Porque useEffect guarda los datos en la caché"]}, "c4_bucle": {"enunciat": "Un becario ha subido este componente y la pestaña Network se llena de peticiones sin parar. <b>Haz clic en la línea culpable:<\/b>", "pista": "Cada pintado… hace una petición… que hace un set… que hace un pintado…", "explica": "Un fetch en el cuerpo del componente se repite en cada pintado: bucle infinito. Va dentro de un useEffect con [url] (o de un evento)."}, "c4_async": {"enunciat": "¿Por qué no escribimos <code>useEffect(async () =&gt; { … }, [url])<\/code>?", "pista": "Una función async siempre devuelve… una promesa.", "explica": "Dentro del efecto: async function carregar() { … } y, justo después, carregar();", "opcions": ["Porque la función del efecto tiene que devolver nada o una función de limpieza, no una promesa; por eso definimos una función async dentro y la llamamos", "Porque async está prohibido en React", "Porque entonces el efecto se ejecutaría dos veces", "Sí que se puede: es la manera recomendada"]}, "c4_carrera": {"enunciat": "Carrera elige Barcelona y, enseguida, Cornellà. Ordena lo que pasa gracias a la variable <code>ignorar<\/code>:", "pista": "Cada ejecución del efecto tiene su propia ignorar.", "explica": "Sin la limpieza, la respuesta tardía de Barcelona sobrescribiría Cornellà: una condición de carrera (race condition).", "peces": ["Elige Barcelona: se ejecuta el efecto A y sale su petición (su ignorar vale false)", "Elige Cornellà: React llama a la limpieza de A (la ignorar de A pasa a true) y ejecuta el efecto B", "Llega la respuesta B: su ignorar es false → se pinta Cornellà", "Llega tarde la respuesta A: su ignorar es true → no se toca nada"]}, "c4_strict": {"enunciat": "El Fantasma del StrictMode te pregunta, con voz doble: «¿Por qué ves <b>dos<\/b> peticiones en Network al abrir la pestaña?»", "pista": "Mira main.tsx…", "explica": "StrictMode nos ayuda a encontrar efectos sin limpieza. En producción solo hay una petición.", "opcions": ["En desarrollo, <StrictMode> ejecuta cada efecto dos veces a propósito; la primera queda ignorada y con npm run build solo se hace una", "Porque el servidor de Socrata siempre responde dos veces", "Porque hay un error en el código que hay que arreglar", "Porque el navegador siempre hace las peticiones por duplicado"]}, "c4_deps": {"enunciat": "Cambias el municipio en el desplegable y la lista <b>no cambia<\/b>. ¿Qué pasa?", "pista": "¿Cuándo se vuelve a ejecutar un efecto?", "explica": "El efecto se repite cuando cambia alguna dependencia. Sin url en [url], React no sabe que tiene que volver a pedir.", "opcions": ["La url no está en las dependencias del efecto: hace falta [url]", "Falta la key en la lista", "Socrata no permite cambiar de municipio", "Hay que volver a hacer npm run dev"]}, "c5_peces": {"enunciat": "El Maestro Hook forja un <code>useFetch<\/code>. ¿Qué piezas van dentro?", "pista": "Todo lo que se repetía en los ejemplos 2 y 3, pero nada que se pinte.", "explica": "El hook tiene la lógica de la petición; el JSX se queda en el componente.", "peces": ["Tres useState: dades, carregant y error", "Un useEffect con [url]", "try/catch/finally y la comprobación de resposta.ok", "La variable ignorar y la función de limpieza", "El JSX de la lista de resultados", "Un <form> con onSubmit", "La clave privada de la API escrita a mano"]}, "c5_omple": {"enunciat": "Completa la cabecera y el final del hook:", "pista": "Un hook genérico, como useLocalStorage<T> de la sesión 9.", "explica": "useFetch<T> es genérico: quien lo llama dice qué forma tienen los datos. Empiezan en null y se devuelven en un objeto."}, "c5_us": {"enunciat": "¿Cuál es la manera correcta de usar el hook en un componente?", "pista": "El hook devuelve un objeto, no un array; y los hooks no van dentro de efectos.", "explica": "Una sola línea sustituye los tres useState, el efecto y el try/catch. Cogemos lo que queremos por su nombre.", "opcions": ["const { dades, carregant, error } = useFetch<Pokemon>(url);", "const dades = await useFetch(url);", "const [dades, setDades] = useFetch<Pokemon>(url);", "useEffect(() => useFetch(url), [url]);"]}, "c5_seguent": {"enunciat": "En la Pokédex, pulsas «Següent →» y se ejecuta <code>setId(id + 1)<\/code>. ¿Por qué se hace una petición nueva?", "pista": "`…/pokemon/${id}`", "explica": "id → url → [url] → efecto → nueva petición. Y disabled={id === 1}: no existe ningún Pokémon número 0.", "opcions": ["Porque cambiar id cambia la URL, que es la dependencia del efecto de dentro del hook", "Porque el botón llama a fetch directamente", "Porque useFetch hace una petición cada segundo", "Porque setId borra la caché del navegador"]}, "c5_errors": {"enunciat": "Colgados en la pared del taller están los errores típicos. Relaciona cada síntoma con su solución:", "pista": "Uno es de promesas, uno de null, uno de listas y uno de códigos de estado.", "explica": "Son cuatro de los errores típicos de la sesión 10.", "parelles": [["Se pinta undefined o sale Promise {<pending>}", "Falta un await: uno para fetch y otro para .json()"], ["Cannot read properties of null (reading 'sprites')", "Píntalas dentro de {dades && …}: en el primer pintado valen null"], ["Each child in a list should have a unique \"key\" prop", "Pon key con el identificador que da la API"], ["Error 404 pero en la pantalla no sale nada", "if (!resposta.ok) throw new Error(…)"]]}, "c5_cors": {"enunciat": "«¡Alto! Soy el Guardián CORS. En la consola has visto <i>… has been blocked by CORS policy<\/i>. ¿Qué significa?»", "pista": "Lo bloquea el navegador, no tu código.", "explica": "CORS es una protección del navegador. El servidor tiene que decir explícitamente que acepta peticiones de otras webs.", "opcions": ["Que el servidor no permite que una web de otro dominio le pida datos: es una protección del navegador, no un error de tu código", "Que la URL está mal escrita", "Que te has olvidado del segundo await", "Que el servidor se ha caído (error 500)"]}, "c5_capcalera": {"enunciat": "«¿Qué cabecera de respuesta envían Dog CEO, PokéAPI y Socrata para que puedas usarlas desde cualquier web?»", "pista": "Allow… Origin…", "explica": "Access-Control-Allow-Origin: * significa «cualquier origen puede leer esta respuesta». Si una API no la envía, hace falta un servidor intermedio propio.", "opcions": ["Access-Control-Allow-Origin: *", "Authorization: Bearer …", "Content-Type: text/html", "Cache-Control: no-cache"]}, "c5_clau": {"enunciat": "«Detrás de mí está el Distrito de las Claves. Última pregunta: si pones una clave privada dentro del código de React, ¿quién puede verla?»", "pista": "El navegador tiene que descargar el código para ejecutarlo…", "explica": "Las claves privadas no pueden vivir en el front-end. En el Distrito verás cómo se guardan (.env) y cómo se esconden de verdad (proxy).", "opcions": ["Cualquier usuario: todo el código del front-end se puede leer desde el navegador (F12 → Sources)", "Nadie: el código de React se compila y queda cifrado", "Solo los demás desarrolladores del repositorio", "Solo el servidor de la API"]}, "c6_perque": {"enunciat": "La Notaria Env te atiende: «¿Por qué algunas APIs (el tiempo, películas, mapas…) piden una clave?»", "pista": "Plan gratuito, cuota, límite…", "explica": "Si superas el límite del plan gratuito, el servidor te responde con un error (429) en lugar de los datos.", "opcions": ["Porque cuestan dinero de mantener: con la clave el servidor sabe quién eres, qué plan tienes y cuántas peticiones llevas", "Porque sin clave el JSON no se puede leer", "Porque la clave cifra los datos que viajan", "Porque lo exige React"]}, "c6_vocab": {"enunciat": "Rellena el registro de la Oficina: relaciona cada palabra con su significado.", "pista": "El sobre, el portador, el archivo .env…", "explica": "Clave = identificación · header = fuera de la URL · Bearer = portador · variable de entorno = .env.", "parelles": [["Clave de API (API key)", "Texto único que te identifica ante una API (32 caracteres en OpenWeather)"], ["Cabecera (header)", "Información que viaja con la petición pero fuera de la URL, como el remitente de un sobre"], ["Bearer", "«Portador»: deja pasar a quien lleva este token"], ["Variable de entorno", "Un valor que el programa lee de fuera del código: del archivo .env"]]}, "c6_codis": {"enunciat": "Con clave, los errores tienen matices. ¿Qué significa cada código?", "pista": "401 y 403 se parecen: en uno falla la clave; en el otro, el plan.", "explica": "401 = clave · 403 = permiso del plan · 404 = no existe · 429 = cuota.", "parelles": [["401 Unauthorized", "No hay clave, está mal copiada o todavía no está activada"], ["403 Forbidden", "La clave es buena, pero tu plan no incluye esto"], ["404 Not Found", "La clave es buena, pero lo que pides no existe (una ciudad inventada)"], ["429 Too Many Requests", "Demasiadas peticiones en poco tiempo: espera y vuelve a intentarlo"]]}, "c6_401": {"enunciat": "Un alumno dice: «Me sale un 401, no me funciona Internet». ¿Qué le respondes?", "pista": "Si hay código de estado, es que alguien ha contestado.", "explica": "Un 401 significa que el servidor ha respondido. Mira que la clave esté bien copiada, sin espacios, y que el .env se haya cargado.", "opcions": ["Que sí que tiene: la petición ha llegado al servidor y le ha contestado; el problema es la clave", "Que reinicie el router", "Que es un error de CORS", "Que el servidor se ha caído"]}, "c6_gitignore": {"enunciat": "Para conseguir el <b>.gitignore<\/b> tienes que escribirlo bien. Completa las líneas:", "pista": "El ! es una excepción.", "explica": ".env y sus variantes no se suben; !.env.example sí (es la plantilla vacía para que los demás sepan qué variables hay que rellenar)."}, "c6_vite": {"enunciat": "En el .env has escrito <code>OWM_KEY=3f9a…<\/code> (sin prefijo). ¿Qué vale <code>import.meta.env.OWM_KEY<\/code> en el código?", "pista": "El prefijo es obligatorio.", "explica": "Tiene que ser VITE_OWM_KEY. Y en la URL veríais appid=undefined.", "opcions": ["undefined: Vite solo pasa al código del navegador las variables que empiezan por VITE_", "La clave, sin problemas", "Un error de compilación", "Un texto vacío"]}, "c6_reinicia": {"enunciat": "Has creado el .env con <code>npm run dev<\/code> en marcha y el aviso «Falta una clau» no se va. ¿Qué haces?", "pista": "Vite lee el .env en un momento concreto…", "explica": "Y en Windows, comprueba que el archivo no se llame .env.txt y que esté al lado del package.json (no en src/).", "opcions": ["Parar el servidor (Ctrl+C) y volver a hacer npm run dev: el .env solo se lee al arrancar", "Esperar dos horas", "Poner la clave directamente en el .tsx", "Borrar node_modules"]}, "c6_fuga": {"enunciat": "Git, el robot guardián, te pregunta: «Si ya has subido la clave a GitHub, ¿basta con borrar el .env y hacer otro commit?»", "pista": "Git recuerda todos los commits…", "explica": "Regenera la clave y comprueba que .env está en el .gitignore antes del siguiente git add (o git rm --cached .env).", "opcions": ["No: la clave sigue en el historial y hay robots que las buscan; hay que borrarla en la web de la API y crear una nueva", "Sí, con un commit nuevo ya desaparece", "Sí, si además haces git push --force", "No hace falta hacer nada: las claves de plan gratuito no se pueden usar"]}, "c6_nullish": {"enunciat": "¿Qué hace el <code>?? ''<\/code> de esta línea de <code>claus.ts<\/code>?", "pista": "?? es el operador de «valor por defecto» si es null o undefined.", "explica": "Con un string garantizado, cada ejemplo puede mostrar el aviso <AvisClau> cuando falta la clave.", "opcions": ["Si la variable es undefined, usa ''; así siempre es un string y podemos preguntar if (!CLAU_OPENWEATHER)", "Cifra la clave", "Comprueba que la clave tenga 32 caracteres", "Borra los espacios del final"]}, "c7_url": {"enunciat": "La Meteoróloga necesita la URL del tiempo de Barcelona <b>en grados Celsius<\/b> y con la descripción <b>en catalán<\/b>. Elige las piezas:", "pista": "En OpenWeather la clave es un parámetro más, y tiene que llamarse exactamente appid.", "explica": "…/weather?q=Barcelona&appid=…&units=metric&lang=ca. La clave va dentro de la URL; por eso fetch(url) no lleva segundo parámetro."}, "c7_kelvin": {"enunciat": "¿Y si te olvidas de <code>units=metric<\/code>, en qué unidad llega la temperatura?", "pista": "21 °C serían unos 294…", "explica": "Por defecto, OpenWeather devuelve kelvin. Con metric: °C y viento en m/s. Con imperial: °F.", "opcions": ["En kelvin", "En grados Fahrenheit", "En grados Celsius igualmente", "No llega: error 400"]}, "c7_activa": {"enunciat": "Has copiado bien la clave, recién creada, y la Torre responde <b>401<\/b>. ¿Por qué?", "pista": "Paciencia…", "explica": "Por eso el primer paso de la sesión es registrarse en OpenWeather. Y no hace falta One Call 3.0 (se contrata aparte); usamos Current Weather.", "opcions": ["Una clave nueva de OpenWeather puede tardar hasta 2 horas en activarse", "Porque te has suscrito a One Call 3.0", "Porque la clave va en la cabecera", "Porque Barcelona no existe"]}, "c7_vent": {"enunciat": "El anemómetro de la torre marca <code>temps.wind.speed = 5<\/code> (metros por segundo). ¿Cuántos <b>km/h<\/b> son?", "pista": "Multiplica por 3,6.", "explica": "5 × 3,6 = 18 km/h. En el JSX: {Math.round(temps.wind.speed * 3.6)} km/h.", "solucio": "18 km/h (5 × 3,6)"}, "c7_cel": {"enunciat": "¿Por qué escribimos <code>const cel = temps?.weather[0];<\/code>?", "pista": "?. se llama encadenamiento opcional.", "explica": "Si temps es null, cel vale undefined y no peta nada. Después pintamos {temps && cel && (…)}.", "opcions": ["weather es un array (puede haber más de un estado del cielo) y cogemos el primero; ?. evita el error cuando temps todavía es null", "Porque weather es un número y [0] lo convierte en texto", "Porque ?. hace la petición si temps es null", "Porque weather[0] siempre es la temperatura"]}, "c7_hooks": {"enunciat": "En <code>TempsCiutat<\/code>, ¿dónde va el <code>if (!CLAU_OPENWEATHER) return &lt;AvisClau … /&gt;;<\/code>?", "pista": "«Rendered fewer hooks than expected»…", "explica": "Todos los hooks arriba; los return de aviso, después.", "opcions": ["Después de todos los useState: los hooks se tienen que llamar siempre, en el mismo orden, nunca después de un return", "Antes de los useState, para no gastar memoria", "Dentro del useEffect", "Dentro de la función consultar"]}, "c7_icona": {"enunciat": "El icono del tiempo está en <code>https://openweathermap.org/img/wn/10d@2x.png<\/code>. ¿Hay que enviarle la clave?", "pista": "Pasa lo mismo con los carteles de TMDB.", "explica": "Las imágenes (iconos, carteles) son públicas. Solo las peticiones a la API de datos llevan clave.", "opcions": ["No: es una imagen pública; el navegador la pide sin clave", "Sí, con appid en la URL", "Sí, con Authorization: Bearer", "Solo si el usuario no ha iniciado sesión"]}, "c8_omple": {"enunciat": "El proyector no arranca. Completa la petición a TMDB:", "pista": "El segundo parámetro de fetch son las opciones; las cabeceras van en headers.", "explica": "fetch(url, { headers: { Authorization: `Bearer ${TOKEN_TMDB}` } }). El resto (ok, json, estados) es igual que en la sesión 10."}, "c8_token": {"enunciat": "TMDB te da <b>dos<\/b> claves. ¿Cuál va detrás de <code>Bearer<\/code>?", "pista": "La corta va en la URL (?api_key=…).", "explica": "Si pones la corta detrás de Bearer, tendrás un 401.", "opcions": ["El API Read Access Token, la larga que empieza por eyJ…", "La API Key corta de 32 caracteres", "Cualquiera de las dos", "La contraseña de tu cuenta de TMDB"]}, "c8_espai": {"enunciat": "El proyeccionista tiene el token bueno, pero TMDB le responde <b>401<\/b>. <b>Haz clic en la línea que falla:<\/b>", "pista": "Cuenta los espacios…", "explica": "«Bearer» + UN espacio + el token: `Bearer ${TOKEN_TMDB}`."}, "c8_any": {"enunciat": "Para la tarjeta de <b>Dune<\/b>: ¿qué devuelve <code>\"2021-09-15\".slice(0, 4)<\/code>?", "pista": "Los 4 primeros caracteres.", "explica": "release_date.slice(0, 4) → \"2021\". Si no hay fecha, la tarjeta pone un guion.", "solucio": "\"2021\""}, "c8_cartell": {"enunciat": "Una película tiene <code>poster_path: null<\/code>. ¿Qué hace la tarjeta?", "pista": "poster_path ? <img> : <div>", "explica": "Por eso el tipo dice poster_path: string | null. Los carteles están en https://image.tmdb.org/t/p/w185 + poster_path.", "opcions": ["Pinta un recuadro «Sin cartel» en lugar de una imagen rota", "Pinta la imagen igualmente con src=\"null\"", "Vuelve a hacer la petición hasta que haya cartel", "Lanza un error y no pinta la lista"]}, "c8_generes": {"enunciat": "En el mostrador del Plan de tarde está el diccionario <code>PROPOSTA_PER_TEMPS<\/code>. Relaciona cada tiempo con su género:", "pista": "Llueve: manta, sofá y una de animación.", "explica": "Record<string, Proposta>: la clave es weather[0].main y el valor, el género de TMDB. Si no está: PER_DEFECTE (comedia).", "parelles": [["Rain", "Animación (16)"], ["Clear", "Aventura (12)"], ["Clouds", "Misterio (9648)"], ["Thunderstorm", "Suspense (53)"], ["Snow", "Familia (10751)"]]}, "c8_pluja": {"enunciat": "Tu Boletín del tiempo dice <code>weather[0].main = \"Rain\"<\/code>. ¿Qué URL pide la segunda petición?", "pista": "Rain → Animación → 16.", "explica": "with_genres: String(proposta.genere). URLSearchParams quiere textos: por eso el String().", "opcions": ["…/3/discover/movie?with_genres=16&sort_by=popularity.desc", "…/3/discover/movie?with_genres=12&sort_by=popularity.desc", "…/data/2.5/weather?q=Rain", "…/3/search/movie?query=Rain"]}, "c8_cadena": {"enunciat": "En el Plan de tarde no hay ningún <code>await<\/code> que espere a la primera petición antes de la segunda. Entonces, ¿cómo se encadenan?", "pista": "if (url === null) return;", "explica": "El orden sale solo: cambiar la ciudad cambia urlTemps; cuando llega el tiempo, urlPelis deja de ser null y empieza la segunda petición.", "opcions": ["urlPelis vale null hasta que llega el tiempo (useApi con null espera); cuando llega, React vuelve a pintar, urlPelis pasa a ser una dirección y el segundo useApi hace la petición", "Las dos peticiones salen a la vez y TMDB espera a OpenWeather", "useApi usa setTimeout para esperar 2 segundos", "No se encadenan: el usuario tiene que pulsar dos botones"]}, "c8_objecte": {"enunciat": "¿Por qué <code>useApi<\/code> recibe el token como <b>texto<\/b> y no como un objeto <code>{ headers: {…} }<\/code>?", "pista": "Las dependencias se comparan… y dos objetos iguales no son el mismo objeto.", "explica": "Dependencias que sean textos o números: React los compara por su valor y no hay bucle.", "opcions": ["Un objeto escrito dentro del componente es nuevo en cada renderizado: React lo ve «diferente», el efecto se repite sin parar y acabas con un 429", "Porque fetch no acepta objetos", "Porque los objetos no se pueden pasar a un hook", "Porque así el token queda cifrado"]}, "c8_consulta": {"enunciat": "¿Por qué el Plan de tarde tiene dos estados, <code>ciutat<\/code> (el input) y <code>consulta<\/code> (lo que se busca)?", "pista": "B… Ba… Bar… Barc…", "explica": "onSubmit: setConsulta(ciutat.trim()). Cambiar la consulta = cambiar la url = nueva petición.", "opcions": ["Si la URL dependiera de ciutat, haríamos una petición por cada tecla; consulta solo cambia al enviar el formulario", "Porque un input no puede tener estado", "Porque TMDB pide dos parámetros de ciudad", "Para poder mostrar la ciudad en mayúsculas"]}, "c9_secret": {"enunciat": "El Portero Proxy te mira de arriba abajo: «Tienes la clave en el .env. ¿Está oculta para los usuarios de tu web?»", "pista": "El .env la protege de GitHub… pero ¿y del navegador?", "explica": "El .env evita que la clave vaya a GitHub, pero no la oculta al navegador. Para una práctica no es grave; en una web publicada, sí.", "opcions": ["No: todo lo que empieza por VITE_ se pega al JavaScript del navegador; se ve en Network → Headers y en dist/assets", "Sí: el .env no se sube nunca a GitHub", "Sí: Vite la cifra al compilar", "Solo si haces npm run build"]}, "c9_proxy": {"enunciat": "«¿Y qué soy yo, un proxy?»", "pista": "Intermediario…", "explica": "El navegador no habla con TMDB: habla con nuestro servidor, y es el servidor quien añade el token.", "opcions": ["Un servidor intermediario: recibe tu petición, le añade la clave y la pasa a la API", "Una extensión del navegador que oculta las claves", "Un tipo especial de clave de API", "Un hook de React"]}, "c9_config": {"enunciat": "Completa la configuración del proxy en <code>vite.config.ts<\/code>:", "pista": "El token del proxy NO lleva VITE_: el navegador no debe verlo nunca.", "explica": "target = adonde se envía de verdad. env.TMDB_TOKEN (sin VITE_) lo lee loadEnv(mode, process.cwd(), '') en Node."}, "c9_rewrite": {"enunciat": "El navegador pide <code>/tmdb/3/movie/popular<\/code>. Con el <code>rewrite<\/code>, ¿qué ruta llega a TMDB?", "pista": "cami.replace(/^\\/tmdb/, '')", "explica": "rewrite quita /tmdb del principio. changeOrigin hace que TMDB crea que la petición va dirigida a él.", "opcions": ["/3/movie/popular", "/tmdb/3/movie/popular", "/tmdb", "https://localhost/3/movie/popular"]}, "c9_network": {"enunciat": "Con el ejemplo 4 abierto, miras DevTools → Network. ¿La petición lleva la cabecera <code>Authorization<\/code>?", "pista": "¿Quién pone el token ahora?", "explica": "El componente no sabe nada de claves: useApi('/tmdb/3/movie/popular?language=es-ES&region=ES').", "opcions": ["No: va a localhost sin Authorization; el servidor de Vite se la añade por el camino hacia TMDB", "Sí, igual que en el ejemplo 2", "Sí, pero cifrada", "No, porque TMDB ya no pide token"]}, "c9_prod": {"enunciat": "«Última: cuando publiques la web con <code>npm run build<\/code>, ¿quién hará de proxy?»", "pista": "El proxy de Vite solo existe con npm run dev.", "explica": "La idea es la misma: el token vive en el servidor (como secreto) y el navegador solo habla con el servidor.", "opcions": ["Una función de servidor (Cloudflare Pages Functions o Workers, Netlify, Vercel o un backend propio) con el token guardado como secreto", "El mismo proxy de Vite, que se copia a dist/", "El navegador del usuario", "Nadie: en producción no hace falta ocultar nada"]}, "c9_401": {"enunciat": "El ejemplo 4 da 401 y los otros tres funcionan. ¿Qué falta?", "pista": "En el .env.example hay tres variables…", "explica": "VITE_OWM_KEY, VITE_TMDB_TOKEN y TMDB_TOKEN. El proxy usa la tercera.", "opcions": ["TMDB_TOKEN (sin VITE_) en el .env, y reiniciar npm run dev", "El segundo await", "Access-Control-Allow-Origin en el vite.config.ts", "Nada: TMDB no funciona con proxy"]}, "c10_raca": {"enunciat": "El puesto de la Tendera vende fotos de <b>razas concretas<\/b>. Completa la URL para que dependa del estado <code>raca<\/code> del desplegable:", "pista": "Dentro de ${…} va la variable de estado; el endpoint acaba igual que el de siempre.", "explica": "https://dog.ceo/api/breed/husky/images/random. Cambiando raca cambia la URL."}, "c10_igual": {"enunciat": "Si pasas de <code>/breeds/image/random<\/code> a <code>/breed/husky/images/random<\/code>, ¿qué cambia en el JSON de la respuesta?", "pista": "Lo dice la pista del reto 1 de la sesión 10.", "explica": "El JSON que devuelve es idéntico. Por eso sirven el mismo type RespostaGos y el mismo código.", "opcions": ["Nada: devuelve la misma forma, { message, status }; solo ha cambiado la URL", "Devuelve un array de fotos en lugar de una", "El campo message pasa a llamarse image", "Hace falta un type nuevo con el campo breed"]}, "c10_beagle": {"enunciat": "Ya tienes en la consola la foto de <code>…/breed/beagle/images/random<\/code>. ¿Qué raza aparece escrita <b>dentro de la dirección de la foto<\/b> (el campo <code>message<\/code>)?", "pista": "Mira el trozo que va después de /breeds/ en el campo message.", "explica": "La dirección lleva la raza: https://images.dog.ceo/breeds/beagle/…jpg.", "solucio": "beagle"}, "c10_atzar": {"enunciat": "Sorpresa quiere un botón «¡Sorpresa!» que elija un Pokémon <b>entre el 1 y el 151<\/b>:", "pista": "Math.random() da un número entre 0 (incluido) y 1 (no incluido).", "explica": "Math.floor(Math.random() * 151) da de 0 a 150; con + 1, de 1 a 151. PokéAPI acepta el número en lugar del nombre."}, "c10_rang": {"enunciat": "¿Y si te olvidas del <code>+ 1<\/code> y escribes <code>Math.floor(Math.random() * 151)<\/code>?", "pista": "¿Cuál es el número más pequeño que puede salir?", "explica": "Por eso en la Pokédex hay disabled={id === 1}: no existe ningún Pokémon número 0.", "opcions": ["De vez en cuando sale el 0, y …/pokemon/0 responde 404", "Salen números decimales", "Nunca sale el 150", "No pasa nada: PokéAPI empieza por el 0"]}, "c10_abilities": {"enunciat": "Sorpresa también quiere mostrar las <b>habilidades<\/b>. El JSON trae <code>\"abilities\": [ { \"ability\": { \"name\": \"static\" } } ]<\/code>. ¿Qué añades al <code>type Pokemon<\/code>?", "pista": "Es un array de objetos con un objeto dentro, como types.", "explica": "Y para pintarlas: pokemon.abilities.map((a) => a.ability.name).join(', ').", "opcions": ["abilities: { ability: { name: string } }[];", "abilities: string[];", "abilities: { name: string };", "Nada: TypeScript lo deduce solo"]}, "c10_q": {"enunciat": "La Buscadora quiere añadir un buscador de equipamientos con <code>$q<\/code>, pero <b>sin enviarlo si está vacío<\/b>:", "pista": "Solo lo añadimos si el texto NO está vacío.", "explica": "parametres.set('$q', …) añade el parámetro. Prueba «biblioteca», «escola» o «poliesportiu» (los datos están en catalán)."}, "c10_deps": {"enunciat": "El texto del buscador ya entra en la URL. ¿Qué más tienes que tocar para que, al escribir, se vuelva a cargar la lista?", "pista": "[url]", "explica": "Lo dice la pista del reto 3. (Y si no quieres una petición por letra, separa ciutat/consulta como en el Plan de tarde.)", "opcions": ["Nada más, si la url está en las dependencias del efecto: cambiar el texto cambia la url y el efecto vuelve a pedir", "Añadir un setInterval que pida cada segundo", "Llamar a fetch dentro del onChange del input", "Recargar la página"]}, "c10_tanstack": {"enunciat": "Un vendedor ambulante ofrece <b>TanStack Query<\/b> y <b>SWR<\/b>. ¿Qué hacen que nuestro <code>useFetch<\/code> no hace?", "pista": "Caché…", "explica": "Nuestro useFetch es perfecto para aprender; en proyectos grandes se usan estas librerías.", "opcions": ["Guardan las respuestas en caché, reintentan si falla y recargan cuando vuelves a la pestaña", "Hacen que no haga falta ninguna URL", "Ocultan las claves de API", "Convierten el JSON en XML"]}, "c10_vocab": {"enunciat": "En el mostrador de vocabulario en inglés: relaciona cada término con su significado.", "pista": "Rate = ritmo; cleanup = limpiar.", "explica": "Es el vocabulario en inglés de la sesión 10.", "parelles": [["request / response", "Petición / respuesta"], ["endpoint", "Cada URL concreta de la API"], ["rate limit", "Límite de peticiones (el error 429)"], ["cleanup", "Limpieza: la función que devuelve useEffect"], ["race condition", "Condición de carrera: respuestas que llegan desordenadas"]]}, "c11_url": {"enunciat": "El Ornitólogo quiere las <b>12 últimas observaciones con foto<\/b> a <b>5 km<\/b> del delta (lat 41.30, lng 2.09). Elige las piezas:", "pista": "Cada API tiene sus propios nombres de parámetros: $limit es de Socrata. iNaturalist no pide clave.", "explica": "En la URL del reto 5 también están order_by=observed_on y locale=ca (nombres comunes en catalán)."}, "c11_results": {"enunciat": "Mira la respuesta de iNaturalist en la consola. ¿Dónde están las observaciones?", "pista": "Como en TMDB…", "explica": "El tipo sería { results: Observacio[] } y pintaríamos dades.results.map(…).", "opcions": ["En el array results", "En el objeto current", "En la raíz: la respuesta es directamente un array", "En el campo message"]}, "c11_foto": {"enunciat": "Para una observación <code>obs<\/code>, ¿cómo lees la dirección de <b>la primera foto<\/b>?", "pista": "photos es un array; coges el primer elemento y lees su url.", "explica": "photos[0].url. Como con weather[0] en OpenWeather.", "opcions": ["obs.photos[0].url", "obs.photo.url", "obs.photos.url[0]", "obs[0].photos.url"]}, "c11_opcional": {"enunciat": "El nombre común en catalán <b>no siempre está<\/b>. Completa el tipo y el JSX:", "pista": "El ? del tipo significa «puede no venir». Y si no viene, el nombre científico.", "explica": "Con ?? pintamos el nombre común y, si es undefined, el nombre científico."}, "c11_familia": {"enunciat": "Según la respuesta de GBIF, ¿a qué <b>familia<\/b> (campo <code>family<\/code>) pertenece el flamenco, <i>Phoenicopterus roseus<\/i>?", "pista": "Busca el campo \"family\" en la respuesta de la consola.", "explica": "species/match devuelve scientificName, kingdom, order, family y matchType. El flamenco es de la familia Phoenicopteridae.", "solucio": "Phoenicopteridae"}, "c11_espai": {"enunciat": "¿Por qué en la URL de GBIF hay <code>%20<\/code> entre <i>Phoenicopterus<\/i> y <i>roseus<\/i>?", "pista": "En la sesión 10: $ → %24, ' → %27…", "explica": "Los espacios no pueden ir tal cual dentro de una URL. URLSearchParams los codifica.", "opcions": ["Es un espacio codificado; URLSearchParams (o encodeURIComponent) lo hace solo", "Es una contraseña de GBIF", "Significa «20 resultados»", "Es obligatorio en todas las APIs"]}, "c11_none": {"enunciat": "El usuario escribe un nombre científico inventado y GBIF responde <code>\"matchType\": \"NONE\"<\/code>. ¿Qué debe hacer el componente?", "pista": "La respuesta es 200, pero el contenido dice que no hay coincidencia.", "explica": "No es un error HTTP: resposta.ok es true. Lo que hay que comprobar es el contenido.", "opcions": ["Avisar de que no lo ha encontrado, en lugar de pintar reino, orden y familia vacíos", "Lanzar un error 404", "Volver a hacer la petición hasta encontrarlo", "Nada: GBIF siempre encuentra algo"]}, "c11_combina": {"enunciat": "Ampliación: al hacer clic en una observación de iNaturalist, quieres abrir su ficha de GBIF. ¿Qué campo de la observación pasas a <code>name=<\/code>?", "pista": "GBIF busca por nombre científico.", "explica": "taxon.name es el nombre científico. Con useFetch y la URL a partir del estado de la observación elegida, la ficha se carga sola.", "opcions": ["obs.taxon.name", "obs.taxon.preferred_common_name", "obs.photos[0].url", "obs.id"]}, "c11_tipus": {"enunciat": "La Naturalista ordena sus APIs. Clasifica cada dato:", "pista": "Una es de observaciones con fotos; la otra, de fichas de especies.", "explica": "Dos APIs abiertas con formas de JSON diferentes: por eso siempre hay que mirar la respuesta antes de escribir el type.", "categories": ["iNaturalist", "GBIF", "Ambas"], "items": ["Los datos están en el array results", "Tiene el campo matchType", "Cada observación trae photos y taxon", "Devuelve kingdom, order y family", "No pide clave y envía Access-Control-Allow-Origin: *"]}, "c12_owm": {"enunciat": "La Registradora quiere ver si sabes conseguir la clave de <b>OpenWeather<\/b>. Ordena los pasos:", "pista": "El último paso es tener paciencia.", "explica": "Por eso en clase lo primero que se hace es registrarse en OpenWeather.", "peces": ["Crear una cuenta en openweathermap.org y confirmar el correo", "Ir a My API keys: ya hay una clave llamada Default", "Copiar la clave (32 caracteres) en VITE_OWM_KEY del .env", "Esperar a que se active: hasta 2 horas (mientras tanto, 401)"]}, "c12_onecall": {"enunciat": "En la web de OpenWeather ves <b>One Call API 3.0<\/b>. ¿Tienes que suscribirte?", "pista": "¡Cuidado!", "explica": "Con la cuenta gratuita tienes de sobra para la clase.", "opcions": ["No: se contrata aparte y pide datos de pago; usamos Current Weather (/data/2.5/weather), incluida en la cuenta gratuita", "Sí, sin ella no funciona ninguna petición", "Sí, porque es la que da la temperatura", "Solo si usas TMDB"]}, "c12_tmdb": {"enunciat": "Y ahora la de <b>TMDB<\/b>. Ordena los pasos:", "pista": "Primero la cuenta; al final, el token largo.", "explica": "La página da dos claves: la corta (API Key) y el token largo. Nosotros usamos el token.", "peces": ["Crear una cuenta en themoviedb.org y confirmar el correo", "Ir a la configuración del perfil → API y solicitar una clave de uso personal", "Aceptar las condiciones: uso no comercial y educativo (como web, el repositorio de GitHub)", "Copiar el API Read Access Token (eyJ…) en VITE_TMDB_TOKEN"]}, "c12_plans": {"enunciat": "Clasifica cada condición del plan gratuito:", "pista": "Una es del tiempo y la otra de películas.", "explica": "This product uses the TMDB API but is not endorsed or certified by TMDB: por eso el ejemplo lleva este pie de página.", "categories": ["OpenWeather", "TMDB"], "items": ["60 peticiones por minuto y 1.000.000 al mes", "Unas 40 peticiones por segundo", "La clave nueva puede tardar hasta 2 horas en activarse", "Hay que indicar que los datos son suyos (atribución)", "La clave va en la URL (appid)", "El token va en la cabecera Authorization: Bearer"]}, "c12_envd": {"enunciat": "Completa <code>src/vite-env.d.ts<\/code> para que VS Code sugiera las variables:", "pista": "import.meta.env → ImportMeta… Y la variable puede no existir.", "explica": "readonly: no se pueden cambiar desde el código. ?: pueden no existir (si todavía no has creado el .env)."}, "c12_clausts": {"enunciat": "¿Por qué leemos las claves en un solo archivo, <code>src/config/claus.ts<\/code>?", "pista": "Un solo sitio…", "explica": "export const CLAU_OPENWEATHER = import.meta.env.VITE_OWM_KEY ?? '';", "opcions": ["Si algún día cambia el nombre de una variable, solo hay que tocar este archivo; los componentes importan CLAU_OPENWEATHER y TOKEN_TMDB", "Porque así las claves quedan cifradas", "Porque Vite solo lee el .env desde este archivo", "Porque así no van a GitHub"]}, "c12_avis": {"enunciat": "¿Qué hace el componente <code>&lt;AvisClau variable=\"VITE_OWM_KEY\" web=\"…\" /&gt;<\/code>?", "pista": "Avisa…", "explica": "Se pinta cuando la clave es ''. Y va después de todos los useState.", "opcions": ["En lugar de hacer una petición que fallaría seguro con un 401, explica qué línea falta en el .env y dónde se consigue la clave", "Pide la clave al usuario y la guarda en el localStorage", "Envía la clave a OpenWeather", "Muestra la clave en la pantalla"]}, "c12_switch": {"enunciat": "Completa <code>missatgeError<\/code>, que traduce los códigos a frases para el usuario:", "pista": "status es un número; el caso para «cualquier otro» tiene un nombre concreto.", "explica": "Así el usuario lee «la clave no es válida» en lugar de «Error 401»."}, "c12_example": {"enunciat": "¿Por qué en el repositorio hay <code>.env.example<\/code> y no <code>.env<\/code>?", "pista": "!.env.example en el .gitignore…", "explica": "Quien descarga el proyecto copia .env.example, lo llama .env y pega en él sus claves.", "opcions": [".env.example es la plantilla vacía: dice qué variables hay que rellenar, sin ninguna clave; el .env con las claves no se sube nunca", "Porque GitHub no acepta archivos .env", "Porque .env.example es el que lee Vite", "Es el mismo archivo con otro nombre"]}, "c13_unitats": {"enunciat": "En la cúpula hay tres termómetros. ¿Qué da cada valor del parámetro <code>units<\/code>?", "pista": "Por defecto, kelvin.", "explica": "Reto 1 de la sesión 11: un <select> entre °C y °F que cambia el parámetro units.", "parelles": [["units=metric", "Grados Celsius y viento en m/s"], ["units=imperial", "Grados Fahrenheit"], ["(sin units)", "Kelvin"]]}, "c13_simbol": {"enunciat": "Además de cambiar <code>units<\/code>, ¿qué más tienes que cambiar cuando el usuario elige °F?", "pista": "¿Qué ve el usuario al lado del número?", "explica": "Si no, vería 70 °C cuando en realidad son 70 °F.", "opcions": ["El símbolo que pintas (°C / °F)", "La clave de API", "El endpoint", "Nada"]}, "c13_geo": {"enunciat": "Botón «Usar mi ubicación». Completa:", "pista": "get… Current… Position.", "explica": "El navegador pide permiso al usuario y, si lo da, devuelve las coordenadas."}, "c13_geourl": {"enunciat": "Ya tienes <code>lat<\/code> y <code>lon<\/code>. ¿Qué URL pides a OpenWeather?", "pista": "OpenWeather acepta lat y lon en lugar de la ciudad. Y la clave, siempre.", "explica": "lat y lon sustituyen a q. El resto (units, lang, appid) no cambia.", "opcions": ["…/data/2.5/weather?lat=41.32&lon=2.09&units=metric&lang=ca&appid=…", "…/data/2.5/weather?q=41.32,2.09&appid=…", "…/data/2.5/weather?latitude=41.32&longitude=2.09", "…/data/2.5/forecast?ubicacio=actual&appid=…"]}, "c13_forecast": {"enunciat": "La previsión de 5 días (<code>/data/2.5/forecast<\/code>) trae una lista <code>list<\/code> con una previsión <b>cada 3 horas<\/b>. ¿Cómo te quedas con la de las 12:00 de cada día?", "pista": "Hay una por día: hay que filtrar, no coger una sola.", "explica": "filter devuelve un array con las de mediodía: una por día.", "opcions": ["dades.list.filter((p) => p.dt_txt.endsWith('12:00:00'))", "dades.list.slice(0, 5)", "dades.list[12]", "dades.list.find((p) => p.dt_txt === '12:00')"]}, "c13_fitxa": {"enunciat": "En la sala de proyecciones del Observatorio quieres la <b>ficha completa<\/b> de Dune (id 438631): sinopsis, duración y géneros. ¿Qué URL?", "pista": "/3/movie/{id}", "explica": "Trae overview, runtime y genres. Y también va con la cabecera Authorization.", "opcions": ["https://api.themoviedb.org/3/movie/438631?language=es-ES", "https://api.themoviedb.org/3/search/movie?query=438631", "https://api.themoviedb.org/3/discover/movie?id=438631", "https://image.tmdb.org/t/p/w185/438631"]}, "c13_null": {"enunciat": "¿Por qué escribimos <code>useApi&lt;Fitxa&gt;(triada ? `…/3/movie/${triada}` : null, TOKEN_TMDB)<\/code>?", "pista": "if (url === null) return;", "explica": "Los hooks no pueden ir dentro de un if: en lugar de no llamar al hook, le pasamos null.", "opcions": ["Mientras el usuario no ha hecho clic en ninguna tarjeta, la URL es null y useApi no hace ninguna petición", "Porque null hace que la petición sea más rápida", "Porque TMDB pide null en la URL", "Para borrar el token"]}, "c13_pagines": {"enunciat": "TMDB devuelve los resultados por páginas. Completa el botón «Siguiente»:", "pista": "La página es un estado; la última página la dice la API.", "explica": "Cambiar pagina cambia la URL → nueva petición. En la última página, el botón se desactiva."}, "c13_deps": {"enunciat": "El hook <code>useApi<\/code> tiene las dependencias <code>[url, token]<\/code>. ¿Por qué no usamos <code>[url, { headers }]<\/code>?", "pista": "Bucle…", "explica": "Dependencias que sean textos o números: React los compara por su valor y no hay bucle.", "opcions": ["Porque un objeto nuevo en cada renderizado haría que el efecto se repitiera sin parar; los textos se comparan por su valor", "Porque las dependencias solo pueden ser dos", "Porque headers no existe en fetch", "Para ahorrar memoria"]}, "c14_url": {"enunciat": "La Socorrista quiere una tarjeta «Playa del Prat» con <b>la altura de las olas<\/b> y <b>la temperatura del agua<\/b> ahora mismo (lat 41.29, lon 2.11). Elige las piezas:", "pista": "Open-Meteo escribe los nombres completos (latitude, longitude) y no pide clave.", "explica": "Cada API tiene su vocabulario: OpenWeather usa lat/lon; Open-Meteo, latitude/longitude."}, "c14_current": {"enunciat": "Mira la respuesta de Open-Meteo en la consola. ¿Dónde están los datos de ahora mismo?", "pista": "Has pedido current=…", "explica": "Devuelve \"current\": { \"time\": \"…\", \"wave_height\": 0.10, \"sea_surface_temperature\": 24.0 }.", "opcions": ["En el objeto current: current.wave_height y current.sea_surface_temperature", "En el array results", "En el campo message", "En el array list"]}, "c14_unitats": {"enunciat": "¿Y cómo sabes en qué <b>unidades<\/b> vienen los valores?", "pista": "Mira el JSON: hay un objeto hermano de current.", "explica": "current_units dice, por ejemplo, \"wave_height\": \"m\" y \"sea_surface_temperature\": \"°C\".", "opcions": ["Lo dice el objeto current_units", "Siempre son en kelvin", "Hay que añadir units=metric", "No se puede saber"]}, "c14_tipus": {"enunciat": "Escribe el <code>type<\/code> solo con lo que vas a usar:", "pista": "0.10 es un número; \"m\" es un texto.", "explica": "Los nombres de los campos tienen que ser exactamente los de la API, aunque estén en inglés."}, "c14_onades": {"enunciat": "La respuesta de ejemplo dice <code>\"wave_height\": 0.10<\/code> y <code>current_units.wave_height<\/code> es <code>\"m\"<\/code>. ¿Cuántos <b>centímetros<\/b> miden las olas?", "pista": "1 m = 100 cm.", "explica": "0,10 m = 10 cm: mar en calma en El Prat.", "solucio": "10 cm"}, "c14_clau": {"enunciat": "¿Open-Meteo Marine necesita clave o registro?", "pista": "Es uno de los retos de la sesión 10, la de las APIs sin clave.", "explica": "Por tanto, basta con useFetch, sin .env ni proxy.", "opcions": ["No: es abierta, como Dog CEO, PokéAPI, Socrata, iNaturalist y GBIF", "Sí, una clave en la URL (appid)", "Sí, un token Bearer", "Solo los fines de semana"]}, "c14_platges": {"enunciat": "Ampliación: un desplegable con tres playas. ¿Qué pasa cuando el usuario elige otra?", "pista": "URL → dependencia → efecto.", "explica": "Es el mismo mecanismo que el desplegable de municipios de la sesión 10.", "opcions": ["Cambian latitude y longitude, cambia la URL y, como es la dependencia de useFetch, se vuelve a pedir sola", "Hay que volver a hacer npm run dev", "Hace falta un segundo useFetch para cada playa", "Open-Meteo solo funciona con una playa"]}, "c14_passos": {"enunciat": "La última lección de la Socorrista: ordena los pasos para hacer un componente con <b>cualquier API nueva<\/b>.", "pista": "Primero, mirar; al final, comprobar.", "explica": "Con estos cinco pasos puedes conectar React a casi cualquier API.", "peces": ["Probar la URL en el navegador y mirar qué campos tiene el JSON", "Escribir el type solo con los campos que vas a usar", "Llamar a useFetch<T>(url) (o useApi, si hace falta token)", "Pintar los tres estados: carregant, error y dades", "Comprobarlo en DevTools → Network"]}}, "COMBAT": {"b_deps": {"enunciat": "El Bucle lanza: <code>useEffect(() =&gt; { carregar(); });<\/code> <i>(sin array)<\/i>. ¿Cómo lo detienes?", "opcions": ["Añadiendo el array de dependencias: }, [url]);", "Añadiendo un segundo await", "Poniéndole async delante", "Cambiando fetch por axios"], "explica": "Sin array, el efecto se ejecuta después de cada renderizado. Con [url], solo cuando cambia la URL."}, "b_cos": {"enunciat": "El Bucle hace un <code>fetch<\/code> directamente en el cuerpo del componente. ¿Dónde tiene que ir?", "opcions": ["Dentro de un useEffect con [url] (o de un evento)", "Dentro del return del JSX", "Arriba del todo del archivo, fuera del componente", "Dentro de useState"], "explica": "En el cuerpo, cada renderizado hace una petición, el set… provoca otro renderizado… y vuelta a empezar."}, "b_obj": {"enunciat": "El Bucle llama a <code>useApi(url, { headers: { Authorization: … } })<\/code>. ¿Por qué hace peticiones sin parar?", "opcions": ["El objeto es nuevo en cada renderizado y React lo ve diferente: el efecto se repite", "Porque Authorization está mal escrito", "Porque falta el finally", "Porque useApi no acepta cabeceras"], "explica": "Pasa el token como texto y deja que el hook monte las cabeceras."}, "b_429": {"enunciat": "La API te contesta <b>429<\/b>. ¿Qué te está diciendo?", "opcions": ["Demasiadas peticiones en poco tiempo: espera y vuelve a intentarlo", "La clave no es válida", "El recurso no existe", "El servidor se ha caído"], "explica": "429 Too Many Requests: has superado el límite (rate limit)."}, "b_ignorar": {"enunciat": "El Bucle mezcla respuestas viejas y nuevas (sale Barcelona con Cornellà seleccionado). ¿Cuál es el arma?", "opcions": ["La limpieza: let ignorar = false; … return () => { ignorar = true; }", "Un setTimeout", "Hacer las peticiones con async/await dos veces", "Quitar el StrictMode"], "explica": "La limpieza descarta las respuestas que ya no interesan: adiós, condición de carrera."}, "b_ok": {"enunciat": "El Bucle responde 404 y tu componente se queda en blanco, sin ningún mensaje. ¿Qué falta?", "opcions": ["if (!resposta.ok) throw new Error(…)", "Un segundo useEffect", "La key de la lista", "units=metric"], "explica": "fetch no lanza error con un 404: tienes que comprobarlo tú."}, "b_hooks": {"enunciat": "Error en rojo: <i>Rendered fewer hooks than expected<\/i>. ¿Qué has hecho?", "opcions": ["Un return (o un if) antes de algún hook", "Te has olvidado del segundo await", "Has puesto la clave en el .env", "Has usado URLSearchParams"], "explica": "Todos los useState/useApi arriba; los return de aviso, después."}, "b_tecla": {"enunciat": "Cada letra que escribes en el input de la ciudad dispara una petición. ¿Cómo lo arreglas?", "opcions": ["Dos estados: ciutat para el input y consulta, que solo cambia al enviar el formulario", "Poniendo disabled en el input", "Quitando el useEffect", "Añadiendo .trim()"], "explica": "La URL tiene que depender de consulta, no de ciutat."}, "b_clau": {"enunciat": "El Bucle intenta robarte el token desde Network → Headers. ¿Dónde tenías que guardarlo?", "opcions": ["En el servidor (proxy o función de servidor), sin prefijo VITE_", "Dentro de un .tsx, bien escondido", "En el localStorage", "En una variable VITE_SECRET"], "explica": "El navegador habla con tu servidor, y el servidor pone la clave."}, "b_await": {"enunciat": "Última embestida: <code>const dades = resposta.json(); console.log(dades.message);<\/code> → undefined. ¡Remátalo!", "opcions": ["const dades = await resposta.json();", "const dades = resposta.json().message;", "const dades = JSON.parse(resposta);", "const dades = new resposta.json();"], "explica": "El segundo await: el que espera a que se lea el cuerpo."}, "b_vite": {"enunciat": "El Bucle te enseña tu URL: <code>…weather?q=Barcelona&amp;appid=undefined<\/code>. ¿Qué ha pasado?", "opcions": ["La variable del .env no empieza por VITE_ o está mal escrita", "OpenWeather ha borrado la clave", "Falta el segundo await", "Hace falta units=metric"], "explica": "El mismo nombre en el .env y en claus.ts: VITE_OWM_KEY. Y reinicia npm run dev."}, "b_null": {"enunciat": "El Bucle pide <code>/3/movie/undefined<\/code> antes de que el usuario elija ninguna película. ¿Cómo lo detienes?", "opcions": ["Pasando null como URL hasta que haya una elegida", "Poniendo useApi dentro de un if", "Quitando el token", "Añadiendo un setTimeout"], "explica": "Los hooks no pueden ir dentro de un if; con url null, useApi espera."}}, "NOMS": {"avia": "Abuela Async", "pendent": "Pendiente", "lluisa": "Lluïsa", "pau": "Pau", "cambrer": "Marcel, el camarero", "xef": "La Chef Base", "bru": "Bru, el cuidador", "sprite": "La Dra. Spr
