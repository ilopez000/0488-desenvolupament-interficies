xplica": "This is the English vocabulary from session 10.", "parelles": [["request / response", "What you ask the server / what it sends back"], ["endpoint", "Each specific URL of the API"], ["rate limit", "Maximum number of requests allowed (error 429)"], ["cleanup", "The function that useEffect returns"], ["race condition", "Responses that arrive in the wrong order"]]}, "c11_url": {"enunciat": "The Birdwatcher wants the <b>12 latest observations with a photo<\/b> within <b>5 km<\/b> of the delta (lat 41.30, lng 2.09). Choose the pieces:", "pista": "Each API has its own parameter names: $limit belongs to Socrata. iNaturalist doesn’t ask for a key.", "explica": "The URL in challenge 5 also has order_by=observed_on and locale=ca (common names in Catalan)."}, "c11_results": {"enunciat": "Look at the iNaturalist response in the console. Where are the observations?", "pista": "Like in TMDB…", "explica": "The type would be { results: Observacio[] } and we would show dades.results.map(…).", "opcions": ["In the results array", "In the current object", "At the root: the response is an array directly", "In the message field"]}, "c11_foto": {"enunciat": "For an observation <code>obs<\/code>, how do you read the address of <b>the first photo<\/b>?", "pista": "photos is an array; you take the first element and read its url.", "explica": "photos[0].url. Like weather[0] in OpenWeather.", "opcions": ["obs.photos[0].url", "obs.photo.url", "obs.photos.url[0]", "obs[0].photos.url"]}, "c11_opcional": {"enunciat": "The common name in Catalan <b>is not always there<\/b>. Complete the type and the JSX:", "pista": "The ? in the type means «it may not come». And if it doesn’t come, the scientific name.", "explica": "With ?? we show the common name and, if it is undefined, the scientific name."}, "c11_familia": {"enunciat": "According to the GBIF response, which <b>family<\/b> (field <code>family<\/code>) does the flamingo, <i>Phoenicopterus roseus<\/i>, belong to?", "pista": "Look for the \"family\" field in the response in the console.", "explica": "species/match returns scientificName, kingdom, order, family and matchType. The flamingo belongs to the Phoenicopteridae family.", "solucio": "Phoenicopteridae"}, "c11_espai": {"enunciat": "Why is there <code>%20<\/code> between <i>Phoenicopterus<\/i> and <i>roseus<\/i> in the GBIF URL?", "pista": "In session 10: $ → %24, ' → %27…", "explica": "Spaces can’t go as they are inside a URL. URLSearchParams encodes them.", "opcions": ["It’s an encoded space; URLSearchParams (or encodeURIComponent) does it for you", "It’s a GBIF password", "It means «20 results»", "It’s required in all APIs"]}, "c11_none": {"enunciat": "The user types a made-up scientific name and GBIF answers <code>\"matchType\": \"NONE\"<\/code>. What should the component do?", "pista": "The response is 200, but the content says there is no match.", "explica": "It isn’t an HTTP error: resposta.ok is true. It’s the content that you have to check.", "opcions": ["Say that it wasn’t found, instead of showing empty kingdom, order and family", "Throw a 404 error", "Make the request again until it finds it", "Nothing: GBIF always finds something"]}, "c11_combina": {"enunciat": "Extension: when you click an iNaturalist observation, you want to open its GBIF record. Which field of the observation do you pass to <code>name=<\/code>?", "pista": "GBIF searches by scientific name.", "explica": "taxon.name is the scientific name. With useFetch and the URL built from the state of the chosen observation, the record loads by itself.", "opcions": ["obs.taxon.name", "obs.taxon.preferred_common_name", "obs.photos[0].url", "obs.id"]}, "c11_tipus": {"enunciat": "The Delta Naturalist is sorting her APIs. Classify each fact:", "pista": "One is about observations with photos; the other, about species records.", "explica": "Two open APIs with different JSON shapes: that’s why you always need to look at the response before writing the type.", "categories": ["iNaturalist", "GBIF", "Both"], "items": ["The data is in the results array", "It has the matchType field", "Each observation has photos and taxon", "It returns kingdom, order and family", "It doesn’t ask for a key and sends Access-Control-Allow-Origin: *"]}, "c12_owm": {"enunciat": "The Registrar wants to see if you know how to get the <b>OpenWeather<\/b> key. Put the steps in order:", "pista": "The last step is to be patient.", "explica": "That’s why the first thing we do in class is sign up for OpenWeather.", "peces": ["Create an account at openweathermap.org and confirm your email", "Go to My API keys: there is already a key called Default", "Copy the key (32 characters) into VITE_OWM_KEY in the .env", "Wait for it to activate: up to 2 hours (meanwhile, 401)"]}, "c12_onecall": {"enunciat": "On the OpenWeather website you see <b>One Call API 3.0<\/b>. Do you need to subscribe to it?", "pista": "Careful!", "explica": "With the free account you have more than enough for class.", "opcions": ["No: it’s a separate plan and asks for payment details; we use Current Weather (/data/2.5/weather), included in the free account", "Yes, without it no request works", "Yes, because it’s the one that gives the temperature", "Only if you use TMDB"]}, "c12_tmdb": {"enunciat": "And now the <b>TMDB<\/b> one. Put the steps in order:", "pista": "First the account; at the end, the long token.", "explica": "The page gives you two keys: the short one (API Key) and the long token. We use the token.", "peces": ["Create an account at themoviedb.org and confirm your email", "Go to profile settings → API and request a key for personal use", "Accept the terms: non-commercial, educational use (as website, the GitHub repository)", "Copy the API Read Access Token (eyJ…) into VITE_TMDB_TOKEN"]}, "c12_plans": {"enunciat": "Classify each condition of the free plan:", "pista": "One is about weather and the other about movies.", "explica": "This product uses the TMDB API but is not endorsed or certified by TMDB: that’s why the example has this footer.", "categories": ["OpenWeather", "TMDB"], "items": ["60 requests per minute and 1,000,000 per month", "About 40 requests per second", "A new key can take up to 2 hours to activate", "You must say the data is theirs (attribution)", "The key goes in the URL (appid)", "The token goes in the Authorization: Bearer header"]}, "c12_envd": {"enunciat": "Complete <code>src/vite-env.d.ts<\/code> so VS Code suggests the variables:", "pista": "import.meta.env → ImportMeta… And the variable might not exist.", "explica": "readonly: they can’t be changed from the code. ?: they might not exist (if you haven’t created the .env yet)."}, "c12_clausts": {"enunciat": "Why do we read the keys in a single file, <code>src/config/claus.ts<\/code>?", "pista": "One single place…", "explica": "export const CLAU_OPENWEATHER = import.meta.env.VITE_OWM_KEY ?? '';", "opcions": ["If the name of a variable changes one day, you only need to change this file; the components import CLAU_OPENWEATHER and TOKEN_TMDB", "Because this way the keys are encrypted", "Because Vite only reads the .env from this file", "Because this way they don’t go to GitHub"]}, "c12_avis": {"enunciat": "What does the component <code>&lt;AvisClau variable=\"VITE_OWM_KEY\" web=\"…\" /&gt;<\/code> do?", "pista": "It warns…", "explica": "It is shown when the key is ''. And it goes after all the useState calls.", "opcions": ["Instead of making a request that would surely fail with a 401, it explains which line is missing in the .env and where to get the key", "It asks the user for the key and saves it in localStorage", "It sends the key to OpenWeather", "It shows the key on the screen"]}, "c12_switch": {"enunciat": "Complete <code>missatgeError<\/code>, which translates the codes into sentences for the user:", "pista": "status is a number; the case for «anything else» has a specific name.", "explica": "This way the user reads «the key is not valid» instead of «Error 401»."}, "c12_example": {"enunciat": "Why is there <code>.env.example<\/code> in the repository and not <code>.env<\/code>?", "pista": "!.env.example in the .gitignore…", "explica": "Whoever downloads the project copies .env.example, renames it to .env and pastes their own keys into it.", "opcions": [".env.example is the empty template: it says which variables you need to fill in, without any key; the .env with the keys is never uploaded", "Because GitHub doesn’t accept .env files", "Because .env.example is the one Vite reads", "It’s the same file with another name"]}, "c13_unitats": {"enunciat": "There are three thermometers in the dome. What does each value of the <code>units<\/code> parameter give?", "pista": "By default, kelvin.", "explica": "Challenge 1 of session 11: a <select> between °C and °F that changes the units parameter.", "parelles": [["units=metric", "Degrees Celsius and wind in m/s"], ["units=imperial", "Degrees Fahrenheit"], ["(no units)", "Kelvin"]]}, "c13_simbol": {"enunciat": "Besides changing <code>units<\/code>, what else do you need to change when the user chooses °F?", "pista": "What does the user see next to the number?", "explica": "If not, they would see 70 °C when it’s really 70 °F.", "opcions": ["The symbol you show (°C / °F)", "The API key", "The endpoint", "Nothing"]}, "c13_geo": {"enunciat": "«Use my location» button. Complete:", "pista": "get… Current… Position.", "explica": "The browser asks the user for permission and, if they give it, returns the coordinates."}, "c13_geourl": {"enunciat": "You already have <code>lat<\/code> and <code>lon<\/code>. Which URL do you ask OpenWeather for?", "pista": "OpenWeather accepts lat and lon instead of the city. And the key, always.", "explica": "lat and lon replace q. The rest (units, lang, appid) doesn’t change.", "opcions": ["…/data/2.5/weather?lat=41.32&lon=2.09&units=metric&lang=ca&appid=…", "…/data/2.5/weather?q=41.32,2.09&appid=…", "…/data/2.5/weather?latitude=41.32&longitude=2.09", "…/data/2.5/forecast?ubicacio=actual&appid=…"]}, "c13_forecast": {"enunciat": "The 5-day forecast (<code>/data/2.5/forecast<\/code>) has a <code>list<\/code> with a forecast <b>every 3 hours<\/b>. How do you keep the 12:00 one for each day?", "pista": "There is one per day: you need to filter, not take just one.", "explica": "filter returns an array with the midday ones: one per day.", "opcions": ["dades.list.filter((p) => p.dt_txt.endsWith('12:00:00'))", "dades.list.slice(0, 5)", "dades.list[12]", "dades.list.find((p) => p.dt_txt === '12:00')"]}, "c13_fitxa": {"enunciat": "In the Observatory’s screening room you want the <b>full record<\/b> of Dune (id 438631): overview, runtime and genres. Which URL?", "pista": "/3/movie/{id}", "explica": "It has overview, runtime and genres. And it also needs the Authorization header.", "opcions": ["https://api.themoviedb.org/3/movie/438631?language=es-ES", "https://api.themoviedb.org/3/search/movie?query=438631", "https://api.themoviedb.org/3/discover/movie?id=438631", "https://image.tmdb.org/t/p/w185/438631"]}, "c13_null": {"enunciat": "Why do we write <code>useApi&lt;Fitxa&gt;(triada ? `…/3/movie/${triada}` : null, TOKEN_TMDB)<\/code>?", "pista": "if (url === null) return;", "explica": "Hooks can’t go inside an if: instead of not calling the hook, we pass it null.", "opcions": ["While the user hasn’t clicked any card, the URL is null and useApi doesn’t make any request", "Because null makes the request faster", "Because TMDB asks for null in the URL", "To delete the token"]}, "c13_pagines": {"enunciat": "TMDB returns the results in pages. Complete the «Next» button:", "pista": "The page is a state; the API tells you the last page.", "explica": "Changing pagina changes the URL → new request. On the last page, the button is disabled."}, "c13_deps": {"enunciat": "The <code>useApi<\/code> hook has the dependencies <code>[url, token]<\/code>. Why don’t we use <code>[url, { headers }]<\/code>?", "pista": "Loop…", "explica": "Dependencies that are texts or numbers: React compares them by value and there is no loop.", "opcions": ["Because a new object on every render would make the effect repeat non-stop; texts are compared by value", "Because there can only be two dependencies", "Because headers doesn’t exist in fetch", "To save memory"]}, "c14_url": {"enunciat": "The Lifeguard wants an «El Prat Beach» card with <b>the wave height<\/b> and <b>the water temperature<\/b> right now (lat 41.29, lon 2.11). Choose the pieces:", "pista": "Open-Meteo writes the full names (latitude, longitude) and doesn’t ask for a key.", "explica": "Each API has its own vocabulary: OpenWeather uses lat/lon; Open-Meteo, latitude/longitude."}, "c14_current": {"enunciat": "Look at the Open-Meteo response in the console. Where is the data for right now?", "pista": "You asked for current=…", "explica": "It returns \"current\": { \"time\": \"…\", \"wave_height\": 0.10, \"sea_surface_temperature\": 24.0 }.", "opcions": ["In the current object: current.wave_height and current.sea_surface_temperature", "In the results array", "In the message field", "In the list array"]}, "c14_unitats": {"enunciat": "And how do you know which <b>units<\/b> the values come in?", "pista": "Look at the JSON: there is an object next to current.", "explica": "current_units says, for example, \"wave_height\": \"m\" and \"sea_surface_temperature\": \"°C\".", "opcions": ["The current_units object tells you", "They are always in kelvin", "You need to add units=metric", "There is no way to know"]}, "c14_tipus": {"enunciat": "Write the <code>type<\/code> with only what you will use:", "pista": "0.10 is a number; \"m\" is a text.", "explica": "The field names must be exactly the ones from the API, even if they are in English."}, "c14_onades": {"enunciat": "The example response says <code>\"wave_height\": 0.10<\/code> and <code>current_units.wave_height<\/code> is <code>\"m\"<\/code>. How many <b>centimetres<\/b> high are the waves?", "pista": "1 m = 100 cm.", "explica": "0.10 m = 10 cm: a flat sea in El Prat.", "solucio": "10 cm"}, "c14_clau": {"enunciat": "Does Open-Meteo Marine need a key or a sign-up?", "pista": "It’s one of the challenges of session 10, the one about APIs without a key.", "explica": "So useFetch is enough, without .env or proxy.", "opcions": ["No: it’s open, like Dog CEO, PokéAPI, Socrata, iNaturalist and GBIF", "Yes, a key in the URL (appid)", "Yes, a Bearer token", "Only at weekends"]}, "c14_platges": {"enunciat": "Extension: a dropdown with three beaches. What happens when the user chooses a different one?", "pista": "URL → dependency → effect.", "explica": "It’s the same mechanism as the town dropdown in session 10.", "opcions": ["latitude and longitude change, the URL changes and, since it is the dependency of useFetch, it asks again by itself", "You need to run npm run dev again", "You need a second useFetch for each beach", "Open-Meteo only works with one beach"]}, "c14_passos": {"enunciat": "The Lifeguard’s last lesson: put in order the steps to build a component with <b>any new API<\/b>.", "pista": "First, look; at the end, check.", "explica": "With these five steps you can connect React to almost any API.", "peces": ["Try the URL in the browser and see which fields the JSON has", "Write the type with only the fields you will use", "Call useFetch<T>(url) (or useApi, if you need a token)", "Show the three states: carregant, error and dades", "Check it in DevTools → Network"]}}, "COMBAT": {"b_deps": {"enunciat": "The Infinite Loop attacks: <code>useEffect(() =&gt; { carregar(); });<\/code> <i>(no array)<\/i>. How do you stop it?", "opcions": ["By adding the dependency array: }, [url]);", "By adding a second await", "By putting async in front", "By replacing fetch with axios"], "explica": "Without an array, the effect runs after every render. With [url], only when the URL changes."}, "b_cos": {"enunciat": "The Infinite Loop calls <code>fetch<\/code> directly in the component body. Where should it go?", "opcions": ["Inside a useEffect with [url] (or inside an event)", "Inside the JSX return", "At the very top of the file, outside the component", "Inside useState"], "explica": "In the body, every render makes a request, the set… causes another render… and it starts again."}, "b_obj": {"enunciat": "The Infinite Loop calls <code>useApi(url, { headers: { Authorization: … } })<\/code>. Why does it make requests non-stop?", "opcions": ["The object is new on every render and React sees it as different: the effect repeats", "Because Authorization is misspelled", "Because the finally is missing", "Because useApi doesn’t accept headers"], "explica": "Pass the token as text and let the hook build the headers."}, "b_429": {"enunciat": "The API answers <b>429<\/b>. What is it telling you?", "opcions": ["Too many requests in a short time: wait and try again", "The key is not valid", "The resource doesn’t exist", "The server is down"], "explica": "429 Too Many Requests: you have gone over the limit (rate limit)."}, "b_ignorar": {"enunciat": "The Infinite Loop mixes old and new responses (Barcelona appears with Cornellà selected). What is the weapon?", "opcions": ["The cleanup: let ignorar = false; … return () => { ignorar = true; }", "A setTimeout", "Making the requests with async/await twice", "Removing StrictMode"], "explica": "The cleanup throws away the responses you no longer need: goodbye race condition."}, "b_ok": {"enunciat": "The Infinite Loop answers 404 and your component stays blank, with no message. What is missing?", "opcions": ["if (!resposta.ok) throw new Error(…)", "A second useEffect", "The key of the list", "units=metric"], "explica": "fetch doesn’t throw an error with a 404: you have to check it yourself."}, "b_hooks": {"enunciat": "Red error: <i>Rendered fewer hooks than expected<\/i>. What have you done?", "opcions": ["A return (or an if) before some hook", "You forgot the second await", "You put the key in the .env", "You used URLSearchParams"], "explica": "All useState/useApi calls at the top; the warning returns, afterwards."}, "b_tecla": {"enunciat": "Every letter you type in the city input fires a request. How do you fix it?", "opcions": ["Two states: ciutat for the input and consulta, which only changes when the form is submitted", "By putting disabled on the input", "By removing the useEffect", "By adding .trim()"], "explica": "The URL must depend on consulta, not on ciutat."}, "b_clau": {"enunciat": "The Infinite Loop tries to steal your token from Network → Headers. Where should you have kept it?", "opcions": ["On the server (proxy or server function), without the VITE_ prefix", "Inside a .tsx file, well hidden", "In localStorage", "In a VITE_SECRET variable"], "explica": "The browser talks to your server, and the server adds the key."}, "b_await": {"enunciat": "Final attack: <code>const dades = resposta.json(); console.log(dades.message);<\/code> → undefined. Finish it off!", "opcions": ["const dades = await resposta.json();", "const dades = resposta.json().message;", "const dades = JSON.parse(resposta);", "const dades = new resposta.json();"], "explica": "The second await: the one that waits for the body to be read."}, "b_vite": {"enunciat": "The Infinite Loop shows you your URL: <code>…weather?q=Barcelona&amp;appid=undefined<\/code>. What happened?", "opcions": ["The .env variable doesn’t start with VITE_ or is misspelled", "OpenWeather deleted the key", "The second await is missing", "You need units=metric"], "explica": "Same name in the .env and in claus.ts: VITE_OWM_KEY. And restart npm run dev."}, "b_null": {"enunciat": "The Infinite Loop asks for <code>/3/movie/undefined<\/code> before the user chooses a movie. How do you stop it?", "opcions": ["By passing null as the URL until one has been chosen", "By putting useApi inside an if", "By removing the token", "By adding a setTimeout"], "explica": "Hooks can’t go inside an if; with url null, useApi waits."}}, "NOMS": {"avia": "Grandma Async", "pendent": "Pending", "lluisa"  Ona with the sea data.", "obj_boss": "Go back to the square and stop the Infinite Loop in the Big Screen!", "obj_fi": "You saved Fetchòpolis! You can download the report at the Big Screen.", "av_inici": "Press <kbd>E<\/kbd> in front of people to talk to them. The <b>yellow arrow<\/b> shows you where to go.", "av_objecte": "You got: <b>{obj}<\/b>", "av_apunt": "📜 Note collected: <b>{t}<\/b> <small>(+5 · press C to read it)<\/small>", "av_ajorna": "No problem: come back whenever you want. Everything you’ve done is saved.", "av_error": "Oops! Something went wrong: {m}", "av_sense_portatil": "You don’t have the dev laptop yet. Talk to Grandma Async.", "av_capitol": "🏅 Chapter {n} completed: <b>{nom}<\/b>", "av_obert": "🔓 You opened {nom} with: {icona} <b>{obj}<\/b>", "av_pdf": "📄 Report downloaded: <b>{f}<\/b>", "av_popup": "The report could not be opened (pop-ups are blocked).", "confirm_tit": "Confirm", "si": "Yes", "no": "No", "tanca": "Close (Esc)", "mot_tit": "🎒 Backpack", "mot_nota": "You have {n} of {t} items. To open a door, stand in front of it and press E: if you carry the item, it opens by itself.", "mot_usat": "✔ Already used", "mot_buit": "Not found yet", "mot_buit2": "Someone in Fetchòpolis will give it to you.", "ap_tit": "📚 Notes", "ap_nota": "The scrolls are scattered around the map: walk over them to pick them up. Each one is a piece of the notes from sessions 10 and 11.", "ap_buit": "❔ Scroll to find · {zona}", "mapa_tit": "🗺️ Map of Fetchòpolis", "mapa_aqui": "You are here", "mapa_missio": "Current mission", "mapa_placa": "Square", "mapa_cuina": "Server Kitchen", "mapa_gossera": "Dog CEO Kennel", "mapa_lab": "PokéAPI Lab", "mapa_arxiu": "Archive", "mapa_taller": "Hooks Workshop", "mapa_pont": "CORS Bridge", "mapa_districte": "Keys District", "mapa_mercat": "Challenge Market", "mapa_registre": "Registry", "mapa_delta": "Llobregat Delta", "mapa_observatori": "Observatory", "mapa_platja": "El Prat Beach", "rep_extra": "Extra challenge", "rep_n": "challenge {i} of {n}", "rep_tard": "I’ll do it later", "rep_comprova": "Check ✔", "rep_continua": "Continue ▶", "rep_ok1": "Right first time! +10 ⚡", "rep_ok2": "Correct! +3 ⚡", "rep_ko": "That’s not right.", "rep_ordre_nota": "Click a piece to add it to the list; click it in the list to remove it.", "rep_ordre_buit": "Click the pieces below in the right order…", "rep_ordre_err": "Everything is fine up to position {n}; from position {m} on, it isn’t. Click the pieces in the list to send them back down.", "rep_tria": "— choose —", "rep_match_err": "{n} are wrong (in red).", "rep_cl_err": "{n} are in the wrong group.", "rep_fill_err": "Wrong blanks: {n}.", "rep_pick_nota": "Click the pieces to turn them on or off.", "rep_pick_url": "This is what the URL looks like:", "rep_pick_sobren": "Extra pieces: {n}.", "rep_pick_falten": "Missing pieces: {n}.", "rep_ph_text": "Type your answer", "rep_ph_num": "Type a number", "rep_resposta": "Answer", "rep_buit": "Blank {n}", "rep_mira_consola": "💻 Check the console", "rep_bug_ok": "This line is fine.", "con_tit": "💻 DevTools Console <small>real fetch<\/small>", "con_enc": "📌 Task: ", "con_enganxa": "Paste it", "con_info": "// Type a URL and press Enter. A real GET request is made, just like in the browser console (F12 → Console).", "con_ultima": "// Last request: {u}", "con_executa": "Run ▶", "con_hist": "History (click to reuse):", "con_url": "Request URL", "con_esperant": "… waiting for the response (Promise &lt;pending&gt;)", "con_https": "✖ TypeError: Failed to fetch — the URL must start with https://", "con_failinfo": "// fetch threw an error: no response arrived. Either there is no connection, the URL does not exist, or the server does not allow CORS. In your code, the <b>catch<\/b> would handle this.", "con_desada": "⚠ Could not connect (no network or blocked). Here is a real saved response so you can keep going.", "con_okfalse": "// resposta.ok is false: in code we would write <b>if (!resposta.ok) throw new Error('Error {s}') b> You lose a heart.", "com_continua": "Continue ▶", "com_oh": "Oh, no…", "com_perd1": "The Loop flooded you: 429 Too Many Requests!", "com_perd2": "Take a breath (wait a little, just like with a 429) and try again. Questions you already got right won’t come up again.", "com_torna": "Try again! ⚔️", "com_guanya1": "The Infinite Loop has stopped!", "com_guanya2": "The cleanup swept away the old responses, the dependencies are now strings and the token travels hidden. The Big Screen answers <b>200 OK<\/b> again.", "com_visca": "Hooray! ▶", "fin_tit": "🏆 Fetchòpolis is saved!", "fin_resum": "{e} of {t} challenges right first time · {p} ⚡ · {a}/{at} notes · {temps} played", "fin_cap": "Chapter", "fin_primera": "First try", "fin_nivell": "Level", "fin_errors": "The report includes the {n} challenges you didn’t get right first time, with the answer and the explanation, so you can review them.", "fin_cap0": "You didn’t miss a single challenge on the first try. Impressive!", "fin_continua": "Keep exploring", "fin_pdf": "📄 Download the report (PDF)", "niv_exc": "Excellent", "niv_ass": "Achieved", "niv_proc": "In progress", "niv_rep": "Needs review", "rang_1": "API Master", "rang_2": "API Dev", "rang_3": "Fetch Junior", "rang_4": "Promise Apprentice", "t_min": "{m} min", "t_hmin": "{h} h {m} min", "pdf_titol": "Fetchòpolis · Adventure report", "pdf_sub": "0488 Interface Development · DAM2 · Prat FP · Connecting React to APIs (sessions 10 and 11)", "pdf_alumne": "Student", "pdf_grup": "Group", "pdf_data": "Date", "pdf_temps": "Play time", "pdf_punts": "Points", "pdf_apunts": "Notes collected", "pdf_nota": "{e} of {t} challenges right on the first try (the grade counts the first attempt).", "pdf_res": "Results by chapter", "pdf_tema": "Topic", "pdf_extra": "Extra challenges:", "pdf_repassar": "To review", "pdf_cap0": "No mistakes on the first try. Congratulations!", "pdf_correcta": "Correct answer: ", "pdf_perque": "Why: ", "pdf_peu": "Verification code: {c} · Fetchòpolis · 0488 · page {p}/{t}", "pdf_fitxer": "Fetchopolis_report", "aj_tit": "❔ How to play", "aj_controls": "Controls", "aj_funciona": "How it works", "aj_k_moure": "Walk (hold <kbd>Shift<\/kbd> to run)", "aj_k_e": "Talk, open, read, continue", "aj_k_num": "Choose an answer", "aj_k_i": "Backpack (items)", "aj_k_c": "Collected notes", "aj_k_t": "Console: real requests with fetch", "aj_k_m": "Map", "aj_k_l": "Change language", "aj_k_esc": "Close the window", "aj_li1": "Follow the <b>mission<\/b> (top left) and the <b>yellow arrow<\/b>.", "aj_li2": "Talk to people: they will give you <b>questions and challenges<\/b> about APIs and React.", "aj_li3": "Challenges you get right <b>first time<\/b> are worth +10 ⚡ and count towards the report grade.", "aj_li4": "<b>Gates and doors<\/b> open with items people give you along the way.", "aj_li5": "Collect the <b>scrolls<\/b>: they are the notes from sessions 10 and 11.", "aj_li6": "The game saves itself in this browser.", "aj_esborra": "🗑️ Delete saved game", "aj_esborra_q": "Are you sure you want to delete the game and start from scratch? All progress will be lost.", "aj_esborra_si": "Yes, delete it", "aj_entesos": "Got it", "con_elems": "… {n} items", "con_mes_elems": "… ({n} more items)", "con_mes_camps": "… ({n} more fields)", "rep_sol_bug": "The line “{l}”"}, "DIALEGS": {"avia.intro": ["Hi, {nom}! Welcome to Fetchòpolis. I’m Grandma Async: I never block, I always wait with <b>await<\/b>.", "We have a big problem. The <b>Big Screen<\/b> in the square has run out of data: the <b>Infinite Loop<\/b> has sneaked in, and it makes hundreds of requests per second.", "The APIs have turned off the tap: they only answer <b>429 Too Many Requests<\/b>. To stop it, we need someone who knows how to talk to APIs properly.", "Here, take my <b>dev laptop<\/b>. Press <b>T<\/b> to open the console, and you can make <b>real<\/b> requests with fetch."], "avia.intro2": ["Start with <b>the Server Kitchen<\/b>, just north of here. Marcel the Waiter will explain what an API is.", "Along the way you’ll find <b>scrolls<\/b> with notes (<b>C<\/b> key). The gates of each area open with items people will give you: check your <b>backpack<\/b> (<b>I<\/b> key).", "There are <b>14 chapters<\/b>. And remember: the answers you get right <b>first time<\/b> count the most. Let’s go!"], "avia.fi": ["You saved Fetchòpolis, {nom}! The Screen says 200 OK again.", "Now you know: which URL, what shape the JSON has and where you store it. And always with await!"], "avia.boss": ["You have the 200 OK seashell! It’s time: the Infinite Loop is inside the <b>Big Screen<\/b>. Go and stop it!"], "avia.sud": ["You got past the proxy, but the Loop has spread to the <b>South<\/b>. Go through the gate below the Keys District: the last five chapters are there."], "avia.tips": ["Patience, {nom}: promises always get resolved… or rejected.", "If an API “doesn’t work”, check DevTools → Network first.", "Use the yellow arrow: it takes you to whoever is waiting for you."], "avia.ara": ["Right now: {text}"], "lluisa.abans": ["Since the Big Screen started showing <b>429<\/b>, I don’t even know what the weather will be like tomorrow…", "They say the Infinite Loop was born from a <b>fetch<\/b> written straight into a component’s body. How scary!"], "lluisa.fi": ["The Screen works again! It shows dogs, Pokémon, public facilities in El Prat, the weather in Girona and even the waves at the beach."], "pau.tips": ["Tip: before coding against an API, open the URL in the browser and see which fields the JSON has.", "Did you know <b>fetch<\/b> comes with the browser? No need to install anything.", "If the console shows <b>Promise {&lt;pending&gt;}<\/b>, you’re missing an await. Pending is the living proof."], "cambrer.noIntro": ["We don’t have a table for you yet. Talk to Grandma Async in the square first."], "cambrer.fet": ["Enjoy your meal! Remember: the order is the URL and the dish is the JSON.", "At the Kennel, to the east, they serve random dogs. Well, dog photos."], "cambrer.xef": ["Chef Base is waiting for you on the other side of the terrace."], "cambrer.a": ["Hi, {nom}! Welcome to <b>the Server Kitchen<\/b>. I’m Marcel, the waiter.", "Here everything works like an <b>API<\/b>: you are the component. You never go into the kitchen (the database).", "You place a proper order (<b>the URL<\/b>) and I bring you the dish (<b>the JSON<\/b>). Let’s see if you got it."], "cambrer.encarrec": ["Now a real order. The house special is <b>a random dog photo<\/b>.", "Open the console (<b>T<\/b> key or the 💻 button) and request this URL:<br><code>https://dog.ceo/api/breeds/image/random<\/code>", "Advice for life: before coding against an API, look at the response to see which fields it has. Come back when you have the dish!"], "cambrer.b": ["Mmm, looks delicious! This JSON smells like <b>200 OK<\/b>."], "cambrer.b2": ["Perfect. Now go and see <b>Chef Base<\/b>, on the other side of the terrace: she has a job for you."], "xef.fet": ["Go to the <b>Dog CEO Kennel<\/b>, east of the square. The key is already in your backpack."], "xef.abans": ["Hey! No components allowed in my kitchen. Give your order to the waiter, Marcel."], "xef.a": ["I’m <b>Chef Base<\/b> (as in Database). I cook; the waiter serves. Before I give you anything, let’s sort out the menu."], "xef.b": ["Very good! Here, the <b>Kennel key<\/b>. Bru the Keeper will show you how to make your first fetch from React."], "bru.fet": ["The dogs are happy. Woof!"], "bru.pendent": ["Have you found Pending? He’s in the square, waiting… as always."], "bru.a": ["Hi, {nom}! I’m Bru. Here we look after dogs and, above all, the <b>Dog CEO<\/b> API.", "Our component is very simple: an “I want a dog!” button that requests a random photo and shows it.", "But before touching anything, let’s see if you know how <b>fetch<\/b> works."], "bru.b": ["Nailed it! Oh, look: I found this rolling around the kennel… <b>a lost await<\/b>.", "I think it belongs to <b>Pending<\/b>, a guy in the square who has been waiting for hours for something that never arrives. Take it to him!"], "pendent.fet": ["I’m not waiting for anything anymore! Well… only for responses. With <b>await<\/b>, of course."], "pendent.espera": ["I’m waiting… My console says <code>Promise {&lt;pending&gt;}<\/code>…", "…and <code>dades.message<\/code> gives me <code>undefined<\/code>. I must be missing something, but I don’t know what."], "pendent.a": ["What have you got there? <b>An await?<\/b> Show me where it goes, please!"], "pendent.b": ["WOW! That was it! The first await waits for the response, and the second one waits for the body to be read.", "Here, my <b>PokéAPI Lab pass<\/b>. I don’t need it anymore: Dr. Sprite wants to meet you."], "sprite.fet": ["Now you know how to handle loading and errors. The <b>Open Data Archive<\/b> is to the north-west!"], "sprite.a": ["Hi, {nom}! Welcome to my lab. I’m Dr. Sprite and I study <b>PokéAPI<\/b>.", "First of all, see what it returns. In the console, request<br><code>https://pokeapi.co/api/v2/pokemon/pikachu<\/code>", "The response is about 320 KB, with hundreds of fields. We’ll only use a few of them."], "sprite.espera1": ["I don’t have the record yet. Go to the console and request:<br><code>https://pokeapi.co/api/v2/pokemon/pikachu<\/code>"], "sprite.b": ["Fantastic. Now let’s measure: the API uses some rather strange units."], "sprite.b2": ["And now, an experiment: request a Pokémon <b>that doesn’t exist<\/b>:<br><code>https://pokeapi.co/api/v2/pokemon/pikatxu<\/code>", "Look closely at <b>resposta.status<\/b> and <b>resposta.ok<\/b>."], "sprite.espera2": ["Try the made-up name:<br><code>https://pokeapi.co/api/v2/pokemon/pikatxu<\/code>"], "sprite.c": ["A <b>404<\/b>! But… did fetch really fail?"], "sprite.c2": ["Excellent. Now talk to <b>Finally<\/b>, the caretaker, and to <b>Form<\/b>, my assistant. Then come back."], "sprite.faltaFin": ["You still need to talk to Finally the Caretaker."], "sprite.faltaForm": ["You still need to talk to Form, my assistant."], "sprite.d": ["You’ve got the four states, try/catch/finally and the form. You deserve the <b>try/catch Shield<\/b>!", "And this <b>Archive card<\/b> for the Open Data Archive: there, data loads by itself, no click needed."], "finally.abans": ["I’m Finally, the caretaker. I’m always there, no matter what happens. But right now the doctor needs you."], "finally.fet": ["Whether things go well or badly, I always switch off the “Loading…” light."], "finally.a": ["They say I’m the most reliable one in the lab. Do you know why?"], "finally.b": ["Exactly. I’m always there."], "formulari.abans": ["I’m building the search form… Talk to Dr. Sprite first."], "formulari.fet": ["With a &lt;form&gt; you can also search by pressing Enter. Handy!"], "formulari.a": ["I’m Form. Help me understand each piece of the search box, because the doctor is testing me tomorrow."], "formulari.b": ["Thanks! Now go back to the doctor."], "soql.fet": ["Remember your manners with open data: ask only for what you need ($select, $limit)."], "soql.a": ["Welcome to the <b>Catalan Open Data Archive<\/b>. I’m Ms. SoQL.", "The Catalan government publishes hundreds of datasets. We use “Equipaments de Catalunya” (public facilities, ID <b>8gmd-gz7i<\/b>): schools, libraries, health centers…", "It runs on Socrata: an API with <b>no key and no sign-up<\/b>, and parameters that look like SQL."], "soql.a2": ["Very good. Now try the URL you built in the console: the “Paste it” button puts it there for you."], "soql.espera": ["You haven’t brought me the data yet. Try the URL you built in the console (with $limit=3)."], "soql.b": ["Here it is. Notice that this is <b>real data<\/b>… and you know real data is always a bit messy."], "soql.b2": ["Now talk to <b>Racer<\/b> and to the <b>StrictMode Ghost<\/b>. They will both show you why the effect needs a <b>cleanup<\/b>."], "soql.faltaCursa": ["You still need to talk to Racer."], "soql.faltaFant": ["You still need to talk to the StrictMode Ghost."], "soql.c": ["You’ve got it all: SoQL, URLSearchParams, useEffect with [url] and the cleanup. Here, the <b>Cleanup broom<\/b>.", "And the <b>Workshop key<\/b> for the Hooks Workshop, to the south-west: it’s time to move all this logic into a custom hook."], "cursa.abans": ["Barcelona! No, Cornellà! No, Barcelona!… I can’t talk now. Talk to Ms. SoQL first."], "cursa.fet": ["I don’t get mixed up anymore: each effect has its own ignorar variable!"], "cursa.a": ["I’m Racer! I switch towns so fast that the responses arrive in the wrong order. Help me!"], "cursa.b": ["Now it works: the late response doesn’t trample the good one anymore."], "fantasma.abans": ["Woooo… woooo… (it says everything twice). Talk to Ms. SoQL first."], "fantasma.fet": ["Woooo… Only in development… only in development…"], "fantasma.a": ["Woooo! I’m the StrictMode Ghost. I do everything… twice. Twice."], "fantasma.b": ["Woooo… you get me. You get me."], "mestre.fet": ["Use your hook wisely."], "mestre.pont": ["The <b>CORS Bridge<\/b> is south of the square. The Guardian won’t let anyone cross who doesn’t know what CORS is."], "mestre.a": ["Welcome to the Hooks Workshop. I’m Master Hook.", "In the PokéAPI and Archive examples we repeated the same pattern: three states, try/catch/finally, checking ok and the cleanup.", "When some hook logic repeats, we move it into a <b>custom hook<\/b>. Let’s forge a <b>useFetch<\/b>!"], "mestre.b": ["Here it is, freshly forged: the <b>useFetch&lt;T&gt; hook<\/b>. One single line replaces twenty-five.", "Now, the <b>CORS Bridge<\/b>, south of the square. On the other side is the Keys District, where APIs ask for ID."], "guardia.fet": ["You may pass. Remember: no private keys in the front end."], "guardia.abans": ["Halt! No one crosses the bridge without a well-forged hook. Go to the Hooks Workshop."], "guardia.a": ["Halt! I’m the <b>CORS Guardian<\/b>. I protect the browser from requests that servers don’t want to answer.", "Answer my three questions and I’ll let you pass."], // Arbres i roques decoratius allà on no molesten
function posaArbres(reservades) {
  const rnd = llavor(2027);
  const NO = new Set([R.CAMI, R.PLACA, R.TANCA, R.FUSTA, R.PONT, R.AIGUA, R.SORRA, R.CANYES]);
  const lliure = (x, y) => {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (NO.has(getR(x + dx, y + dy))) return false;
      if (ocupatEdifici[(y + dy) * MW + (x + dx)]) return false;
      if (reservades.has((x + dx) + ',' + (y + dy))) return false;
    }
    return true;
  };
  const dinsZona = (x, y) => ZONES.some((z) => !z.linia && x >= z.x0 && x <= z.x1 && y >= z.y0 && y <= z.y1);
  for (let y = 3; y < 78; y++) for (let x = 3; x < MW - 3; x++) {
    const r = getR(x, y);
    if (r !== R.GESPA && r !== R.FLORS) continue;
    if (!lliure(x, y)) continue;
    const p = dinsZona(x, y) ? 0.05 : 0.13;
    const v = rnd();
    if (v < p) setR(x, y, R.ARBRE);
    else if (v < p + 0.012) setR(x, y, R.ROCA);
  }
}

function enfosqueix(hex, q = 0.18) {

  const gespa = () => { x.fillStyle = COL.gespa; x.fillRect(px, py, T, T); punts(COL.gespa2, 7); punts(COL.gespa3, 5); x.fillStyle = COL.gespa2; for (let i = 0; i < 3; i++) { const a = px + 2 + Math.floor(rnd() * 12), b = py + 3 + Math.floor(rnd() * 11); x.fillRect(a, b, 1, 2); x.fillRect(a + 1, b - 1, 1, 2); } };

      for (let i = 0; i < 3; i++) { const a = px + 2 + Math.floor(rnd() * 11), b = py + 2 + Math.floor(rnd() * 11); x.fillStyle = cols[Math.floor(rnd() * cols.length)]; x.fillRect(a, b, 2, 2); x.fillStyle = '#f7c948'; x.fillRect(a, b, 1, 1); }

    case R.PONT: {
      x.fillStyle = COL.aigua; x.fillRect(px, py, T, T);

      x.fillStyle = COL.fusta2; for (let i = 0; i < T; i += 4) x.fillRect(px, py + i, T, 1);
      x.fillStyle = '#7a4f2a'; if (getR(cx - 1, cy) !== R.PONT) x.fillRect(px, py, 2, T); if (getR(cx + 1, cy) !== R.PONT) x.fillRect(px + T - 2, py, 2, T);

function pintaEdifici(x, b) {
  const e = ESTILS[b.estil];
  const bx = b.x * T, by = b.y * T, bw = b.w * T, bh = b.h * T;
  const teuladaH = b.estil === 'torre' || b.estil === 'observatori' ? 3 * T : 2 * T;
  const pY = by + teuladaH - 4; // inici de la paret
  // ombra
  x.fillStyle = 'rgba(0,0,0,.2)'; x.fillRect(bx + 3, by + bh - 2, bw, 4);
  // paret
  x.fillStyle = e.paret; x.fillRect(bx, pY, bw, by + bh - pY);
  x.fillStyle = e.paret2;
  if (b.estil === 'taller' || b.estil === 'torre' || b.estil === 'arxiu') {
    for (let yy = pY + 4, k = 0; yy < by + bh - 3; yy += 5, k++) { x.fillRect(bx, yy, bw, 1); for (let xx = bx + (k % 2) * 6; xx < bx + bw; xx += 12) x.fillRect(xx, yy - 4, 1, 4); }
  } else if (b.estil === 'gossera') {
    for (let xx = bx + 4; xx < bx + bw; xx += 6) x.fillRect(xx, pY, 1, by + bh - pY);
  } else {
    for (let yy = pY + 6; yy < by + bh - 3; yy += 6) x.fillRect(bx, yy, bw, 1);
  }
  x.fillStyle = enfosqueix(e.paret, 0.35); x.fillRect(bx, by + bh - 3, bw, 3);
  // teulada
  if (b.estil === 'torre') {
    x.fillStyle = e.teulada;
    for (let i = 0; i < teuladaH; i++) { const w = Math.round((bw + 8) * (i / teuladaH)); x.fillRect(bx + bw / 2 - w / 2, by + i, w, 1); }
    x.fillStyle = e.teulada2; for (let i = 6; i < teuladaH; i += 5) { const w = Math.round((bw + 8) * (i / teuladaH)); x.fillRect(bx + bw / 2 - w / 2, by + i, w, 1); }
    x.fillStyle = '#333'; x.fillRect(bx + bw / 2, by - 8, 1, 9); x.fillStyle = '#ffd84a'; x.fillRect(bx + bw / 2 - 4, by - 7, 8, 2); x.fillRect(bx + bw / 2 - 1, by - 9, 3, 2);
  } else if (b.estil === 'observatori') {
    const cx = bx + bw / 2, r0 = bw / 2 + 2;
    for (let i = 0; i < teuladaH; i++) { const dy = teuladaH - i; const w = Math.round(2 * Math.sqrt(Math.max(0, r0 * r0 - dy * dy * (r0 * r0) / (teuladaH * teuladaH)))); x.fillStyle = i % 6 === 0 ? e.teulada2 : e.teulada; x.fillRect(cx - w / 2, by + i, w, 1); }
    x.fillStyle = '#0b0f1c'; x.fillRect(cx - 3, by + 2, 6, teuladaH - 6);
    x.fillStyle = '#9aa6bf'; x.fillRect(cx + 2, by - 6, 3, 12); x.fillRect(cx + 4, by - 9, 5, 4);
    x.fillStyle = '#ffd84a'; x.fillRect(bx + 4, by + 4, 1, 1); x.fillRect(bx + bw - 6, by + 8, 1, 1);
  } else if (b.estil === 'arxiu') {
    x.fillStyle = e.teulada;
    for (let i = 0; i < teuladaH; i++) { const w = Math.min(bw + 8, Math.round((bw + 8) * ((i + 6) / teuladaH))); x.fillRect(bx + bw / 2 - w / 2, by + i, w, 1); }
    x.fillStyle = e.teulada2; x.fillRect(bx - 4, by + teuladaH - 6, bw + 8, 2);
    x.fillStyle = '#f7f2e6'; for (let i = 1; i < b.w; i += 2) { if (bx + i * T === portaDe(b).x * T) continue; x.fillRect(bx + i * T + 3, pY + 2, 6, by + bh - pY - 5); x.fillStyle = '#d8cfbd'; x.fillRect(bx + i * T + 8, pY + 2, 1, by + bh - pY - 5); x.fillStyle = '#f7f2e6'; }
  } else {
    x.fillStyle = e.teulada; x.fillRect(bx - 4, by, bw + 8, teuladaH);
    if (b.estil === 'restaurant' || b.estil === 'mercat') { x.fillStyle = e.teulada2; for (let xx = bx - 4; xx < bx + bw + 4; xx += 12) x.fillRect(xx, by, 6, teuladaH); }
    else { x.fillStyle = e.teulada2; for (let yy = by + 3; yy < by + teuladaH - 2; yy += 5) for (let xx = bx - 4 + ((yy / 5) % 2) * 4; xx < bx + bw + 4; xx += 8) x.fillRect(xx, yy, 5, 2); }
    x.fillStyle = e.vora; x.fillRect(bx - 4, by + teuladaH - 3, bw + 8, 3);
    if (b.estil === 'taller') { x.fillStyle = '#3a3f48'; x.fillRect(bx + bw - 22, by - 10, 10, 18); x.fillStyle = '#ff9d3b'; x.fillRect(bx + bw - 20, by - 10, 6, 2); }
    if (b.estil === 'restaurant') { x.fillStyle = '#7b5a43'; x.fillRect(bx + 14, by - 8, 8, 12); }
  }
  // finestres
  const porta = portaDe(b);
  if (b.estil !== 'arxiu') {
    for (let i = 0; i < b.w; i++) {
      const cx = b.x + i; if (cx === porta.x || i === 0 || i === b.w - 1) continue;
      if (b.estil !== 'torre' && b.estil !== 'observatori' && i % 2 === 0) continue;
      const wx = cx * T + 3, wy = b.estil === 'torre' || b.estil === 'observatori' ? pY + 6 : pY + 8;
      if (b.estil === 'cinema') { x.fillStyle = '#ffd84a'; x.fillRect(wx - 1, wy - 1, 12, 16); x.fillStyle = ['#e85d75', '#4fb3bf', '#f2a541'][i % 3]; x.fillRect(wx, wy, 10, 14); x.fillStyle = 'rgba(255,255,255,.4)'; x.fillRect(wx + 2, wy + 2, 6, 3); continue; }
      if (b.estil === 'proxy') { x.fillStyle = '#111'; x.fillRect(wx, wy, 10, 8); x.fillStyle = '#ff3fa4'; x.fillRect(wx, wy + 3, 10, 1); continue; }
      x.fillStyle = e.vora; x.fillRect(wx - 1, wy - 1, 12, 11);
      x.fillStyle = '#a9dcff'; x.fillRect(wx, wy, 10, 9);
      x.fillStyle = '#e8f6ff'; x.fillRect(wx + 1, wy + 1, 3, 2);
      x.fillStyle = e.vora; x.fillRect(wx + 5, wy, 1, 9); x.fillRect(wx, wy + 4, 10, 1);
      if (b.estil === 'torre') { x.fillStyle = e.vora; x.fillRect(wx - 1, wy + 16, 12, 9); x.fillStyle = '#a9dcff'; x.fillRect(wx, wy + 17, 10, 7); }
    }
  }
  // porta
  const dx = porta.x * T, dy = porta.y * T;
  x.fillStyle = e.vora; x.fillRect(dx + 1, dy + 1, 14, 15);
  x.fillStyle = b.estil === 'proxy' ? '#15171d' : '#6b4226'; x.fillRect(dx + 3, dy + 3, 10, 13);
  x.fillStyle = 'rgba(255,255,255,.15)'; x.fillRect(dx + 3, dy + 3, 10, 1);
  x.fillStyle = '#ffd84a'; x.fillRect(dx + 10, dy + 9, 2, 2);
  // rètol (el text es pinta a part, nítid)
  const llarg = Math.max(...IDIOMES.map((l) => ((l === 'ca' ? EDIFICIS_NOM[b.id] : TRAD[l]?.EDIFICIS_NOM?.[b.id]) || EDIFICIS_NOM[b.id]).length));
  b.llarg = llarg;
  const rw = Math.min(bw - 6, Math.max(48, llarg * 6 + 10));
  b.retol = { x: bx + bw / 2 - rw / 2, y: by + teuladaH - 13, w: rw, h: 10 };
  x.fillStyle = b.estil === 'proxy' ? '#0b0c10' : b.estil === 'cinema' ? '#170c26' : '#5e3a1a';
  x.fillRect(b.retol.x - 1, b.retol.y - 1, b.retol.w + 2, b.retol.h + 2);
  x.fillStyle = b.estil === 'proxy' ? '#1d2028' : b.estil === 'cinema' ? '#2a1840' : '#f1dfb8';
  x.fillRect(b.retol.x, b.retol.y, b.retol.w, b.retol.h);
}

function escriuAmbMaquina(node, html, onFi) {
  node.innerHTML = personalitza(html);
  const nodes = []; const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  while (w.nextNode()) nodes.push(w.currentNode);
  const textos = nodes.map((n) => n.textContent); nodes.forEach((n) => (n.textContent = ''));
  let i = 0, j = 0, acabat = false, compta = 0;
  const pas = () => {
    if (acabat) return;
    for (let k = 0; k < 2; k++) {
      if (i >= nodes.length) { acabat = true; onFi && onFi(); return; }
      if (j < textos[i].length) { nodes[i].textContent += textos[i][j++]; } else { i++; j = 0; }
    }
    if (++compta % 3 === 0) so.blip();
    requestAnimationFrame(pas);
  };
  requestAnimationFrame(pas);
  return { completa: () => { if (acabat) return false; nodes.forEach((n, k) => (n.textContent = textos[k])); acabat = true; onFi && onFi(); return true; }, fet: () => acabat };
}

function jsonHTML(v, niv = 0) {
  const pad = '  '.repeat(niv + 1), padF = '  '.repeat(niv);
  if (v === null) return '<span class="j-null">null</span>';
  if (typeof v === 'string') { const s = v.length > 90 ? v.slice(0, 87) + '…' : v; return `<span class="j-str">"${escapa(s)}"</span>`; }
  if (typeof v === 'number') return `<span class="j-num">${v}</span>`;
  if (typeof v === 'boolean') return `<span class="j-bool">${v}</span>`;
  if (Array.isArray(v)) {
    if (!v.length) return '[]';
    if (niv >= 3) return `[<span class="j-res">${t('con_elems', { n: v.length })}</span>]`;
    const n = niv === 0 ? 5 : 3;
    const parts = v.slice(0, n).map((x) => pad + jsonHTML(x, niv + 1));
    if (v.length > n) parts.push(`${pad}<span class="j-res">${t('con_mes_elems', { n: v.length - n })}</span>`);
    return `[\n${parts.join(',\n')}\n${padF}]`;
  }
  const claus = Object.keys(v);
  if (!claus.length) return '{}';
  if (niv >= 4) return `{<span class="j-res">…</span>}`;
  const max = niv === 0 ? 40 : 8;
  const parts = claus.slice(0, max).map((k) => `${pad}<span class="j-key">"${escapa(k)}"</span>: ${jsonHTML(v[k], niv + 1)}`);
  if (claus.length > max) parts.push(`${pad}<span class="j-res">${t('con_mes_camps', { n: claus.length - max })}</span>`);
  return `{\n${parts.join(',\n')}\n${padF}}`;
}

async function executaFetch(url, sortida) {
  let fixat = null;
  const linia = (cls, html) => { const n = el('div', { class: cls, html }); sortida.append(n); sortida.scrollTop = fixat ? fixat.offsetTop - sortida.offsetTop - 8 : sortida.scrollHeight; return n; };
  linia('l-ordre', `&gt; const resposta = await fetch('${escapa(url)}');`);
  const espera = linia('l-info', t('con_esperant'));
  if (!/^https?:\/\//i.test(url)) { espera.remove(); linia('l-error', t('con_https')); so.ko(); return; }
  let estat, ok, cosText, desada = false;
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
    const resp = await fetch(url, { signal: ctl.signal });
    clearTimeout(t);
    estat = resp.status; ok = resp.ok; cosText = await resp.text();
  } catch (err) {
    const d = DESADES.find((x) => x.re.test(url));
    espera.remove();
    if (!d) {
      linia('l-error', `✖ TypeError: Failed to fetch`);
      linia('l-info', t('con_failinfo'));
      so.ko(); return;
    }
    linia('l-avis', t('con_desada'));
    estat = d.estat; ok = estat >= 200 && estat < 300; cosText = typeof d.cos === 'string' ? d.cos : JSON.stringify(d.cos); desada = true;
  }
  espera.remove();
  S.historial.push(url); if (S.historial.length > 30) S.historial.shift(); desa();
  linia('l-ordre', '&gt; resposta.status'); linia(ok ? 'l-ok' : 'l-error', `${estat}`);
  linia('l-ordre', '&gt; resposta.ok'); linia(ok ? 'l-ok' : 'l-error', `${ok}`);
  let dades;
  try { dades = JSON.parse(cosText); } catch (e) { dades = undefined; }
  if (!ok) {
    linia('l-info', t('con_okfalse', { s: estat }));
    linia('l-ordre', `&gt; await resposta.text()  <span class="l-info">${t('con_textcom')}</span>`);
    linia('l-json', dades !== undefined ? jsonHTML(dades) : `<span class="j-str">"${escapa(cosText.slice(0, 300))}"</span>`);
    so.ko();
  } else {
    linia('l-ordre', '&gt; const dades = await resposta.json();');
    if (dades === undefined) { linia('l-error', t('con_nojson')); so.ko(); }
    else {
      if (dades && typeof dades === 'object' && !Array.isArray(dades) && Object.keys(dades).length > 8) {
        linia('l-ordre', `&gt; Object.keys(dades)  <span class="l-info">${t('con_keyscom')}</span>`);
        linia('l-json', escapa(JSON.stringify(Object.keys(dades))).replace(/,/g, ', '));
      }
      const capJson = linia('l-ordre', '&gt; dades');
      linia('l-json', jsonHTML(dades));
      if (cosText.length > 4000) { fixat = capJson; linia('l-info', t('con_retallada')); }
      if (dades && typeof dades.message === 'string' && /images\.dog\.ceo/.test(dades.message)) {
        const img = el('img', { src: dades.message, alt: t('con_fotoalt'), class: 'foto-gos' });
        img.onerror = () => img.replaceWith(el('div', { class: 'l-info' }, t('con_fotoerr')));
        const n = linia('l-img', '<span class="l-info">// {foto &amp;&amp; &lt;img src={foto} … /&gt;}</span>'); n.append(img);
        if (/dog\.ceo\/api\/breeds\/image\/random/.test(url) && !desada) S.gos = dades.message;
      }
      so.ok();
    }
  }
  for (const enc of ENCARRECS) {
    if (f(enc.flag) || !enc.re.test(url) || enc.estat !== estat) continue;
    if (enc.array && !Array.isArray(dades)) continue;
    if (enc.camp && !(dades && dades[enc.camp])) continue;
    setF(enc.flag);
    if (enc.bonus) { S.punts += enc.bonus; S.bonus.push('bonus_owm401'); desa(); }
    so.item(); avis('✔ ' + t(enc.missatge), 'objecte', 5200);

    actualitzaHUD();
  }
  if (consolaEncarrec && consolaEncarrec.pintaHist) consolaEncarrec.pintaHist();
}

function interactuaEntitat(e) {
  if (e.tipus === 'npc') {
    const fn = GUIONS[e.id];
    const dx = J.x - e.x, dy = J.y - e.y;
    if (e.id !== 'fantasma') e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    return fn ? fn() : diu(e.id, '…');
  }
  if (e.tipus === 'porta') {
    const z = e.zona;
    if (f(z.flag)) return;
    const o = objecte(z.requereix);
    if (te(z.requereix)) {
      setF(z.flag); marcaUsat(z.requereix); so.porta(); afegeixParticules(e.x * T + 8, e.y * T + 4, '#ffd84a', 20);
      avis(t('av_obert', { nom: nomZona(z.id), icona: o.icona, obj: o.nom }), 'objecte', 4200);
      actualitzaHUD(); return;
    }
    const zn = nomZona(z.id);
    return diu('narrador', D('nar.tancada')[0].replace('{zona}', zn[0].toUpperCase() + zn.slice(1)).replace('{obj}', `${o.icona} ${o.nom}`));
  }
  if (e.tipus === 'barrera') return f('cap5') ? null : dit('narrador', 'nar.barrera');
  if (e.tipus === 'cofre') return GUIONS.cofre();
  if (e.tipus === 'pantalla') return GUIONS.pantalla();
  if (e.tipus === 'cartell') return diu('narrador', textCartell(e.idx));
  if (e.tipus === 'gos') { so.blip(); return ditUn('gos', 'gos'); }
  if (e.tipus === 'flamenc') { so.blip(); return dit('flamenc', 'flamenc'); }
  if (e.tipus === 'edifici') {
    const b = e.edifici;
    if (GUIONS[b.id]) return GUIONS[b.id]();
    return dit('narrador', 'porta.' + b.id);
  }
}

function resultats() {
  const perCap = CAPITOLS.map((c0) => {
    const c = capitol(c0.id);
    const ids = c.id === 15 ? COMBAT.map((q) => q.id) : Object.keys(REPTES).filter((k) => REPTES[k].cap === c.id);
    const fets = ids.filter((k) => S.res[k]?.ok);
    const primera = ids.filter((k) => S.res[k]?.primer === true);
    return { ...c, total: ids.length, fets: fets.length, primera: primera.length, pct: ids.length ? Math.round((primera.length / ids.length) * 100) : 0 };
  });
  const totals = perCap.reduce((a, c) => a + c.total, 0);
  const encerts = perCap.reduce((a, c) => a + c.primera, 0);
  const nota = Math.round((encerts / totals) * 100);
  const errors = Object.entries(S.res).filter(([, r]) => r.primer === false).map(([id, r]) => {
    if (id.startsWith('b_')) { const q = combatL(COMBAT.find((x) => x.id === id)); return { cap: 15, enunciat: textPla(q.enunciat), solucio: q.opcions[q.correcta], explica: q.explica, intents: r.intents }; }
    const q = repteL(id); if (!q) return null;
    return { cap: q.cap, enunciat: textPla(q.enunciat), solucio: solucioText(id), explica: textPla(q.explica), intents: r.intents };
  }).filter(Boolean).sort((a, b) => a.cap - b.cap);
  return { perCap, totals, encerts, nota, errors };
}

const MAPA_TECLES = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
function enCamp(e) { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); }

document.addEventListener('keydown', (e) => {

    if (e.key === 'Escape') { if (m.tancable) { e.preventDefault(); m.tanca(); } return; }
    const n = parseInt(e.key, 10);
    if (!enCamp(e) && n >= 1 && n <= 4) { const ops = [...m.cos.querySelectorAll('.opcions-quiz .opcio')]; if (ops[n - 1] && !ops[n - 1].disabled) { e.preventDefault(); ops[n - 1].click(); } }

    const n = parseInt(e.key, 10); if (n >= 1 && n <= 9) { avancaDialeg(n - 1); }
    return;
  }
  if (enCamp(e)) return;
  const d = MAPA_TECLES[e.code];
  if (d) { e.preventDefault(); tecles.add(d); ordreTecles = ordreTecles.filter((x) => x !== d); ordreTecles.push(d); if (!e.repeat) provaPas(d); return; }
  if (e.repeat) return;
  if (['KeyE', 'Space', 'Enter', 'NumpadEnter'].includes(e.code)) { e.preventDefault(); interactua(); }
  else if (e.code === 'KeyI') obreMotxilla();
  else if (e.code === 'KeyC') obreApunts();
  else if (e.code === 'KeyT') obreConsola();

});
document.addEventListener('keyup', (e) => {

});

  actualitzaIndicacio();
  desatT += dt;
  if (desatT > 5 && S) { desatT = 0; S.x = J.x; S.y = J.y; S.dir = J.dir; desa(); }
  requestAnimationFrame(bucle);
}

/* -------------------------------------------------------------------------
   PORTADA I ARRENCADA
   ------------------------------------------------------------------------- */
function comencaPartida(estat) {
  S = estat;
  if (S.idioma && S.idioma !== IDIOMA) posaIdioma(S.idioma); else S.idioma = IDIOMA;
  posaJugador(S.x, S.y, S.dir);
  $('#portada').classList.add('amagada');
  setTimeout(() => $('#portada').remove(), 600);
  $('#joc').hidden = false;
  actualitzaHUD();
  desa();
  if (!f('intro')) setTimeout(() => { if (!f('intro')) avis(t('av_inici'), 'info', 6500); }, 900);
}

function preparaPortada() {
  const desat = carrega();
  const previ = $('#previ-jugador'); const px = previ.getContext('2d'); px.imageSmoothingEnabled = false;
  let color = desat?.color || 'blau';
  let frame = 0;
  const pintaPrevi = () => { px.clearRect(0, 0, 96, 96); px.drawImage(spritePersona({ H: '#4a2f1d', T: COLORS_JUGADOR[color], P: '#2f3e5c', S: '#f1c7a5' }, [], 'down', [0, 1, 0, 2][frame % 4]), 0, 0, 96, 96); };
  setInterval(() => { frame++; pintaPrevi(); }, 260);
  const mostres = $('#colors');
  for (const [k, v] of Object.entries(COLORS_JUGADOR)) {
    const b = el('button', { type: 'button', class: 'mostra' + (k === color ? ' triat' : ''), style: `background:${v}`, 'aria-label': t('dessuadora', { c: k }), 'aria-pressed': k === color, onclick: () => { color = k; mostres.querySelectorAll('.mostra').forEach((m) => { m.classList.toggle('triat', m === b); m.setAttribute('aria-pressed', m === b); }); pintaPrevi(); } });
    mostres.append(b);
  }
  pintaPrevi();
  if (desat && desat.nom) {
    $('#continua').hidden = false;
    $('#continua').dataset.nom = desat.nom; $('#continua').textContent = t('port_continua', { nom: desat.nom });
    $('#continua').addEventListener('click', () => { so.desperta(); comencaPartida(desat); });
    $('#nom').value = desat.nom; $('#grup').value = desat.grup || 'DAM2';
  }
  $('#form-inici').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nom = $('#nom').value.trim(); const grup = $('#grup').value.trim() || 'DAM2';
    if (!nom) { $('#nom').focus(); return; }
    if (desat && desat.nom) {
      S = { so: true }; // perquè la finestra de confirmació funcioni abans d'arrencar
      const ok = await new Promise((res) => {
        const caixa = $('#confirma-nova'); caixa.hidden = false;
        caixa.querySelector('[data-si]').onclick = () => { caixa.hidden = true; res(true); };
        caixa.querySelector('[data-no]').onclick = () => { caixa.hidden = true; res(false); };
      });
      S = null;
      if (!ok) return;
    }
    so.desperta();
    comencaPartida(estatNou(nom, grup, color));
  });
  document.querySelectorAll('[data-idioma]').forEach((b) => b.addEventListener('click', () => {
    posaIdioma(b.dataset.idioma);
    const c = $('#continua'); if (c.dataset.nom) c.textContent = t('port_continua', { nom: c.dataset.nom });
  }));
  $('#btn-ajuda-portada').addEventListener('click', () => { $('#ajuda-portada').hidden = !$('#ajuda-portada').hidden; });
}

async function arrenca() {
  posaIdioma(idiomaInicial());
  canvas = $('#c'); ctx = canvas.getContext('2d');
  construeixMapa();
  const reservades = new Set();
  for (const p of Object.values(PERSONATGES)) if (p.x !== undefined) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) reservades.add((p.x + dx) + ',' + (p.y + dy));
  for (const [x, y] of [...Object.values(POS_APUNTS), ...POS_CARTELLS, [13, 55], [24, 17], [37, 7], [54, 16], [46, 42], [55, 41], [13, 16], [4, 13], [5, 41], [26, 44], [4, 56], [27, 52], [56, 56], [31, 31], [41, 10], [41, 38], [18, 10], [18, 38], [28, 48], [29, 29]]) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) reservades.add((x + dx) + ',' + (y + dy));
  for (const d of DECOR) reservades.add(d.x + ',' + d.y);
  posaArbres(reservades);
  preparaDecor();
  creaEntitats();
  try { await Promise.race([document.fonts.load('10px "Press Start 2P"'), esperar(2500)]); } catch (e) { /* res */ }
  prepintaFons();
  redimensiona();
  window.addEventListener('resize', redimensiona);
  $('#btn-motxilla').addEventListener('click', obreMotxilla);
  $('#btn-apunts').addEventListener('click', () => obreApunts());
  $('#btn-consola').addEventListener('click', () => obreConsola());
  $('#btn-mapa').addEventListener('click', obreMapa);
  $('#btn-ajuda').addEventListener('click', obreAjuda);
  $('#btn-so').addEventListener('click', () => { S.so = !S.so; desa(); actualitzaHUD(); });
  $('#btn-idioma').addEventListener('click', canviaIdioma);
  const desaPos = () => { if (S) { S.x = J.desti && J.movent ? J.desti[0] : J.x; S.y = J.desti && J.movent ? J.desti[1] : J.y; S.dir = J.dir; desa(); } };
  window.addEventListener('pagehide', desaPos);
  document.addEventListener('visibilitychange', () => { if (document.hidden) desaPos(); });
  $('#dialeg').addEventListener('click', (e) => { if (e.target.closest('button')) return; if (avancaDialeg) avancaDialeg(); });
  preparaTactil();
  preparaPortada();
  requestAnimationFrame(bucle);
}

/* Ganxos per a les proves automàtiques (no afecten el joc) */
window.__fp = {
  get S() { return S; }, J, REPTES, COMBAT, ENTITATS: () => ENTITATS, objectiu, transitable, getR, MW, MH, entitatA,
  teleporta(x, y, dir = 'up') { posaJugador(x, y, dir); },
  interactua, bloqueig: () => bloqueigJoc, avanca: () => avancaDialeg && avancaDialeg(),
  repteL, repteActual: () => (actualHook && !actualHook.m.tancat ? actualHook.id : null),
};

arrenca();

</script>
