["¡Hola, {nom}! Te doy la bienvenida a Fetchòpolis. Soy la Abuela Async: nunca me bloqueo, siempre espero con <b>await<\/b>.", "Tenemos un problema gordo. La <b>Gran Pantalla<\/b> de la plaza se ha quedado sin datos: se ha colado el <b>Bucle Infinito<\/b>, que hace cientos de peticiones por segundo.", "Las APIs nos han cortado el grifo: solo responden <b>429 Too Many Requests<\/b>. Para detenerlo necesitamos a alguien que sepa hablar con las APIs como es debido.", "Toma, mi <b>portátil de dev<\/b>. Con la tecla <b>T<\/b> abres la consola y puedes hacer peticiones <b>de verdad<\/b> con fetch."], "avia.intro2": ["Empieza por <b>La Cocina del Servidor<\/b>, aquí al norte. Marcel, el camarero, te explicará qué es una API.", "Por el camino encontrarás <b>pergaminos<\/b> con los apuntes (tecla <b>C<\/b>). Las vallas de cada zona se abren con objetos que te dará la gente: mira la <b>mochila<\/b> (tecla <b>I<\/b>).", "Son <b>14 capítulos<\/b>. Y recuerda: las respuestas que aciertes <b>a la primera<\/b> son las que más cuentan. ¡Vamos allá!"], "avia.fi": ["¡Has salvado Fetchòpolis, {nom}! La Pantalla vuelve a decir 200 OK.", "Ahora ya lo sabes: qué URL, qué forma tiene el JSON y dónde lo guardas. ¡Y siempre con await!"], "avia.boss": ["¡Ya tienes la concha del 200 OK! Ha llegado la hora: el Bucle Infinito está dentro de la <b>Gran Pantalla<\/b>. ¡Ve y detenlo!"], "avia.sud": ["Has pasado el proxy, pero el Bucle se ha extendido hacia el <b>Sur<\/b>. Cruza la reja que hay debajo del Distrito de las Claves: allí están los últimos cinco capítulos."], "avia.tips": ["Paciencia, {nom}: las promesas siempre se cumplen… o se rechazan.", "Si una API «no funciona», mira primero DevTools → Network.", "Usa la flecha amarilla: te lleva adonde te esperan."], "avia.ara": ["Ahora mismo: {text}"], "lluisa.abans": ["Desde que la Gran Pantalla da <b>429<\/b> no sé ni qué tiempo hará mañana…", "Dicen que el Bucle Infinito nació de un <b>fetch<\/b> escrito directamente en el cuerpo de un componente. ¡Qué miedo!"], "lluisa.fi": ["¡La Pantalla vuelve a funcionar! Salen perros, Pokémon, equipamientos de El Prat, el tiempo de Girona y hasta las olas de la playa."], "pau.tips": ["Truco: antes de programar contra una API, abre la URL en el navegador y mira qué campos tiene el JSON.", "¿Sabías que <b>fetch<\/b> ya viene con el navegador? No hay que instalar nada.", "Si en la consola ves <b>Promise {&lt;pending&gt;}<\/b>, te falta un await. Pendiente es el ejemplo vivo."], "cambrer.noIntro": ["Aún no tenemos mesa para ti. Habla primero con la Abuela Async, en la plaza."], "cambrer.fet": ["¡Que aproveche! Recuerda: la comanda es la URL y el plato es el JSON.", "En la Perrera, al este, sirven perros al azar. Bueno, fotos de perros."], "cambrer.xef": ["La Chef Base te espera al otro lado de la terraza."], "cambrer.a": ["¡Hola, {nom}! Te doy la bienvenida a <b>La Cocina del Servidor<\/b>. Soy Marcel, el camarero.", "Aquí todo funciona como una <b>API<\/b>: tú eres el componente. En la cocina (la base de datos) no entras nunca.", "Haces una comanda bien hecha (<b>la URL<\/b>) y yo te traigo el plato (<b>el JSON<\/b>). A ver si lo has entendido."], "cambrer.encarrec": ["Ahora, una comanda de verdad. El plato estrella de la casa es <b>una foto de perro al azar<\/b>.", "Abre la consola (tecla <b>T<\/b> o el botón 💻) y pide esta URL:<br><code>https://dog.ceo/api/breeds/image/random<\/code>", "Consejo para toda la vida: antes de programar contra una API, mira la respuesta para saber qué campos tiene. ¡Vuelve cuando tengas el plato!"], "cambrer.b": ["¡Mmm, qué buena pinta! Este JSON huele a <b>200 OK<\/b>."], "cambrer.b2": ["Perfecto. Ahora ve a ver a la <b>Chef Base<\/b>, al otro lado de la terraza: tiene trabajo para ti."], "xef.fet": ["Ve a la <b>Perrera Dog CEO<\/b>, al este de la plaza. La llave ya la tienes en la mochila."], "xef.abans": ["¡Eh! En mi cocina no entran componentes. Haz la comanda al camarero, a Marcel."], "xef.a": ["Soy la <b>Chef Base<\/b> (de Datos). Yo cocino; el camarero sirve. Antes de darte nada, pongamos orden en la carta."], "xef.b": ["¡Muy bien! Toma, la <b>llave de la Perrera<\/b>. Bru, el cuidador, te enseñará a hacer tu primer fetch desde React."], "bru.fet": ["Los perros están contentos. ¡Guau!"], "bru.pendent": ["¿Has encontrado a Pendiente? Está en la plaza, esperando… como siempre."], "bru.a": ["¡Hola, {nom}! Soy Bru. Aquí cuidamos perros y, sobre todo, la API <b>Dog CEO<\/b>.", "Nuestro componente es muy sencillo: un botón «¡Quiero un perro!» que pide una foto al azar y la pinta.", "Pero antes de tocar nada, a ver si sabes cómo funciona <b>fetch<\/b>."], "bru.b": ["¡Lo has bordado! Ah, mira: he encontrado esto rodando por la perrera… <b>un await perdido<\/b>.", "Diría que es de <b>Pendiente<\/b>, un chico de la plaza que lleva horas esperando algo que no llega nunca. ¡Llévaselo!"], "pendent.fet": ["¡Ya no espero nada! Bueno… solo las respuestas. Con <b>await<\/b>, claro."], "pendent.espera": ["Estoy esperando… Mi consola dice <code>Promise {&lt;pending&gt;}<\/code>…", "…y <code>dades.message<\/code> me da <code>undefined<\/code>. Me debe de faltar algo, pero no sé qué."], "pendent.a": ["¿Qué llevas ahí? <b>¿Un await?<\/b> ¡Enséñame dónde va, por favor!"], "pendent.b": ["¡TOMA YA! ¡Era eso! El primer await espera la respuesta y el segundo, a que se lea su cuerpo.", "Toma, mi <b>pase del Laboratorio PokéAPI<\/b>. Yo ya no lo necesito: la Dra. Sprite quiere conocerte."], "sprite.fet": ["Ahora ya sabes tratar la carga y los errores. ¡El <b>Archivo de Datos Abiertos<\/b> está al noroeste!"], "sprite.a": ["¡Hola, {nom}! Te doy la bienvenida a mi laboratorio. Soy la Dra. Sprite y estudio <b>PokéAPI<\/b>.", "Lo primero, mira qué devuelve: pide en la consola<br><code>https://pokeapi.co/api/v2/pokemon/pikachu<\/code>", "La respuesta pesa unos 320 KB, con cientos de campos. Nosotros solo usaremos unos pocos."], "sprite.espera1": ["Aún no tengo la ficha. Consola, y:<br><code>https://pokeapi.co/api/v2/pokemon/pikachu<\/code>"], "sprite.b": ["Fantástico. Ahora midamos: la API da unidades un poco raras."], "sprite.b2": ["Y ahora, un experimento: pide un Pokémon <b>que no existe<\/b>:<br><code>https://pokeapi.co/api/v2/pokemon/pikatxu<\/code>", "Fíjate en <b>resposta.status<\/b> y <b>resposta.ok<\/b>."], "sprite.espera2": ["Prueba el nombre inventado:<br><code>https://pokeapi.co/api/v2/pokemon/pikatxu<\/code>"], "sprite.c": ["¡Un <b>404<\/b>! Pero… ¿fetch ha fallado de verdad?"], "sprite.c2": ["Excelente. Ahora habla con <b>Finally<\/b>, el conserje, y con <b>Formulario<\/b>, mi ayudante. Después vuelve."], "sprite.faltaFin": ["Aún te falta hablar con Finally, el conserje."], "sprite.faltaForm": ["Aún te falta hablar con Formulario, mi ayudante."], "sprite.d": ["Ya tienes los cuatro estados, el try/catch/finally y el formulario. ¡Te mereces el <b>Escudo try/catch<\/b>!", "Y este <b>carné del Archivo de Datos Abiertos<\/b>: allí los datos se cargan solos, sin clic."], "finally.abans": ["Soy Finally, el conserje. Yo siempre estoy, pase lo que pase. Pero ahora la doctora te necesita."], "finally.fet": ["Tanto si va bien como si va mal, yo apago la luz de «Cargando…»."], "finally.a": ["Dicen que soy el más fiable del laboratorio. ¿Sabes por qué?"], "finally.b": ["Exacto. Yo siempre estoy."], "formulari.abans": ["Estoy montando el formulario del buscador… Habla primero con la Dra. Sprite."], "formulari.fet": ["Con un &lt;form&gt; también se puede buscar pulsando Intro. ¡Práctico!"], "formulari.a": ["Soy Formulario. Ayúdame a entender cada pieza del buscador, que la doctora me examina mañana."], "formulari.b": ["¡Gracias! Ahora ve con la doctora."], "soql.fet": ["Recuerda los buenos modales con los datos abiertos: pide solo lo que necesitas ($select, $limit)."], "soql.a": ["Te doy la bienvenida al <b>Archivo de Datos Abiertos de Cataluña<\/b>. Soy la Sra. SoQL.", "La Generalitat publica cientos de conjuntos de datos. Usamos «Equipaments de Catalunya» (identificador <b>8gmd-gz7i<\/b>): escuelas, bibliotecas, CAP…", "Funciona con Socrata: una API <b>sin clave y sin registro<\/b>, con parámetros que parecen SQL."], "soql.a2": ["Muy bien. Ahora prueba en la consola la URL que has montado: el botón «Pégala» te la pone."], "soql.espera": ["Aún no me has traído los datos. Prueba en la consola la URL que has montado (con $limit=3)."], "soql.b": ["Aquí los tenemos. Fíjate en que son <b>datos reales<\/b>… y ya sabes que los datos reales siempre vienen un poco sucios."], "soql.b2": ["Ahora habla con <b>Carrera<\/b> y con el <b>Fantasma del StrictMode<\/b>. Los dos te enseñarán por qué el efecto necesita una <b>limpieza<\/b>."], "soql.faltaCursa": ["Te falta hablar con Carrera."], "soql.faltaFant": ["Te falta hablar con el Fantasma del StrictMode."], "soql.c": ["Lo tienes todo: SoQL, URLSearchParams, useEffect con [url] y la limpieza. Toma, la <b>Escoba de limpieza<\/b>.", "Y la <b>llave del Taller de los Hooks<\/b>, al suroeste: es hora de sacar toda esta lógica a un hook propio."], "cursa.abans": ["¡Barcelona! ¡No, Cornellà! ¡No, Barcelona!… Ahora no puedo hablar, habla primero con la Sra. SoQL."], "cursa.fet": ["Ya no me lío: ¡cada efecto tiene su variable ignorar!"], "cursa.a": ["¡Soy Carrera! Cambio de municipio tan deprisa que las respuestas me llegan desordenadas. ¡Ayúdame!"], "cursa.b": ["Ahora sí: la respuesta tardona ya no me pisa la buena."], "fantasma.abans": ["Uuuh… uuuh… (lo dice dos veces). Habla primero con la Sra. SoQL."], "fantasma.fet": ["Uuuh… Solo en desarrollo… solo en desarrollo…"], "fantasma.a": ["¡Uuuh! Soy el Fantasma del StrictMode. Todo lo hago… dos veces. Dos veces."], "fantasma.b": ["Uuuh… me has entendido. Me has entendido."], "mestre.fet": ["Usa tu hook con cabeza."], "mestre.pont": ["El <b>Puente CORS<\/b> está al sur de la plaza. El Guardián no deja pasar a nadie que no sepa qué es CORS."], "mestre.a": ["Te doy la bienvenida al Taller de los Hooks. Soy el Maestro Hook.", "En los ejemplos de PokéAPI y del Archivo hemos repetido el mismo patrón: tres estados, try/catch/finally, comprobar ok y la limpieza.", "Cuando una lógica con hooks se repite, la sacamos a un <b>hook propio<\/b>. ¡Forjemos un <b>useFetch<\/b>!"], "mestre.b": ["Aquí lo tienes, recién forjado: el <b>Hook useFetch&lt;T&gt;<\/b>. Una sola línea sustituye a veinticinco.", "Ahora, el <b>Puente CORS<\/b>, al sur de la plaza. Al otro lado está el Distrito de las Claves, donde las APIs piden identificación."], "guardia.fet": ["Puedes pasar. Recuerda: ninguna clave privada en el front-end."], "guardia.abans": ["¡Alto! Nadie cruza el puente sin un hook bien forjado. Ve al Taller de los Hooks."], "guardia.a": ["¡Alto! Soy el <b>Guardián CORS<\/b>. Protejo el navegador de peticiones que los servidores no quieren responder.", "Contéstame tres preguntas y te dejaré pasar."], "guardia.b": ["Correcto. <b>Access-Control-Allow-Origin: *<\/b>. La barrera está abierta.", "En el Distrito, empieza por la <b>Oficina .env<\/b>, al oeste."], "notaria.fet": ["Las claves, siempre en el .env, y el .env, nunca en GitHub."], "notaria.git": ["Ahora Git, el robot, quiere hacerte unas preguntas. Está aquí al lado."], "notaria.a": ["Te doy la bienvenida al Distrito de las Claves. Soy la <b>Notaria Env<\/b>.", "Aquí las APIs (el tiempo, el cine…) piden <b>clave<\/b>. Las tengo guardadas en el <b>Cofre de los Secretos<\/b>.", "Pero antes de abrirlo, tienes que demostrar que sabes para qué sirven y dónde se guardan."], "notaria.b": ["Toma tu <b>.gitignore<\/b>. Con él podrás abrir el Cofre… si Git, el robot guardián, te da el visto bueno."], "git.abans": ["BIP. ESCANEANDO CLAVES… Habla primero con la Notaria Env. BIP."], "git.fet": ["BIP. NINGUNA CLAVE EN EL HISTORIAL. TODO CORRECTO. BIP."], "git.a": ["BIP BIP. SOY GIT, EL ROBOT GUARDIÁN DEL REPOSITORIO.", "HAY ROBOTS QUE BUSCAN CLAVES EN GITHUB CONTINUAMENTE. YO VIGILO QUE NO SUBAS NINGUNA. VERIFICACIÓN:"], "git.b": ["BIP. VERIFICACIÓN SUPERADA. YA PUEDES ABRIR EL COFRE DE LOS SECRETOS CON EL .GITIGNORE."], "cofre.fet": ["El Cofre de los Secretos está vacío. Las claves están en tu mochila (y, en la vida real, en tu .env)."], "cofre.tancat": ["El <b>Cofre de los Secretos<\/b> está cerrado. Hay una inscripción: «Solo se abre para quien protege el .env con un .gitignore»."], "cofre.git": ["El cofre hace BIP. Git, el robot, aún no te ha dado el visto bueno."], "cofre.a": ["Usas el <b>.gitignore<\/b>… <i>clic<\/i>. ¡El Cofre de los Secretos se abre!", "Dentro hay dos sobres: <b>VITE_OWM_KEY<\/b> y <b>VITE_TMDB_TOKEN<\/b>."], "cofre.b": ["La <b>clave de OpenWeather<\/b> abre la Torre del Tiempo. El <b>token de TMDB<\/b>, el Cine."], "torre.tancada": ["La puerta de la <b>Torre del Tiempo<\/b> tiene una cerradura rara con un letrero: «appid=?». Hace falta la clave de OpenWeather."], "meteo.fet": ["Recuerda: units=metric para tener grados Celsius, y el viento ×3,6 para pasarlo a km/h."], "meteo.a": ["¡Ah, traes la clave! Soy Isobara, la meteoróloga de la torre.", "Aquí usamos <b>OpenWeather<\/b>, la API <i>Current Weather<\/i>: <code>/data/2.5/weather<\/code>. La clave va <b>dentro de la URL<\/b>, en el parámetro <b>appid<\/b>."], "meteo.b": ["Impecable. Toma, el <b>Boletín del tiempo<\/b>: en Girona, <code>weather[0].main = \"Rain\"<\/code>. ¡Llueve!", "Llévalo al <b>Cine TMDB<\/b>: allí decidirán qué película toca, según el tiempo.", "Ah, y si quieres un <b>bonus<\/b>: prueba en la consola una petición real con una clave inventada, <code>https://api.openweathermap.org/data/2.5/weather?q=Barcelona&amp;appid=inventada<\/code>, y mira qué responde el servidor."], "cinema.tancat": ["El Cine TMDB está cerrado. Un cartel dice: «Entrada con token (Authorization: Bearer)»."], "proj.fet": ["This product uses the TMDB API but is not endorsed or certified by TMDB. ¡Lo decimos siempre, antes de cada sesión!"], "proj.a": ["¡Te doy la bienvenida al Cine TMDB! Soy Bobina, el proyeccionista.", "Aquí el token <b>no va en la URL<\/b>: va en la <b>cabecera Authorization<\/b>. Y el proyector no arranca…"], "proj.butlleti": ["¡El proyector ya funciona! Ahora quiero preparar el <b>Plan de tarde<\/b>: la película depende del tiempo que hace.", "Tráeme el <b>Boletín del tiempo<\/b> de la Torre del Tiempo y encadenaremos las dos APIs."], "proj.b": ["¡Tienes el boletín! Pues montemos el <b>Plan de tarde<\/b>: primero OpenWeather y, según el tiempo, TMDB."], "proj.c": ["Dos APIs encadenadas y ni un solo bucle. Aquí tienes la <b>Bobina del Plan de tarde<\/b>.", "Pero ojo: con tu token en <b>VITE_TMDB_TOKEN<\/b>, cualquiera puede verlo en Network. El <b>Portero Proxy<\/b>, al este, te enseñará a esconderlo."], "porter.fet": ["El token está dentro. Fuera, solo hay /tmdb. Nadie ve nada."], "porter.abans": ["Aquí solo pasa quien trae una <b>bobina del Plan de tarde<\/b>. Ve al Cine TMDB."], "porter.a": ["Buena bobina. Pero déjame que te enseñe una cosa… <b>F12 → Network → Headers<\/b>.", "Sale <code>Authorization: Bearer eyJ…<\/code> entero. Cualquier usuario de tu web puede copiarlo."], "porter.b": ["Lo has entendido todo. Aquí tienes la <b>Capa del proxy<\/b>: con ella el token viaja escondido.", "Pero el Bucle se ha extendido hacia el <b>Sur<\/b>. La capa también abre la <b>reja del Sur<\/b>, aquí abajo. Allí te esperan los cinco últimos capítulos."], "paradista.fet": ["Fotos de cualquier raza, al mejor precio: ¡gratis y sin clave!"], "paradista.a": ["¡Te doy la bienvenida al <b>Mercado de los Retos<\/b>! Aquí vendemos las <b>ampliaciones<\/b> de los ejemplos de la sesión 10.", "Yo soy la Tendera. En mi puesto no vendemos perros al azar: vendemos <b>razas concretas<\/b>."], "paradista.encarrec": ["Ahora pide en la consola una foto de <b>beagle<\/b>:<br><code>https://dog.ceo/api/breed/beagle/images/random<\/code>"], "paradista.espera": ["Aún no tengo el beagle. Consola, y:<br><code>https://dog.ceo/api/breed/beagle/images/random<\/code>"], "paradista.b": ["Ahora habla con <b>Sorpresa<\/b> y con <b>la Buscadora<\/b>, los otros dos puestos. Después vuelve."], "paradista.faltaSor": ["Te falta pasar por el puesto de Sorpresa."], "paradista.faltaCer": ["Te falta pasar por el puesto de la Buscadora."], "paradista.c": ["¡Has hecho todos los retos del mercado! Toma, unos <b>prismáticos<\/b>: abren la valla del <b>Delta del Llobregat<\/b>, al este."], "sorpresa.abans": ["¡Sorpresa!… Todavía no, todavía no. Habla primero con la Tendera."], "sorpresa.fet": ["Hoy me ha salido el número 7. Mañana, ¡quién sabe!"], "sorpresa.a": ["¡SORPRESA! Soy Sorpresa. En mi puesto cada Pokémon sale al azar… si sabes calcular bien el número."], "sorpresa.b": ["Perfecto: del 1 al 151, y con las habilidades en el tipo."], "cercadora.abans": ["Busco, busco… Habla primero con la Tendera."], "cercadora.fet": ["Biblioteca, escuela, polideportivo… con $q lo encuentro todo."], "cercadora.a": ["Soy la Buscadora. Quiero un buscador de equipamientos con <b>$q<\/b>, pero sin enviar nada si el texto está vacío."], "cercadora.b": ["¡Muy bien! Y recuerda: cuando el proyecto crezca, quizá te convenga TanStack Query o SWR."], "ornitoleg.fet": ["¡Mira, una garza real! O quizá era un JSON… Con estos prismáticos ya no sé lo que veo."], "ornitoleg.a": ["¡Chisss! Habla bajito, que vas a espantar a los pájaros. Soy el Ornitólogo del Delta.", "Uso <b>iNaturalist<\/b>, una API abierta con las observaciones de naturaleza que hace la gente. Ayúdame a montar la URL."], "ornitoleg.a2": ["Ahora pruébala en la consola: «Pégala» te la pone."], "ornitoleg.espera": ["Aún no me has traído las observaciones. Prueba en la consola la URL que has montado."], "ornitoleg.b": ["¡Cuántas observaciones! Fíjate bien en la forma del JSON."], "ornitoleg.c": ["Ahora ve con la <b>Naturalista del Delta<\/b>: ella usa otra API, GBIF, para las fichas de las especies."], "naturalista.abans": ["Estoy observando los flamencos. Habla primero con el Ornitólogo."], "naturalista.fet": ["¡Gracias! Con iNaturalist y GBIF, el delta no tiene secretos."], "naturalista.a": ["¡Hola! Soy la Naturalista del Delta. Mira los flamencos: son <i>Phoenicopterus roseus<\/i>.", "La API de <b>GBIF<\/b> (sin clave) devuelve la ficha de una especie a partir del nombre científico. Pide en la consola:<br><code>https://api.gbif.org/v1/species/match?name=Phoenicopterus%20roseus<\/code>"], "naturalista.espera": ["Aún no me has traído la ficha del flamenco. Pide en la consola:<br><code>https://api.gbif.org/v1/species/match?name=Phoenicopterus%20roseus<\/code>"], "naturalista.b": ["¡Ya la tienes! A ver qué dice."], "naturalista.c": ["¡Excelente! Toma este <b>formulario de registro<\/b>: con él te dejarán entrar en el <b>Registro de las Claves<\/b>, al norte del Sur."], "flamenc": ["El flamenco te mira con una pata levantada. En la ficha de GBIF pone: <code>\"family\": \"Phoenicopteridae\"<\/code>."], "registre.tancat": ["La puerta del <b>Registro de las Claves<\/b> dice: «Imprescindible traer el formulario de registro»."], "registradora.fet": ["Todas las claves en regla. ¡Registro cerrado!"], "registradora.a": ["Formulario recibido. Soy la Registradora. Aquí registramos las claves de API… y comprobamos que sabes conseguirlas y guardarlas.", "Primero, los pasos para conseguirlas. Después, los archivos que hay en el proyecto."], "registradora.b": ["¡Registro completo! Toma, la <b>llave del Observatorio<\/b>, al suroeste. Allí te esperan los retos de la sesión 11."], "observatori.tancat": ["La cúpula del <b>Observatorio<\/b> está cerrada. Hace falta la llave que da la Registradora."], "astronoma.fet": ["El cielo, el tiempo y las películas: todo en páginas de 20 resultados."], "astronoma.a": ["Te doy la bienvenida al <b>Observatorio<\/b>. Soy la Dra. Previsión.", "Desde aquí miramos el cielo… y hacemos los <b>retos de la sesión 11<\/b>: unidades, ubicación, previsión de 5 días y, en la sala de proyecciones, fichas y páginas de TMDB."], "astronoma.b": ["Impecable. Toma, las <b>coordenadas de la playa<\/b>: latitude=41.29, longitude=2.11. Abren el paso a la <b>Playa del Prat<\/b>, al sur del todo."], "platja.tancada": ["Un cartel dice: «Paso a la playa. Indica las coordenadas». Hace falta el objeto del Observatorio."], "socorrista.fet": ["Bandera verde y 200 OK. ¡Buen baño!"], "socorrista.a": ["¡Hola! Soy Ona, la socorrista de la Playa del Prat.", "Quiero una tarjeta con el estado del mar. Usaremos <b>Open-Meteo Marine<\/b>, una API abierta. Primero, la URL."], "socorrista.a2": ["Ahora pruébala en la consola."], "socorrista.espera": ["Aún no tengo los datos del mar. Prueba en la consola la URL que has montado."], "socorrista.b": ["¡Datos recibidos! Veamos qué nos dice el mar."], "socorrista.c": ["Ya lo tienes todo. Toma, la <b>Concha del 200 OK<\/b>: si te la acercas a la oreja, oyes una API que responde bien.", "Con ella ya puedes detener al Bucle Infinito. Vuelve a la plaza: ¡la <b>Gran Pantalla<\/b> te espera!"], "nar.tancada": ["{zona} está cerrada con un candado. Hace falta: <b>{obj}<\/b>."], "nar.barrera": ["Una barrera roja y blanca corta el paso al puente. Pone <b>CORS<\/b>. El Guardián, al lado, vigila."], "gos": ["¡Guau! 🐶", "¡Guau, guau! <code>{\"status\": \"success\"}<\/code>", "Grrr… <code>404<\/code>. (Era broma. ¡Guau!)"], "porta.restaurant": ["La puerta de la cocina dice: «Solo personal. Las comandas, al camarero.»"], "porta.gossera": ["De dentro de la caseta salen ladridos y una voz que dice: <code>status: \"success\"<\/code>."], "porta.lab": ["En la puerta del laboratorio: «Prohibido hacer fetch fuera de un useEffect»."], "porta.arxiu": ["El Archivo guarda datos públicos en formatos reutilizables: los <b>datos abiertos<\/b>."], "porta.taller": ["Del taller sale calor y un ruido metálico: <i>clinc, useState, clinc, useEffect<\/i>."], "porta.oficina": ["Oficina .env. Horario: solo al arrancar el servidor (npm run dev)."], "porta.proxy": ["Una puerta negra sin pomo. Un letrero de neón dice: «Solo pasa el servidor»."], "porta.mercat": ["El almacén del mercado: cajas llenas de JSON a granel."], "boss.a": ["JA, JA, JA… ¡SOY EL BUCLE INFINITO! PETICIÓN, SET, RENDER, PETICIÓN, SET, RENDER…", "¡NADIE ME DETIENE! ¡429! ¡429! ¡429!"], "boss.fi": ["¡LO HAS CONSEGUIDO, {nom}! La Gran Pantalla vuelve a funcionar: perros, Pokémon, equipamientos, el tiempo, películas y el mar. ¡Todo con 200 OK!"]}}, en: {"CAPITOLS": [{"nom": "The Server Kitchen", "tema": "What an API is, JSON and status codes"}, {"nom": "The Dog CEO Kennel", "tema": "fetch, async and await"}, {"nom": "The PokéAPI Lab", "tema": "Loading and error states, try/catch and resposta.ok"}, {"nom": "The Open Data Archive", "tema": "SoQL, URLSearchParams, useEffect and cleanup"}, {"nom": "The Hooks Workshop and the CORS Bridge", "tema": "The useFetch hook, common errors and CORS"}, {"nom": "The Keys Office", "tema": "API keys, 401/403 errors and the .env file"}, {"nom": "The Weather Tower", "tema": "OpenWeather: the key goes in the URL"}, {"nom": "The TMDB Cinema", "tema": "TMDB: the token goes in the header, and two chained APIs"}, {"nom": "The Proxy Door", "tema": "The key is not secret in the browser: the Vite proxy"}, {"nom": "The Challenge Market", "tema": "Extending the examples: dog breed, surprise Pokémon and search with $q"}, {"nom": "The Llobregat Delta", "tema": "iNaturalist and GBIF: result arrays, optional fields and matchType"}, {"nom": "The Keys Registry", "tema": "Getting the keys, free plans, vite-env.d.ts and missatgeError"}, {"nom": "The Observatory", "tema": "Units, geolocation, 5-day forecast, movie details and TMDB pages"}, {"nom": "El Prat Beach", "tema": "Open-Meteo Marine and how to approach any new API"}, {"nom": "The Infinite Loop", "tema": "Final battle: everything you have learned"}], "OBJECTES": {"portatil": {"nom": "Dev laptop", "desc": "Open the console with the T key. There you can make REAL requests with fetch and see the response."}, "clau_gossera": {"nom": "Kennel key", "desc": "Opens the gate of the Dog CEO Kennel, east of the square."}, "segon_await": {"nom": "The second await", "desc": "The one that waits for the response body to be read: await resposta.json(). Someone in the square is looking for it…"}, "passi_lab": {"nom": "Lab pass", "desc": "Opens the gate of the PokéAPI Lab, in the south-east."}, "escut": {"nom": "try/catch Shield", "desc": "If something in the try fails, the catch stops it. And the finally is always there."}, "carnet_arxiu": {"nom": "Archive card", "desc": "Opens the gate of the Open Data Archive, in the north-west."}, "escombra": {"nom": "Cleanup broom", "desc": "The useEffect cleanup function: ignorar = true. It sweeps away the responses you no longer need."}, "clau_taller": {"nom": "Workshop key", "desc": "Opens the gate of the Hooks Workshop, in the south-west."}, "hook": {"nom": "useFetch<T> hook", "desc": "Three states, one effect, try/catch and cleanup… all in a single line: const { dades, carregant, error } = useFetch<T>(url)."}, "capcalera_cors": {"nom": "CORS header", "desc": "Access-Control-Allow-Origin: *. The Guardian of the bridge has let you into the Keys District."}, "gitignore": {"nom": ".gitignore file", "desc": ".env · .env.* · !.env.example. It protects your secrets: without it, the Chest of Secrets won't open."}, "clau_owm": {"nom": "OpenWeather key", "desc": "VITE_OWM_KEY. 32 characters. It goes INSIDE the URL, in the appid parameter. It opens the Weather Tower."}, "token_tmdb": {"nom": "TMDB token", "desc": "VITE_TMDB_TOKEN. The long one, it starts with eyJ… It goes in the header Authorization: Bearer. It opens the Cinema."}, "butlleti": {"nom": "Weather report", "desc": "weather[0].main = \"Rain\". It's raining in Girona. With this, the Cinema will decide which movie genre to ask for."}, "bobina": {"nom": "Afternoon Plan reel", "desc": "Two chained APIs: the weather decides the genre and TMDB returns the movies. The Proxy Doorman wants to see it."}, "capa": {"nom": "Proxy cloak", "desc": "With it, the token travels hidden: the browser talks to the server, and the server is the one that adds the key. It also opens the South gate."}, "prismatics": {"nom": "Binoculars", "desc": "They open the gate of the Llobregat Delta. For watching birds… and JSON."}, "formulari": {"nom": "Registration form", "desc": "Fill it in and the Keys Registry will open its door for you."}, "clau_observatori": {"nom": "Observatory key", "desc": "Opens the dome of the Observatory, where the OpenWeather and TMDB challenges take place."}, "coordenades": {"nom": "Beach coordinates", "desc": "latitude=41.29 · longitude=2.11. They open the way to El Prat Beach."}, "petxina": {"nom": "200 OK seashell", "desc": "If you hold it to your ear, you can hear an API that responds well. The last missing piece to stop the Loop."}}, "APUNTS": {"a1": {"titol": "What is an API", "zona": "Kitchen Road", "text": "A <b>web API<\/b> is an address (URL) of a server that, instead of returning a page to look at, returns <b>data<\/b> for a program to use. Almost always in <b>JSON<\/b>.\n<ul><li><b>Endpoint<\/b>: each specific URL of the API.<\/li><li><b>Request<\/b>: what we send. To read, a <code>GET<\/code> request.<\/li><li><b>Response<\/b>: a status code and a body with the data.<\/li><\/ul>\nThe waiter: you (the component) don't go into the kitchen (the database). You place a proper order (the URL) and the waiter brings you the dish (the JSON)."}, "a2": {"titol": "Status codes", "zona": "The Server Kitchen", "text": "<table><tr><td><b>200<\/b><\/td><td>OK: the body contains the data.<\/td><\/tr><tr><td><b>401<\/b><\/td><td>Unauthorized: there is no key, it is copied wrong or it is not activated.<\/td><\/tr><tr><td><b>403<\/b><\/td><td>Forbidden: the key is fine but your plan doesn't include this.<\/td><\/tr><tr><td><b>404<\/b><\/td><td>Not Found: what you ask for doesn't exist.<\/td><\/tr><tr><td><b>429<\/b><\/td><td>Too Many Requests: too many requests in a short time.<\/td><\/tr><tr><td><b>500<\/b><\/td><td>Internal Server Error: the server failed.<\/td><\/tr><\/table>\nTip: before you code against an API, look at the response in the browser and in DevTools → <b>Network<\/b> (Fetch/XHR filter)."}, "a3": {"titol": "fetch and the two awaits", "zona": "The Dog CEO Kennel", "text": "<pre>const resposta = await fetch(url);\nconst dades = await resposta.json();<\/pre>\n<code>fetch<\/code> doesn't return the data: it returns a <b>promise<\/b>. The first <code>await<\/code> waits for the response; the second one waits until the whole body is read. If you forget the second one, you get <code>Promise {&lt;pending&gt;}<\/code> and <code>dades.message<\/code> is <code>undefined<\/code>.<br><code>await<\/code> can only be used inside an <code>async<\/code> function."}, "a4": {"titol": "The four states and try/catch/finally", "zona": "The PokéAPI Lab", "text": "<pre>const [nom, setNom] = useState('pikachu');\nconst [pokemon, setPokemon] = useState&lt;Pokemon | null&gt;(null);\nconst [carregant, setCarregant] = useState(false);\nconst [error, setError] = useState('');<\/pre>\nBefore the request: <code>setCarregant(true)<\/code>, and the error and the result are cleared. Inside the <code>try<\/code>, the request. In the <code>catch<\/code>, the error message. In the <code>finally<\/code> (it always runs), <code>setCarregant(false)<\/code>."}, "a5": {"titol": "A 404 is NOT an error for fetch", "zona": "The PokéAPI Lab", "text": "<table><tr><td>No network, the server doesn't exist, or CORS<\/td><td>fetch throws an error (TypeError: Failed to fetch) → the <code>catch<\/code> catches it.<\/td><\/tr><tr><td>The server responds 404, 429, 500…<\/td><td>fetch does NOT throw an error: <code>resposta.ok<\/code> is <code>false<\/code> → we have to <code>throw<\/code> by hand.<\/td><\/tr><tr><td>The server responds 200<\/td><td>We read the JSON and save it in the state.<\/td><\/tr><\/table>\n<pre>if (!resposta.ok) {\n  throw new Error(`Error ${resposta.status}`);\n}<\/pre>"}, "a6": {"titol": "SoQL and URLSearchParams", "zona": "The Open Data Archive", "text": "The open data of the Generalitat (the Catalan government, on Socrata) understands parameters similar to SQL:\n<table><tr><td><code>$select<\/code><\/td><td>which fields I want<\/td><\/tr><tr><td><code>$where<\/code><\/td><td>filter (like WHERE)<\/td><\/tr><tr><td><code>$order<\/code><\/td><td>order<\/td><\/tr><tr><td><code>$limit<\/code><\/td><td>maximum number of records (otherwise, up to 1,000)<\/td><\/tr><tr><td><code>$q<\/code><\/td><td>free-text search<\/td><\/tr><\/table>\n<pre>const parametres = new URLSearchParams({\n  $where: `codi_municipi='${codi}'`, $limit: '10' });\nconst url = `${API}?${parametres}`;<\/pre>\n<code>URLSearchParams<\/code> encodes special characters ($ → %24, ' → %27…)."}, "a7": {"titol": "useEffect, [url] and cleanup", "zona": "The Open Data Archive", "text": "With no click, the request goes inside a <code>useEffect<\/code>: it runs when the component appears and every time <code>url<\/code> changes (dependency <code>[url]<\/code>).\n<pre>useEffect(() => {\n  let ignorar = false;\n  async function carregar() { … if (!ignorar) setDades(dades); }\n  carregar();\n  return () => { ignorar = true; };\n}, [url]);<\/pre>\nThe effect function can't be <code>async<\/code>. The cleanup prevents the <b>race condition<\/b>. In development, <code>&lt;StrictMode&gt;<\/code> runs the effect twice on purpose. <b>Never<\/b> put a fetch directly in the component body: infinite loop."}, "a8": {"titol": "The custom hook useFetch<T>", "zona": "The Hooks Workshop", "text": "When some hook logic is repeated, we move it into a custom hook:\n<pre>export function useFetch&lt;T&gt;(url: string) {\n  const [dades, setDades] = useState&lt;T | null&gt;(null);\n  const [carregant, setCarregant] = useState(true);\n  const [error, setError] = useState('');\n  useEffect(() => { … }, [url]);\n  return { dades, carregant, error };\n}<\/pre>\nAnd the component: <code>const { dades, carregant, error } = useFetch&lt;Pokemon&gt;(url);<\/code><br>In big projects: TanStack Query or SWR (cache, retries…)."}, "a9": {"titol": "CORS and keys in the front-end", "zona": "The CORS Bridge", "text": "“… has been blocked by CORS policy”: the server doesn't allow a website from another domain to ask it for data. It is a browser protection, not an error in your code. The APIs we use in class send <code>Access-Control-Allow-Origin: *<\/code>. If an API doesn't, you need your own intermediate server.<br><br>All front-end code can be read from the browser (F12 → Sources): anyone can see a private key in React code."}, "a10": {"titol": "The .env file", "zona": "The Keys Office", "text": "<pre># .env  (MAI a GitHub)\nVITE_OWM_KEY=3f9a1c0b…\nVITE_TMDB_TOKEN=eyJhbGciOi…<\/pre>\n<pre># .gitignore\n.env\n.env.*\n!.env.example<\/pre>\nVite only passes to the code the variables that start with <code>VITE_<\/code>: <code>import.meta.env.VITE_OWM_KEY ?? ''<\/code>. The .env file is only read at startup: if you change it, press Ctrl+C and run <code>npm run dev<\/code> again. On Windows, watch out for <code>.env.txt<\/code>."}, "a11": {"titol": "Two ways to send the key", "zona": "The Keys District", "text": "<b>OpenWeather<\/b>: the key is just one more parameter in the URL.\n<pre>…/data/2.5/weather?q=Barcelona&amp;appid=CLAU&amp;units=metric&amp;lang=ca<\/pre>\n<b>TMDB<\/b>: the token goes in the header.\n<pre>fetch(url, {\n  headers: {\n    Authorization: `Bearer ${TOKEN_TMDB}`,\n    accept: 'application/json',\n  },\n});<\/pre>\n“Bearer” + ONE space + the long token (eyJ…). With the short API Key, you get 401."}, "a12": {"titol": "The Vite proxy", "zona": "The Proxy Door", "text": "Everything that starts with <code>VITE_<\/code> ends up inside the JavaScript that the browser receives. To really hide the key, the browser talks to <b>our server<\/b>, and the server is the one that adds the token:\n<pre>proxy: { '/tmdb': {\n  target: 'https://api.themoviedb.org',\n  changeOrigin: true,\n  rewrite: (cami) => cami.replace(/^\\/tmdb/, ''),\n  headers: { Authorization: `Bearer ${env.TMDB_TOKEN}` },\n} }<\/pre>\n<code>TMDB_TOKEN<\/code> has no <code>VITE_<\/code> prefix. Once the app is published, a server function does this job (Cloudflare, Netlify, Vercel or your own backend)."}, "a13": {"titol": "Extending an example: only the URL changes", "zona": "The Challenge Market", "text": "To ask for a specific breed, the JSON is identical: only the URL changes.\n<pre>const url = `https://dog.ceo/api/breed/${raca}/images/random`;<\/pre>\nA random Pokémon between 1 and 151:\n<pre>Math.floor(Math.random() * 151) + 1<\/pre>\nTo add a new field (like <code>abilities<\/code>), first add it to the <b>type<\/b>. And with <code>$q<\/code>: if the text is empty, don't send it. If the URL is in the effect's dependencies, you don't need to change anything else."}, "a14": {"titol": "iNaturalist and GBIF", "zona": "The Llobregat Delta", "text": "<b>iNaturalist<\/b>: the observations are in the <code>results<\/code> array. From each one: <code>photos[0].url<\/code>, <code>taxon.preferred_common_name<\/code> (it may be missing: optional field with <code>?<\/code>) and <code>taxon.name<\/code> (scientific name).\n<pre>…/v1/observations?lat=41.30&amp;lng=2.09&amp;radius=5&amp;per_page=12&amp;photos=true<\/pre>\n<b>GBIF<\/b>: <code>…/v1/species/match?name=Phoenicopterus%20roseus<\/code> returns <code>scientificName<\/code>, <code>kingdom<\/code>, <code>order<\/code>, <code>family<\/code> and <code>matchType<\/code>. If <code>matchType<\/code> is <code>NONE<\/code>, it didn't find it."}, "a15": {"titol": "Getting the keys", "zona": "The Keys Registry", "text": "<b>OpenWeather<\/b>: account → My API keys (Default) → 32-character key in <code>VITE_OWM_KEY<\/code>. It can take up to 2 h to activate. Free plan: 60 requests/minute and 1,000,000/month. You don't need One Call 3.0.<br>\n<b>TMDB<\/b>: account → settings/api → personal, non-commercial use → copy the <b>API Read Access Token<\/b> (eyJ…) to <code>VITE_TMDB_TOKEN<\/code>. About 40 requests/s. Attribution is required.<br>\nThe repository contains <code>.env.example<\/code> (an empty template), and <code>vite-env.d.ts<\/code> tells TypeScript which variables exist."}, "a16": {"titol": "Session 11 challenges", "zona": "The Observatory", "text": "<ul><li><b>Units<\/b>: <code>units=metric<\/code> (°C) or <code>imperial<\/code> (°F); change the symbol too.<\/li>\n<li><b>Where am I?<\/b> <code>navigator.geolocation.getCurrentPosition<\/code> → <code>lat<\/code> and <code>lon<\/code> in the URL instead of <code>q<\/code>.<\/li>\n<li><b>Forecast<\/b>: <code>/data/2.5/forecast<\/code> returns <code>list<\/code>, one forecast every 3 hours: keep the 12:00 one.<\/li>\n<li><b>Movie details<\/b>: <code>/3/movie/{id}<\/code> with <code>overview<\/code>, <code>runtime<\/code> and <code>genres<\/code>; with <code>useApi<\/code>, set the URL to <code>null<\/code> while no movie is selected.<\/li>\n<li><b>Pages<\/b>: <code>page<\/code> and <code>total_pages<\/code>.<\/li><\/ul>"}, "a17": {"titol": "Any new API, in five steps", "zona": "El Prat Beach", "text": "<ol><li>Try the URL in the browser and look at the JSON.<\/li><li>Write the <b>type<\/b> with only the fields you will use.<\/li><li>Call <code>useFetch&lt;T&gt;(url)<\/code> (or <code>useApi<\/code> if you need a token).<\/li><li>Render the three states: carregant (loading), error and dades (data).<\/li><li>Check it in DevTools → Network.<\/li><\/ol>\nExample: <code>https://marine-api.open-meteo.com/v1/marine?latitude=41.29&amp;longitude=2.11&amp;current=wave_height,sea_surface_temperature<\/code> → <code>current<\/code> and <code>current_units<\/code>."}}, "REPTES": {"c1_api": {"enunciat": "Before we serve you anything, a question from the house: what is a <b>web API<\/b>?", "pista": "Think about what it returns: it's not a page to look at…", "explica": "An API is a URL that returns data (usually JSON) for a program. fetch already comes with the browser: you don't need to install anything.", "opcions": ["An address (URL) of a server that returns data for a program to use, almost always in JSON", "A React library that you install with npm to be able to make requests", "A web page designed for a person to read", "The database inside the server"]}, "c1_plat": {"enunciat": "In my restaurant, you are the component. I am the waiter. The kitchen is the database. So… what is the <b>dish<\/b> I bring to your table?", "pista": "The order is the URL. What comes back from the kitchen…", "explica": "You place a proper order (the URL) and the waiter brings you the dish (the JSON). You never go into the kitchen.", "opcions": ["The URL", "The JSON of the response", "The React component", "The status code 200"]}, "c1_vocab": {"enunciat": "The chef wants you to help her label the menu. Match each word with its meaning:", "pista": "One definition talks about GET and another one about status codes.", "explica": "Endpoint = a specific URL. Request = what we send (GET to read). Response = status code + body. JSON = the data format.", "parelles": [["Endpoint", "Each specific URL of the API, like /api/breeds/image/random"], ["Request", "What we send; to read data, a GET request"], ["Response", "A status code (200, 404…) and a body with the data"], ["JSON", "Text shaped like JavaScript objects { } and arrays [ ]"]]}, "c1_camps": {"enunciat": "You placed your order at <code>https://dog.ceo/api/breeds/image/random<\/code>. Which <b>two fields<\/b> does the JSON dish contain?", "pista": "Look at the console: the JSON has two keys.", "explica": "Dog CEO returns { \"message\": \"https://images.dog.ceo/…jpg\", \"status\": \"success\" }. message is the address of the photo.", "opcions": ["message and status", "url and ok", "image and breed", "data and error"]}, "c1_codis": {"enunciat": "The status codes are on the kitchen wall. Give each one its meaning:", "pista": "A 4xx is usually the request's “fault”; a 5xx, the server's.", "explica": "200 = all good · 404 = doesn't exist · 429 = too many requests · 500 = server error.", "parelles": [["200 OK", "All correct: the body contains the data"], ["404 Not Found", "This URL doesn't exist (a Pokémon that doesn't exist)"], ["429 Too Many Requests", "You made too many requests in a short time: the API slows you down"], ["500 Internal Server Error", "The server failed; it's not your fault, but you have to handle it"]]}, "c1_network": {"enunciat": "A customer complains: “The API doesn't work!”. Which DevTools tab (F12) tells you if the request went out, what was asked for and what came back?", "pista": "Think of a net…", "explica": "In Network, each request is a row: in Headers you see the URL and the status; in Preview/Response, the JSON. It's your best friend when an API “doesn't work”.", "opcions": ["Network (Fetch/XHR filter)", "Elements", "Lighthouse", "Application"]}, "c1_tres": {"enunciat": "The key idea of the house: to use an API from React you only need to know <b>three things<\/b>. Select them:", "pista": "There are three, and they all depend on what you can see from outside the kitchen.", "explica": "Which URL, what shape the JSON has and where we store it (useState). You don't need to know anything about the kitchen.", "peces": ["Which URL to request", "What shape the returned JSON has", "Where we will store it (in the state, with useState)", "Which language the server is programmed in", "Which npm library you need to install to make requests", "Which database the kitchen uses"]}, "c2_promesa": {"enunciat": "Bru asks you a question before he lets you touch anything: what does <code>fetch('https://…')<\/code> return directly?", "pista": "That's why we put await in front of it…", "explica": "fetch sends the request and returns a Promise. await waits for it to be fulfilled without blocking the page.", "opcions": ["A promise (Promise): an “IOU” that will be fulfilled when the response arrives", "The JavaScript object with the data already converted", "A text with the JSON of the response", "Nothing: fetch saves the data in the state automatically"]}, "c2_omple": {"enunciat": "The code of the “I want a dog!” button has lost some pieces. Put them back in place:", "pista": "Two awaits: one for fetch and another one to read the body.", "explica": "await fetch(…) waits for the response; await resposta.json() turns it into an object; dades.message is the address of the photo."}, "c2_viatge": {"enunciat": "Put the journey of a request in order, from the moment the user presses the button until they see the dog:", "pista": "It starts with the click and ends with React rendering.", "explica": "Click → request → response → .json() → set… → React renders again. Each set… causes a new render.", "peces": ["The user presses “I want a dog!” and onClick calls demanarGos", "fetch sends a GET request to dog.ceo", "The first await waits for the response (status 200)", "await resposta.json() turns the body into an object", "setFoto(dades.message) saves the address in the state", "React renders the component again and the image appears"]}, "c2_onclick": {"enunciat": "Why do we write <code>onClick={demanarGos}<\/code> and not <code>onClick={demanarGos()}<\/code>?", "pista": "With parentheses, the function runs right at that moment…", "explica": "Without parentheses we pass the function; React will call it when the click happens.", "opcions": ["Because we pass the function so that React calls it on click; with parentheses we would call it while rendering the component", "Because async functions can't have parentheses", "It doesn't matter: both forms do the same thing", "Because with parentheses TypeScript won't compile"]}, "c2_and": {"enunciat": "What does this JSX line do?", "pista": "An empty string is “falsy” for JavaScript.", "explica": "Conditional rendering: with '' nothing is rendered. And always add the alt: it's for screen readers.", "opcions": ["While foto is '' (falsy) it renders nothing; once there is a URL, it renders the image", "It renders the image and the foto variable at the same time", "If foto is empty, it shows a broken image", "It makes the API request when foto changes"]}, "c2_tipus": {"enunciat": "Why do we write <code>type RespostaGos = { message: string; status: string }<\/code>?", "pista": "The API is a server on the Internet: TypeScript can't guess it.", "explica": "The type copies the shape of the JSON we saw in the browser. The names must be the ones the API uses (never translated). That way VS Code autocompletes dades.message.", "opcions": ["TypeScript doesn't know what the API will return; we tell it by copying the shape of the JSON, with the exact names and only the fields we will use", "Because fetch doesn't work if we don't give it a type", "Because the server reads it to know which fields to send", "To translate the field names into Catalan"]}, "c2_forats": {"enunciat": "Bru says the first example “still has two holes”. Which ones?", "pista": "The user doesn't know if it's loading… and what if it fails?", "explica": "The loading state and the error handling are missing. The PokéAPI example (in the Lab) fixes this.", "opcions": ["It doesn't tell the user while it's loading, and if there's no connection the user sees no error (it only appears in red in the console)", "It doesn't use any useEffect and the list has no key", "The photo has no alt and the button has no type", "It has no API key and doesn't check CORS"]}, "c2_pending": {"enunciat": "Pending has been waiting for hours. His console shows <code>Promise {&lt;pending&gt;}<\/code> and <code>undefined<\/code>. <b>Click the line that fails:<\/b>", "pista": "resposta.json() is also a promise.", "explica": "The second await is missing: const dades = await resposta.json();. Without it, dades is a pending Promise and dades.message is undefined."}, "c3_pes": {"enunciat": "You now have <b>pikachu<\/b>'s data in the console. The <code>weight<\/code> field is in <b>hectograms<\/b>. How many <b>kilos<\/b> does it weigh?", "pista": "Look at the weight field and divide it by 10.", "explica": "weight = 60 hectograms → 60 / 10 = 6 kg. That's why in the JSX we write {pokemon.weight / 10} kg.", "solucio": "6 kg (weight 60 / 10)"}, "c3_alcada": {"enunciat": "And the <code>height<\/code> field is in <b>decimetres<\/b>. How many <b>metres<\/b> tall is it?", "pista": "height is 4. Divide by 10.", "explica": "height = 4 decimetres → 0.4 m.", "solucio": "0.4 m (height 4 / 10)"}, "c3_array": {"enunciat": "The <code>Pokemon<\/code> type has this line. What do the <code>[]<\/code> at the end mean?", "pista": "In the JSON, types is inside square brackets.", "explica": "The [] mean “array of”. To render it: pokemon.types.map((t) => t.type.name).join(', ') → \"electric\".", "opcions": ["“Array of”: types is an array of objects", "That the field is optional", "That the field is read-only", "That the value can be null"]}, "c3_estats": {"enunciat": "Dr. Sprite uses four states in the search tool. What is each one for?", "pista": "One is for the input, one for the data, one for waiting and one for problems.", "explica": "nom (name, the input) · pokemon (data or null) · carregant (loading: true/false) · error ('' if there is none).", "parelles": [["nom", "What the user types in the input (controlled input)"], ["pokemon", "The API response; null means “there isn't one yet”"], ["carregant", "true while the request is out and hasn't come back yet"], ["error", "The error message; empty text = no error"]]}, "c3_cercar": {"enunciat": "The <code>cercar<\/code> (search) function got mixed up on the blackboard. Put it back in order:", "pista": "First the state is prepared, then the try with the request, the catch and the finally.", "explica": "Prepare states → try (fetch, check ok, json, set) → catch (message) → finally (stop loading)."}, "c3_404": {"enunciat": "You asked for <b>pikatxu<\/b> and the server answered <b>404<\/b>. Did <code>fetch<\/code> throw an error?", "pista": "Look at the ok in the console…", "explica": "fetch only throws an error if no response arrives (network, CORS…). With a 404 you need: if (!resposta.ok) throw new Error(…).", "opcions": ["No: for fetch, a 404 also means “a response was received”; resposta.ok is false and we have to throw ourselves", "Yes: fetch always throws an error if the code isn't 200", "Yes, and the catch catches it automatically", "No, because PokéAPI returns 200 even if it doesn't exist"]}, "c3_llanca": {"enunciat": "Classify each situation according to what <code>fetch<\/code> does:", "pista": "If the server ANSWERS (with any code), fetch doesn't throw anything.", "explica": "No response (network, CORS) → TypeError: Failed to fetch. With a 4xx/5xx response → ok is false. With 200 → data.", "categories": ["fetch throws an error → the catch handles it", "It does NOT throw: check ok and throw", "All good: read the JSON"], "items": ["There is no Internet connection", "The browser blocks it because of CORS", "The server responds 404", "The server responds 500", "The server responds 429", "The server responds 200"]}, "c3_finally": {"enunciat": "Finally the Caretaker says he is “always there”. Why do we put <code>setCarregant(false)<\/code> inside the <code>finally<\/code>?", "pista": "Not only if it goes well, and not only if it goes wrong…", "explica": "finally = always. That way “Loading…” disappears both when the data arrives and when the error appears.", "opcions": ["Because the finally always runs, whether it went well or not: it's the ideal place to leave the “loading” state", "Because the finally only runs if there was an error", "Because you must always put something in it", "Because that way it runs before the try"]}, "c3_form": {"enunciat": "Form the Assistant has built the form for the lab's search tool. What does each piece do?", "pista": "One prevents reloading, one cleans the text, one blocks the button and the other one is for Enter.", "explica": "preventDefault (don't reload) · trim/toLowerCase (“ Pikachu ” → pikachu) · disabled (don't fire ten requests) · onSubmit (Enter).", "parelles": [["e.preventDefault()", "Stops the browser from sending the form the old way and reloading the page"], ["nom.trim().toLowerCase()", "The API only understands names in lowercase and without spaces"], ["disabled={carregant}", "While the request is out, the button can't be pressed again"], ["<form onSubmit={…}>", "Lets you search by pressing Enter too, not only with the button"]]}, "c4_params": {"enunciat": "Ms. SoQL shows you the parameters of the Socrata API. Match them:", "pista": "They are almost SQL words.", "explica": "SoQL (Socrata Query Language): $select, $where, $order, $limit and $q.", "parelles": [["$select", "Which fields I want (fewer fields, smaller response)"], ["$where", "Filter, like WHERE in SQL"], ["$order", "Order of the result"], ["$limit", "Maximum number of records (otherwise, up to 1,000)"], ["$q", "Free-text search in all fields"]]}, "c4_url": {"enunciat": "Build the URL that asks for <b>the first 3 facilities in El Prat de Llobregat<\/b> (code 81691), <b>sorted by name<\/b>, with only <b>name, category and street<\/b>. Choose the pieces:", "pista": "Filter by code, not by name (the data is messy). And the open data API doesn't need a key.", "explica": "We filter by codi_municipi because the name is written in three different ways. Open data: no key needed, but we ask only for what we need ($select, $limit)."}, "c4_array": {"enunciat": "Look at the Archive's response in the console. What is it?", "pista": "It starts with [ …", "explica": "Unlike Dog CEO or PokéAPI, Socrata returns an array of objects. That's why the type is Equipament[] and we render it with .map().", "opcions": ["An array [ … ] with 3 objects", "A single object { … } with 3 fields", "A text with 3 lines", "A number: 3"]}, "c4_codi": {"enunciat": "Why do we filter by <code>codi_municipi<\/code> in the example and not by the name of the town?", "pista": "“Prat de Llobregat, el”, “El Prat de Llobregat”, “Prat de Llobregat, El”…", "explica": "With real data this always happens: the code is stable and the text is not.", "opcions": ["Because real data is messy: El Prat is written in three ways, and the code is always the same", "Because Socrata doesn't allow filtering by text", "Because codes take up less space in the URL", "Because the name is a private field"]}, "c4_usp": {"enunciat": "What does <code>new URLSearchParams({ … })<\/code> do for us?", "pista": "Look at how the URL appears in the console…", "explica": "URLSearchParams builds the name=value pairs with & and encodes them. Then: const url = `${API}?${parametres}`.", "opcions": ["It builds the part after the ? and encodes special characters ($ → %24, ' → %27, spaces…)", "It makes the request and reads the JSON", "It checks that the URL exists before requesting it", "It adds the API key automatically"]}, "c4_effect": {"enunciat": "In the PokéAPI example, a click started the request. Why do we put it inside a <code>useEffect<\/code> here?", "pista": "Nobody presses any button…", "explica": "useEffect synchronizes the component with the server. Dependency [url]: if the URL changes, it runs again.", "opcions": ["Because there is no click: we want to load when the component appears and every time the town changes (synchronizing with something outside)", "Because fetch only works inside a useEffect", "Because that way the request is faster", "Because useEffect stores the data in the cache"]}, "c4_bucle": {"enunciat": "An intern has uploaded this component and the Network tab fills up with requests non-stop. <b>Click the guilty line:<\/b>", "pista": "Each render… makes a request… that makes a set… that makes a render…", "explica": "A fetch in the component body is repeated on every render: infinite loop. It goes inside a useEffect with [url] (or inside an event handler)."}, "c4_async": {"enunciat": "Why don't we write <code>useEffect(async () =&gt; { … }, [url])<\/code>?", "pista": "An async function always returns… a promise.", "explica": "Inside the effect: async function carregar() { … } and, right after it, carregar();", "opcions": ["Because the effect function must return nothing or a cleanup function, not a promise; that's why we define an async function inside it and call it", "Because async is forbidden in React", "Because then the effect would run twice", "Yes, you can: it's the recommended way"]}, "c4_carrera": {"enunciat": "Racer picks Barcelona and, right away, Cornellà. Put in order what happens thanks to the <code>ignorar<\/code> (ignore) variable:", "pista": "Each run of the effect has its own ignorar.", "explica": "Without the cleanup, the late response for Barcelona would overwrite Cornellà: a race condition.", "peces": ["Picks Barcelona: effect A runs and its request goes out (its ignorar is false)", "Picks Cornellà: React calls A's cleanup (A's ignorar becomes true) and runs effect B", "Response B arrives: its ignorar is false → Cornellà is rendered", "Response A arrives late: its ignorar is true → nothing is changed"]}, "c4_strict": {"enunciat": "The StrictMode Ghost asks you, with a double voice: “Why do you see <b>two<\/b> requests in Network when you open the tab?”", "pista": "Look at main.tsx…", "explica": "StrictMode helps us find effects without cleanup. In production there is only one request.", "opcions": ["In development, <StrictMode> runs each effect twice on purpose; the first one is ignored, and with npm run build only one is made", "Because the Socrata server always answers twice", "Because there is a bug in the code that needs fixing", "Because the browser always sends requests twice"]}, "c4_deps": {"enunciat": "You change the town in the dropdown and the list <b>doesn't change<\/b>. What's happening?", "pista": "When does an effect run again?", "explica": "The effect runs again when one of its dependencies changes. Without url in [url], React doesn't know it has to request again.", "opcions": ["url is not in the effect's dependencies: you need [url]", "The list is missing the key", "Socrata doesn't allow changing towns", "You need to run npm run dev again"]}, "c5_peces": {"enunciat": "Master Hook is forging a <code>useFetch<\/code>. Which pieces go inside it?", "pista": "Everything that was repeated in examples 2 and 3, but nothing that gets rendered.", "explica": "The hook contains the request logic; the JSX stays in the component.", "peces": ["Three useState: dades, carregant and error", "A useEffect with [url]", "try/catch/finally and the resposta.ok check", "The ignorar variable and the cleanup function", "The JSX of the results list", "A <form> with onSubmit", "The private API key written by hand"]}, "c5_omple": {"enunciat": "Complete the first line and the end of the hook:", "pista": "A generic hook, like useLocalStorage<T> from session 9.", "explica": "useFetch<T> is generic: whoever calls it says what shape the data has. The data starts as null, and everything is returned in an object."}, "c5_us": {"enunciat": "What is the correct way to use the hook in a component?", "pista": "The hook returns an object, not an array; and hooks don't go inside effects.", "explica": "One single line replaces the three useState, the effect and the try/catch. We take what we want by its name.", "opcions": ["const { dades, carregant, error } = useFetch<Pokemon>(url);", "const dades = await useFetch(url);", "const [dades, setDades] = useFetch<Pokemon>(url);", "useEffect(() => useFetch(url), [url]);"]}, "c5_seguent": {"enunciat": "In the Pokédex, you press “Next →” and <code>setId(id + 1)<\/code> runs. Why is a new request made?", "pista": "`…/pokemon/${id}`", "explica": "id → url → [url] → effect → new request. And disabled={id === 1}: there is no Pokémon number 0.", "opcions": ["Because changing id changes the URL, which is the dependency of the effect inside the hook", "Because the button calls fetch directly", "Because useFetch makes a request every second", "Because setId clears the browser cache"]}, "c5_errors": {"enunciat": "The typical errors are hanging on the workshop wall. Match each symptom with its fix:", "pista": "One is about promises, one about null, one about lists and one about status codes.", "explica": "These are four of the typical errors from session 10.", "parelles": [["undefined is rendered or Promise {<pending>} appears", "An await is missing: one for fetch and one for .json()"], ["Cannot read properties of null (reading 'sprites')", "Render the data inside {dades && …}: on the first render it is null"], ["Each child in a list should have a unique \"key\" prop", "Add key with the identifier that the API gives you"], ["404 error but nothing appears on the screen", "if (!resposta.ok) throw new Error(…)"]]}, "c5_cors": {"enunciat": "“Halt! I am the CORS Guardian. In the console you saw <i>… has been blocked by CORS policy<\/i>. What does it mean?”", "pista": "The browser blocks it, not your code.", "explica": "CORS is a browser protection. The server must say explicitly that it accepts requests from other websites.", "opcions": ["That the server doesn't allow a website from another domain to ask it for data: it's a browser protection, not an error in your code", "That the URL is spelled wrong", "That you forgot the second await", "That the server is down (error 500)"]}, "c5_capcalera": {"enunciat": "“Which response header do Dog CEO, PokéAPI and Socrata send so that you can use them from any website?”", "pista": "Allow… Origin…", "explica": "Access-Control-Allow-Origin: * means “any origin can read this response”. If an API doesn't send it, you need your own intermediate server.", "opcions": ["Access-Control-Allow-Origin: *", "Authorization: Bearer …", "Content-Type: text/html", "Cache-Control: no-cache"]}, "c5_clau": {"enunciat": "“Behind me is the Keys District. Last question: if you put a private key inside React code, who can see it?”", "pista": "The browser has to download the code to run it…", "explica": "Private keys can't live in the front-end. In the District you will see how they are stored (.env) and how they are really hidden (proxy).", "opcions": ["Any user: all front-end code can be read from the browser (F12 → Sources)", "Nobody: React code is compiled and stays encrypted", "Only the other developers of the repository", "Only the API server"]}, "c6_perque": {"enunciat": "Notary Env attends to you: “Why do some APIs (weather, movies, maps…) ask for a key?”", "pista": "Free plan, quota, limit…", "explica": "If you go over the limit of the free plan, the server answers with an error (429) instead of the data.", "opcions": ["Because they cost money to run: with the key, the server knows who you are, which plan you have and how many requests you have made", "Because without a key the JSON can't be read", "Because the key encrypts the data that travels", "Because React requires it"]}, "c6_vocab": {"enunciat": "Fill in the Office register: match each word with its meaning.", "pista": "The envelope, the bearer, the .env file…", "explica": "Key = identification · header = outside the URL · Bearer = the one who carries it · environment variable = .env.", "parelles": [["API key", "A unique text that identifies you to an API (32 characters in OpenWeather)"], ["Header", "Information that travels with the request but outside the URL, like the sender's address on an envelope"], ["Bearer", "“Holder”: let in whoever holds this token"], ["Environment variable", "A value that the program reads from outside the code: from the .env file"]]}, "c6_codis": {"enunciat": "With a key, errors have nuances. What does each code mean?", "pista": "401 and 403 are similar: in one the key fails, in the other the plan.", "explica": "401 = key · 403 = plan permission · 404 = doesn't exist · 429 = quota.", "parelles": [["401 Unauthorized", "There is no key, it is copied wrong or it is not activated yet"], ["403 Forbidden", "The key is fine but your plan doesn't include this"], ["404 Not Found", "The key is fine, but what you ask for doesn't exist (a made-up city)"], ["429 Too Many Requests", "Too many requests in a short time: wait and try again"]]}, "c6_401": {"enunciat": "A student says: “I get a 401, my Internet isn't working”. What do you answer?", "pista": "If there is a status code, someone has answered.", "explica": "A 401 means the server has answered. Check that the key is copied correctly, with no spaces, and that the .env has been loaded.", "opcions": ["That their Internet works: the request reached the server and the server answered; the problem is the key", "That they should restart the router", "That it's a CORS error", "That the server is down"]}, "c6_gitignore": {"enunciat": "To get the <b>.gitignore<\/b> you have to write it correctly. Complete the lines:", "pista": "The ! is an exception.", "explica": ".env and its variants are not uploaded; !.env.example is (it's the empty template, so others know which variables they need to fill in)."}, "c6_vite": {"enunciat": "In the .env you wrote <code>OWM_KEY=3f9a…<\/code> (without prefix). What is the value of <code>import.meta.env.OWM_KEY<\/code> in the code?", "pista": "The prefix is mandatory.", "explica": "It must be VITE_OWM_KEY. And in the URL you would see appid=undefined.", "opcions": ["undefined: Vite only passes to the browser code the variables that start with VITE_", "The key, no problem", "A compilation error", "An empty string"]}, "c6_reinicia": {"enunciat": "You created the .env while <code>npm run dev<\/code> was running, and the “A key is missing” warning doesn't go away. What do you do?", "pista": "Vite reads the .env at a specific moment…", "explica": "And on Windows, check that the file isn't called .env.txt and that it's next to package.json (not in src/).", "opcions": ["Stop the server (Ctrl+C) and run npm run dev again: the .env is only read at startup", "Wait two hours", "Put the key directly in the .tsx", "Delete node_modules"]}, "c6_fuga": {"enunciat": "Git the Guard Robot asks you: “If you have already pushed the key to GitHub, is it enough to delete the .env and make another commit?”", "pista": "Git remembers every commit…", "explica": "Regenerate the key and check that .env is in .gitignore before the next git add (or git rm --cached .env).", "opcions": ["No: the key is still in the history and there are bots searching for keys; you must delete it on the API website and create a new one", "Yes, with a new commit it disappears", "Yes, if you also run git push --force", "No need to do anything: free plan keys can't be used"]}, "c6_nullish": {"enunciat": "What does the <code>?? ''<\/code> in this line of <code>claus.ts<\/code> do?", "pista": "?? is the “default value” operator when something is null or undefined.", "explica": "With a guaranteed string, each example can show the <AvisClau> warning when the key is missing.", "opcions": ["If the variable is undefined, it uses ''; that way it's always a string and we can check if (!CLAU_OPENWEATHER)", "It encrypts the key", "It checks that the key has 32 characters", "It removes the spaces at the end"]}, "c7_url": {"enunciat": "The Meteorologist needs the URL for the weather in Barcelona <b>in degrees Celsius<\/b> and with the description <b>in Catalan<\/b>. Choose the pieces:", "pista": "In OpenWeather the key is just one more parameter, and it must be called exactly appid.", "explica": "…/weather?q=Barcelona&appid=…&units=metric&lang=ca. The key goes inside the URL; that's why fetch(url) has no second parameter."}, "c7_kelvin": {"enunciat": "And if you forget <code>units=metric<\/code>, in which unit does the temperature arrive?", "pista": "21 °C would be about 294…", "explica": "By default, OpenWeather returns kelvin. With metric: °C and wind in m/s. With imperial: °F.", "opcions": ["In kelvin", "In degrees Fahrenheit", "In degrees Celsius anyway", "It doesn't arrive: error 400"]}, "c7_activa": {"enunciat": "You copied the key correctly, you have just created it, and the Tower answers <b>401<\/b>. Why?", "pista": "Patience…", "explica": "That's why the first step of the session is to sign up for OpenWeather. And you don't need One Call 3.0 (it's a separate subscription); we use Current Weather.", "opcions": ["A new OpenWeather key can take up to 2 hours to activate", "Because you subscribed to One Call 3.0", "Because the key goes in the header", "Because Barcelona doesn't exist"]}, "c7_vent": {"enunciat": "The tower's anemometer shows <code>temps.wind.speed = 5<\/code> (metres per second). How many <b>km/h<\/b> is that?", "pista": "Multiply by 3.6.", "explica": "5 × 3.6 = 18 km/h. In the JSX: {Math.round(temps.wind.speed * 3.6)} km/h.", "solucio": "18 km/h (5 × 3.6)"}, "c7_cel": {"enunciat": "Why do we write <code>const cel = temps?.weather[0];<\/code>?", "pista": "?. is called optional chaining.", "explica": "If temps (weather) is null, cel (sky) is undefined and nothing crashes. Then we render {temps && cel && (…)}.", "opcions": ["weather is an array (there can be more than one sky condition) and we take the first one; ?. avoids the error when temps is still null", "Because weather is a number and [0] turns it into text", "Because ?. makes the request if temps is null", "Because weather[0] is always the temperature"]}, "c7_hooks": {"enunciat": "In <code>TempsCiutat<\/code>, where does the <code>if (!CLAU_OPENWEATHER) return &lt;AvisClau … /&gt;;<\/code> go?", "pista": "“Rendered fewer hooks than expected”…", "explica": "All the hooks at the top; the warning returns, after them.", "opcions": ["After all the useState calls: hooks must always be called, in the same order, never after a return", "Before the useState calls, to save memory", "Inside the useEffect", "Inside the consultar function"]}, "c7_icona": {"enunciat": "The weather icon is at <code>https://openweathermap.org/img/wn/10d@2x.png<\/code>. Do you need to send the key?", "pista": "The same happens with the TMDB posters.", "explica": "Images (icons, posters) are public. Only requests to the data API carry a key.", "opcions": ["No: it's a public image; the browser requests it without a key", "Yes, with appid in the URL", "Yes, with Authorization: Bearer", "Only if the user hasn't logged in"]}, "c8_omple": {"enunciat": "The projector won’t start. Complete the request to TMDB:", "pista": "The second parameter of fetch is the options; headers go in headers.", "explica": "fetch(url, { headers: { Authorization: `Bearer ${TOKEN_TMDB}` } }). Everything else (ok, json, states) is the same as in session 10."}, "c8_token": {"enunciat": "TMDB gives you <b>two<\/b> keys. Which one goes after <code>Bearer<\/code>?", "pista": "The short one goes in the URL (?api_key=…).", "explica": "If you put the short one after Bearer, you will get a 401.", "opcions": ["The API Read Access Token, the long one that starts with eyJ…", "The short API Key with 32 characters", "Either of the two", "The password of your TMDB account"]}, "c8_espai": {"enunciat": "The projectionist has the right token, but TMDB answers <b>401<\/b>. <b>Click the line that fails:<\/b>", "pista": "Count the spaces…", "explica": "«Bearer» + ONE space + the token: `Bearer ${TOKEN_TMDB}`."}, "c8_any": {"enunciat": "For the <b>Dune<\/b> card: what does <code>\"2021-09-15\".slice(0, 4)<\/code> return?", "pista": "The first 4 characters.", "explica": "release_date.slice(0, 4) → \"2021\". If there is no date, the card shows a dash.", "solucio": "\"2021\""}, "c8_cartell": {"enunciat": "A movie has <code>poster_path: null<\/code>. What does the card do?", "pista": "poster_path ? <img> : <div>", "explica": "That is why the type says poster_path: string | null. Posters are at https://image.tmdb.org/t/p/w185 + poster_path.", "opcions": ["It shows a «No poster» box instead of a broken image", "It shows the image anyway with src=\"null\"", "It makes the request again until there is a poster", "It throws an error and doesn’t show the list"]}, "c8_generes": {"enunciat": "On the Afternoon Plan counter there is the dictionary <code>PROPOSTA_PER_TEMPS<\/code>. Match each weather with its genre:", "pista": "Rain: blanket, sofa and an animated film.", "explica": "Record<string, Proposta>: the key is weather[0].main and the value is the TMDB genre. If it isn’t there: PER_DEFECTE (comedy).", "parelles": [["Rain", "Animation (16)"], ["Clear", "Adventure (12)"], ["Clouds", "Mystery (9648)"], ["Thunderstorm", "Thriller (53)"], ["Snow", "Family (10751)"]]}, "c8_pluja": {"enunciat": "Your Weather report says <code>weather[0].main = \"Rain\"<\/code>. Which URL does the second request ask for?", "pista": "Rain → Animation → 16.", "explica": "with_genres: String(proposta.genere). URLSearchParams wants text values: that’s why we use String().", "opcions": ["…/3/discover/movie?with_genres=16&sort_by=popularity.desc", "…/3/discover/movie?with_genres=12&sort_by=popularity.desc", "…/data/2.5/weather?q=Rain", "…/3/search/movie?query=Rain"]}, "c8_cadena": {"enunciat": "In the Afternoon Plan there is no <code>await<\/code> that waits for the first request before the second one. So how are they chained?", "pista": "if (url === null) return;", "explica": "The order happens by itself: changing the city changes urlTemps; when the weather arrives, urlPelis stops being null and the second request starts.", "opcions": ["urlPelis is null until the weather arrives (useApi with null waits); when it arrives, React renders again, urlPelis becomes an address and the second useApi makes the request", "Both requests go out at the same time and TMDB waits for OpenWeather", "useApi uses setTimeout to wait 2 seconds", "They are not chained: the user has to press two buttons"]}, "c8_objecte": {"enunciat": "Why does <code>useApi<\/code> receive the token as <b>text<\/b> and not as an object <code>{ headers: {…} }<\/code>?", "pista": "Dependencies are compared… and two equal objects are not the same object.", "explica": "Dependencies that are texts or numbers: React compares them by value and there is no loop.", "opcions": ["An object written inside the component is new on every render: React sees it as «different», the effect repeats non-stop and you end up with a 429", "Because fetch doesn’t accept objects", "Because objects can’t be passed to a hook", "Because this way the token is encrypted"]}, "c8_consulta": {"enunciat": "Why does the Afternoon Plan have two states, <code>ciutat<\/code> (the input) and <code>consulta<\/code> (what we search for)?", "pista": "B… Ba… Bar… Barc…", "explica": "onSubmit: setConsulta(ciutat.trim()). Changing the query = changing the url = new request.", "opcions": ["If the URL depended on ciutat, we would make one request per key press; consulta only changes when the form is submitted", "Because an input can’t have state", "Because TMDB asks for two city parameters", "To be able to show the city in capital letters"]}, "c9_secret": {"enunciat": "The Proxy Doorman looks you up and down: «You have the key in the .env. Is it hidden from the users of your website?»", "pista": "The .env protects it from GitHub… but what about the browser?", "explica": "The .env stops the key from going to GitHub, but it doesn’t hide it from the browser. For a class project it’s not serious; on a published website, it is.", "opcions": ["No: everything that starts with VITE_ is pasted into the browser’s JavaScript; you can see it in Network → Headers and in dist/assets", "Yes: the .env is never uploaded to GitHub", "Yes: Vite encrypts it when it builds", "Only if you run npm run build"]}, "c9_proxy": {"enunciat": "«And what am I, a proxy?»", "pista": "Middleman…", "explica": "The browser doesn’t talk to TMDB: it talks to our server, and the server is the one that adds the token.", "opcions": ["A middleman server: it receives your request, adds the key and passes it to the API", "A browser extension that hides keys", "A special type of API key", "A React hook"]}, "c9_config": {"enunciat": "Complete the proxy configuration in <code>vite.config.ts<\/code>:", "pista": "The proxy token does NOT have VITE_: the browser must never see it.", "explica": "target = where it is really sent. env.TMDB_TOKEN (without VITE_) is read by loadEnv(mode, process.cwd(), '') in Node."}, "c9_rewrite": {"enunciat": "The browser asks for <code>/tmdb/3/movie/popular<\/code>. With the <code>rewrite<\/code>, which path reaches TMDB?", "pista": "cami.replace(/^\\/tmdb/, '')", "explica": "rewrite removes /tmdb from the start. changeOrigin makes TMDB think the request is addressed to it.", "opcions": ["/3/movie/popular", "/tmdb/3/movie/popular", "/tmdb", "https://localhost/3/movie/popular"]}, "c9_network": {"enunciat": "With example 4 open, you look at DevTools → Network. Does the request have the <code>Authorization<\/code> header?", "pista": "Who adds the token now?", "explica": "The component knows nothing about keys: useApi('/tmdb/3/movie/popular?language=es-ES&region=ES').", "opcions": ["No: it goes to localhost without Authorization; the Vite server adds it on the way to TMDB", "Yes, the same as in example 2", "Yes, but encrypted", "No, because TMDB doesn’t ask for a token any more"]}, "c9_prod": {"enunciat": "«Last one: when you publish the website with <code>npm run build<\/code>, who will be the proxy?»", "pista": "The Vite proxy only exists with npm run dev.", "explica": "The idea is the same: the token lives on the server (as a secret) and the browser only talks to the server.", "opcions": ["A server function (Cloudflare Pages Functions or Workers, Netlify, Vercel or your own backend) with the token saved as a secret", "The same Vite proxy, which is copied to dist/", "The user’s browser", "Nobody: in production you don’t need to hide anything"]}, "c9_401": {"enunciat": "Example 4 gives 401 and the other three work. What is missing?", "pista": "There are three variables in .env.example…", "explica": "VITE_OWM_KEY, VITE_TMDB_TOKEN and TMDB_TOKEN. The proxy uses the third one.", "opcions": ["TMDB_TOKEN (without VITE_) in the .env, and restart npm run dev", "The second await", "Access-Control-Allow-Origin in vite.config.ts", "Nothing: TMDB doesn’t work with a proxy"]}, "c10_raca": {"enunciat": "The Stallholder’s stall sells photos of <b>specific breeds<\/b>. Complete the URL so it depends on the <code>raca<\/code> state of the dropdown:", "pista": "The state variable goes inside ${…}; the endpoint ends the same as always.", "explica": "https://dog.ceo/api/breed/husky/images/random. When raca changes, the URL changes."}, "c10_igual": {"enunciat": "If you go from <code>/breeds/image/random<\/code> to <code>/breed/husky/images/random<\/code>, what changes in the response JSON?", "pista": "The hint of challenge 1 in session 10 tells you.", "explica": "The JSON it returns is identical. That’s why the same type RespostaGos and the same code work.", "opcions": ["Nothing: it returns the same shape, { message, status }; only the URL has changed", "It returns an array of photos instead of one", "The message field is now called image", "You need a new type with the breed field"]}, "c10_beagle": {"enunciat": "You already have the photo from <code>…/breed/beagle/images/random<\/code> in the console. Which breed is written <b>inside the photo address<\/b> (the <code>message<\/code> field)?", "pista": "Look at the part after /breeds/ in the message field.", "explica": "The address contains the breed: https://images.dog.ceo/breeds/beagle/…jpg.", "solucio": "beagle"}, "c10_atzar": {"enunciat": "Surprise wants a «Surprise!» button that picks a Pokémon <b>between 1 and 151<\/b>:", "pista": "Math.random() gives a number between 0 (included) and 1 (not included).", "explica": "Math.floor(Math.random() * 151) gives 0 to 150; with + 1, 1 to 151. PokéAPI accepts the number instead of the name."}, "c10_rang": {"enunciat": "And what if you forget the <code>+ 1<\/code> and write <code>Math.floor(Math.random() * 151)<\/code>?", "pista": "What is the smallest number that can come out?", "explica": "That’s why the Pokédex has disabled={id === 1}: there is no Pokémon number 0.", "opcions": ["Sometimes you get 0, and …/pokemon/0 answers 404", "You get decimal numbers", "You never get 150", "Nothing happens: PokéAPI starts at 0"]}, "c10_abilities": {"enunciat": "Surprise also wants to show the <b>abilities<\/b>. The JSON has <code>\"abilities\": [ { \"ability\": { \"name\": \"static\" } } ]<\/code>. What do you add to <code>type Pokemon<\/code>?", "pista": "It’s an array of objects with an object inside, like types.", "explica": "And to show them: pokemon.abilities.map((a) => a.ability.name).join(', ').", "opcions": ["abilities: { ability: { name: string } }[];", "abilities: string[];", "abilities: { name: string };", "Nothing: TypeScript works it out by itself"]}, "c10_q": {"enunciat": "The Seeker wants to add a facilities search box with <code>$q<\/code>, but <b>without sending it if it’s empty<\/b>:", "pista": "We only add it if the text is NOT empty.", "explica": "parametres.set('$q', …) adds the parameter. Try «biblioteca», «escola» or «poliesportiu»."}, "c10_deps": {"enunciat": "The search text already goes into the URL. What else do you have to change so the list reloads when you type?", "pista": "[url]", "explica": "The hint of challenge 3 tells you. (And if you don’t want one request per letter, split ciutat/consulta like in the Afternoon Plan.)", "opcions": ["Nothing else, if the url is in the effect’s dependencies: changing the text changes the url and the effect asks again", "Add a setInterval that asks every second", "Call fetch inside the input’s onChange", "Reload the page"]}, "c10_tanstack": {"enunciat": "A street vendor offers <b>TanStack Query<\/b> and <b>SWR<\/b>. What do they do that our <code>useFetch<\/code> doesn’t?", "pista": "Cache…", "explica": "Our useFetch is perfect for learning; in big projects people use these libraries.", "opcions": ["They keep responses in a cache, retry if it fails and reload when you come back to the tab", "They make a URL unnecessary", "They hide API keys", "They convert JSON into XML"]}, "c10_vocab": {"enunciat": "At the English vocabulary counter: match each English term with its meaning.", "pista": "Rate = how often; cleanup = tidying up.", "e
